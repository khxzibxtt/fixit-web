services:
  - type: web
    name: fixit-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: WEB_SUPPORT_USER_ID
        sync: false
      - key: PLAY_APP_SHA256
        sync: false
