<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FF5A00" />
  <title>Opening FixIt App...</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    @font-face{font-family:'TT Commons';src:url('/fonts/TTCommonsPro-Normal.otf') format('opentype');font-weight:400;font-display:swap}
    @font-face{font-family:'TT Commons';src:url('/fonts/TTCommonsPro-Bold.otf') format('opentype');font-weight:700;font-display:swap}
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'TT Commons', system-ui, sans-serif; }
    body { background: #F8FAFC; color: #0F172A; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    .card { background: #fff; border-radius: 24px; padding: 36px 28px; max-width: 440px; width: 100%; box-shadow: 0 16px 40px rgba(0,0,0,0.08); border: 1px solid #E2E8F0; }
    .logo { width: 68px; height: 68px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 14px rgba(255,90,0,0.25); }
    .spinner { width: 36px; height: 36px; border: 3.5px solid #E2E8F0; border-top-color: #FF5A00; border-radius: 50%; margin: 18px auto; animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 14.5px; color: #64748B; margin-bottom: 24px; line-height: 1.45; }
    .code-badge { display: inline-block; background: #FFF1E8; color: #E04E00; font-family: monospace; font-size: 16px; font-weight: 800; padding: 6px 16px; border-radius: 99px; margin-bottom: 18px; border: 1px dashed #FF5A00; }
    .btn { display: block; width: 100%; background: #FF5A00; color: #fff; padding: 14px; border-radius: 14px; font-weight: 800; text-decoration: none; font-size: 15px; margin-bottom: 10px; border: 0; cursor: pointer; }
    .btn.secondary { background: #F1F5F9; color: #0F172A; border: 1px solid #CBD5E1; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="FixIt" class="logo" />
    <h2 id="title">Redirecting to FixIt App...</h2>
    <div id="rewardBox" style="display:none">
      <span class="code-badge" id="promoCodeDisplay"></span>
      <p id="rewardDesc">Referral voucher is ready to auto-apply on your account.</p>
    </div>
    <div class="spinner" id="loader"></div>
    <p id="statusText">Attempting to open FixIt installed on your device. If it doesn't open automatically, tap below.</p>

    <a href="#" id="openAppBtn" class="btn">Open in FixIt App</a>
    <a href="/downloads/FixIt-Consumer.apk" id="dlBtn" class="btn secondary">Download Consumer APK</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || params.get('ref') || params.get('promo') || '';
    const jobId = params.get('job_id') || params.get('job') || '';
    const service = params.get('service') || '';

    // Compose deep link custom scheme
    let deepLink = 'fixit://open';
    if (code) {
      deepLink = 'fixit://reward?code=' + encodeURIComponent(code);
      document.getElementById('rewardBox').style.display = 'block';
      document.getElementById('promoCodeDisplay').innerText = 'PROMO: ' + code;
      document.getElementById('title').innerText = 'Claiming Your Reward Voucher';
    } else if (jobId) {
      deepLink = 'fixit://tracking?job_id=' + encodeURIComponent(jobId);
      document.getElementById('title').innerText = 'Opening Live Order #' + jobId;
    } else if (service) {
      deepLink = 'fixit://book?service=' + encodeURIComponent(service);
      document.getElementById('title').innerText = 'Booking Service: ' + service;
    }

    // Compose Android Intent URL for Chrome (works reliably without popup blockers)
    const intentUrl = "intent://" + deepLink.replace("fixit://", "") + "#Intent;scheme=fixit;package=com.khxzi.fixit;end";

    document.getElementById('openAppBtn').href = intentUrl;
    document.getElementById('openAppBtn').onclick = function(e) {
      window.location.href = intentUrl;
      return false;
    };

    // Execute automatic deep link
    const start = Date.now();
    try {
      window.location.href = intentUrl;
    } catch (e) {
      window.location.href = deepLink;
    }

    // If app not installed or fails to open within 2s, prompt APK download
    setTimeout(() => {
      const elapsed = Date.now() - start;
      if (elapsed < 3000) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('statusText').innerText = "Looks like FixIt isn't opened yet. Tap the orange button above to launch, or download the APK below.";
      }
    }, 2000);
  </script>
</body>
</html>
