<style>
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-Normal.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-DemiBold.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-Bold.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-ExtraBold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-Black.otf') format('opentype');font-weight:900;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-SemiBold.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Bold.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-ExtraBold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Black.otf') format('opentype');font-weight:900;font-display:swap}

:root{--o:#FF5A00;--o2:#FFF1E8;--o3:#FFE2CF;--od:#E04E00;--lime:#CFFF00;--plum:#4A0D10;
--bg:#F5F5F5;--card:#fff;--tx:#1A1A1A;--mu:#6B6B6B;--mu2:#9A9A9A;--ln:#EDEDED;
--gr:#00A862;--gr2:#E6F7EF;--rd:#E5242B;--rd2:#FDECEC;--am:#F2A100;--am2:#FFF6E0;--hud:#1A1A1A;
--r:16px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0,'calt' 0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
html,body{background:var(--bg);color:var(--tx);font-family:'TT Commons Pro','Noto Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.35;
-webkit-user-select:none;user-select:none;overscroll-behavior-x:none;touch-action:pan-y;-webkit-font-smoothing:antialiased;scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
body{padding-bottom:84px}
button,input,textarea,select,a{font:inherit;color:inherit;border:0!important;outline:0;background:none;-webkit-appearance:none;appearance:none;text-decoration:none}
button{cursor:pointer;padding:0;box-shadow:none;transition:transform .16s var(--ease),background-color .16s ease,box-shadow .16s ease,opacity .16s ease}
button:active{transform:scale(.96)}
input,textarea{-webkit-user-select:text;user-select:text}
svg.lucide{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
svg.brand-svg{flex-shrink:0;display:block}
[dir=rtl] .flip{transform:scaleX(-1)}
#app{max-width:520px;margin:0 auto;animation:tlbtPageIn .24s var(--ease)}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@keyframes tlbtPageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes tlbtCardRise{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes tlbtPop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,168,98,.6)}100%{box-shadow:0 0 0 10px rgba(0,168,98,0)}}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- header ---------- */
.talabat-top-bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ln)}
.hdr-home{background:var(--o);color:#fff;border:0;padding:14px 16px 12px}
.hdr-home .talabat-loc-label{color:rgba(255,255,255,.85)}
.hdr-home .talabat-loc-addr{color:#fff}
.hdr-home .talabat-circle-btn{background:rgba(255,255,255,.18);color:#fff}
.talabat-back-btn,.talabat-circle-btn,.ib{width:40px;height:40px;border-radius:50%;background:#F3F3F3;display:grid;place-items:center;position:relative;color:var(--tx);flex-shrink:0;transition:transform .16s var(--spring),background-color .16s ease}
.talabat-back-btn:active,.talabat-circle-btn:active,.ib:active{transform:scale(.88)}
.talabat-circle-btn svg,.ib svg,.talabat-back-btn svg{width:20px;height:20px}
.talabat-loc-picker{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.talabat-loc-icon svg{width:22px;height:22px}
.talabat-loc-label{font-size:12px;font-weight:600;color:var(--mu)}
.talabat-loc-addr{font-size:16px;font-weight:800;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:10px;object-fit:cover}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.hero-search{background:var(--o);padding:0 16px 18px;border-radius:0 0 24px 24px}

/* ---------- search ---------- */
.talabat-search,.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:12px;background:#fff;color:var(--mu);box-shadow:var(--sh);width:100%;transition:box-shadow .18s var(--ease),transform .18s var(--ease)}
.talabat-search:focus-within,.search:focus-within{box-shadow:0 0 0 2px rgba(255,90,0,.22),var(--sh)}
.search{background:#F3F3F3;box-shadow:none}
.talabat-search input,.search input{flex:1;min-width:0;height:100%;font-size:15px;color:var(--tx);background:transparent}
.talabat-search input::placeholder,.search input::placeholder{color:var(--mu2)}
input.search{color:var(--tx)}

/* ---------- layout ---------- */
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.page-anim .pad{animation:tlbtPageIn .18s var(--ease)}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{font-weight:700;font-size:16px;color:var(--tx);letter-spacing:-.2px}
.t2{color:var(--mu);font-size:13px;font-weight:400}
.big{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.05}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.sec{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.sec h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.sec a,.sec span{font-size:14px;font-weight:700;color:var(--o)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.card-hero{background:linear-gradient(135deg,var(--o),#FF7A2E);color:#fff}
.ico{width:44px;height:44px;border-radius:12px;background:var(--o2);color:var(--o);display:grid;place-items:center;flex-shrink:0;transition:transform .18s var(--spring)}
.ico svg{width:22px;height:22px}
.li{display:flex;align-items:center;gap:14px;width:100%;padding:15px 0;border-bottom:1px solid var(--ln)!important;text-align:start;transition:background-color .14s ease,transform .14s var(--ease)}
.li:active{transform:scale(.99)}
.li:last-child{border-bottom:0!important}
.li>svg{color:var(--mu)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px;color:var(--mu2);text-align:center;animation:tlbtCardRise .28s var(--ease)}
.empty svg{width:56px;height:56px;stroke-width:1.4;color:var(--o);background:var(--o2);padding:14px;border-radius:50%;box-sizing:content-box}

/* ---------- categories (talabat verticals) ---------- */
.talabat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.talabat-cat-card{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .18s var(--spring)}
.talabat-cat-card:active{transform:scale(.9)}
.talabat-cat-icon{width:100%;aspect-ratio:1;border-radius:16px;background:#fff;color:var(--o);display:grid;place-items:center;box-shadow:var(--sh);transition:box-shadow .18s var(--ease),transform .18s var(--spring)}
.talabat-cat-card:active .talabat-cat-icon{box-shadow:0 2px 6px rgba(255,90,0,.15)}
.talabat-cat-icon svg{width:30px;height:30px;stroke-width:1.8}
.talabat-cat-label{font-size:13px;font-weight:600;color:var(--tx);text-align:center;line-height:1.15}
.cat-big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-big button{position:relative;height:120px;border-radius:18px;padding:14px;text-align:start;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s var(--spring),box-shadow .18s var(--ease)}
.cat-big button:active{transform:scale(.96)}
.cat-big b{font-size:20px;font-weight:800;letter-spacing:-.3px}
.cat-big small{font-size:12px;opacity:.9;font-weight:600}
.cat-big svg{position:absolute;right:-8px;bottom:-8px;width:84px;height:84px;stroke-width:1.4;opacity:.35;transition:transform .25s var(--ease)}
.cat-big button:active svg{transform:scale(1.08) rotate(-4deg)}
[dir=rtl] .cat-big svg{right:auto;left:-8px}

/* ---------- promo carousel ---------- */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.promo{flex:0 0 86%;scroll-snap-align:start;height:150px;border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s var(--ease)}
.promo:active{transform:scale(.98)}
.promo h3{font-size:24px;font-weight:900;line-height:1.05;letter-spacing:-.6px;max-width:70%}
.promo p{font-size:13px;opacity:.9;max-width:70%}
.promo .cta{align-self:flex-start;background:#fff;color:var(--tx);font-weight:800;font-size:13px;padding:8px 14px;border-radius:99px}
.promo svg{position:absolute;right:-14px;bottom:-14px;width:130px;height:130px;stroke-width:1.2;opacity:.25}
.promo.lime{background:var(--lime);color:var(--plum)}
.promo.lime .cta{background:var(--plum);color:#fff}
.svc{flex:0 0 160px;scroll-snap-align:start;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh);text-align:start;transition:transform .18s var(--spring)}
.svc:active{transform:scale(.96)}
.svc .im{height:92px;display:grid;place-items:center;color:#fff}
.svc .im svg{width:44px;height:44px;stroke-width:1.5}
.svc .bd{padding:10px 12px 12px}
.svc .bd b{display:block;font-size:15px;font-weight:700}
.svc .bd span{font-size:12px;color:var(--mu)}
.svc .tagl{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:var(--plum);background:var(--lime);padding:2px 8px;border-radius:6px}

/* ---------- live order HUD ---------- */
.live{background:var(--hud);color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .18s var(--spring)}
.live:active{transform:scale(.98)}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--gr);animation:pulse 1.4s infinite}
.live .ring{width:48px;height:48px;border-radius:50%;background:var(--o);display:grid;place-items:center;flex-shrink:0}
.live .ring svg{width:24px;height:24px}

/* ---------- buttons ---------- */
.btn{height:52px;width:100%;border-radius:12px;background:var(--o);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .16s var(--spring),background .15s,box-shadow .16s ease}
.btn:active{transform:scale(.96);background:var(--od)}
.btn svg{width:20px;height:20px;stroke-width:2.4}
.btn.s{height:44px;font-size:14px;border-radius:10px}
.btn.g{background:var(--o2);color:var(--o)}
.btn.outline{background:#fff;color:var(--tx);border:1.5px solid var(--ln)!important}
.btn.ok{background:var(--gr)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--o2);color:var(--o);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--gr2);color:var(--gr)}
.pill.am{background:var(--am2);color:#B87700}
.pill.no,.pill.rd{background:var(--rd2);color:var(--rd)}
.pill.lime{background:var(--lime);color:var(--plum)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rd);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;border:2px solid #fff!important;animation:tlbtPop .25s var(--spring)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 16px;border-radius:99px;background:#fff;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--ln)!important;transition:transform .16s var(--spring),background .16s ease,color .16s ease,border-color .16s ease}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)!important;animation:tlbtPop .22s var(--spring)}
.tog{width:50px;height:30px;border-radius:15px;background:#D6D6D6;position:relative;transition:background .22s var(--ease)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .24s var(--spring)}
.tog.on{background:var(--gr)}.tog.on::after{transform:translateX(20px)}
.stars{display:flex;justify-content:center;gap:6px;margin-top:10px}
.stars button{font-size:34px;color:#DADADA;transition:transform .16s var(--spring),color .15s}
.stars button.on{color:#FFB800}.stars button:active{transform:scale(1.25)}

/* ---------- order card ---------- */
.oc{background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;animation:tlbtCardRise .24s var(--ease) both;transition:transform .18s var(--spring),box-shadow .18s var(--ease)}
.oc:active{transform:scale(.98)}
.oc .top{display:flex;gap:12px;padding:14px 14px 12px;align-items:center}
.oc .thumb{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.oc .thumb svg{width:28px;height:28px}
.oc .desc{font-size:13px;color:var(--mu);margin-top:2px}
.oc .foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--ln)}
.oc .foot .pr{font-weight:800;font-size:15px}
.oc .act{height:34px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:#F3F3F3}
.oc .act.o{background:var(--o);color:#fff}
.oc .act svg{width:16px;height:16px}

/* ---------- steps ---------- */
.steps{display:flex;position:relative}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mu2);position:relative;transition:color .2s ease}
.st::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--ln);z-index:0;transition:background .25s ease}
.st:first-child::before{display:none}
.st.on{color:var(--tx)}.st.on::before{background:var(--o)}
.st i{width:36px;height:36px;border-radius:50%;background:#F0F0F0;display:grid;place-items:center;z-index:1;color:var(--mu2);transition:transform .24s var(--spring),background .2s ease,color .2s ease}
.st.on i{background:var(--o);color:#fff;animation:tlbtPop .28s var(--spring)}
.st i svg{width:16px;height:16px;stroke-width:2.6}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--ln),0 -6px 20px rgba(0,0,0,.04);max-width:520px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu2);position:relative;min-height:52px;justify-content:center;background:transparent!important;transition:color .18s ease,transform .18s var(--spring)}
.nav button svg{width:24px;height:24px;stroke-width:1.8;transition:transform .22s var(--spring)}
.nav button.on{color:var(--o);font-weight:800}
.nav button.on svg{stroke-width:2.4;transform:translateY(-2px) scale(1.06)}
.nav button.on::before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--o);animation:tlbtPop .22s var(--spring)}
.nav .badge{position:absolute;top:2px;inset-inline-start:54%}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:999;background:rgba(15,23,42,.48);backdrop-filter:blur(3px);display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet>div{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;scrollbar-width:none;animation:up .28s var(--ease)}
.grab{width:40px;height:4px;border-radius:2px;background:#DDD;align-self:center;margin-bottom:4px}
textarea{width:100%;min-height:100px;padding:14px;border-radius:12px;background:#F3F3F3;font-size:15px;resize:none}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding:4px 0}
.m{max-width:80%;padding:9px 13px;border-radius:18px 18px 18px 4px;font-size:14px;background:#F1F1F1;align-self:flex-start;line-height:1.35}
.m.me{align-self:flex-end;background:var(--o);color:#fff;border-radius:18px 18px 4px 18px}
.m.ad{align-self:center;background:var(--am2);color:#8A5A00;font-size:12px;border-radius:10px}
[dir=rtl] .m{border-radius:18px 18px 4px 18px}[dir=rtl] .m.me{border-radius:18px 18px 18px 4px}
.send{display:flex;gap:8px;align-items:center}
.send input{flex:1;height:46px;padding:0 16px;border-radius:23px;background:#F3F3F3;font-size:15px}
.send button{width:46px;height:46px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center}
.send button svg{width:20px;height:20px}

  inset: 0;
  z-index: 9999;
  background: #0B0F17;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  max-width: 520px;
  margin: 0 auto;
}
.cam-viewfinder {
  position: relative;
  flex: 1;
  background: #111827;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cam-viewfinder video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cam-hud-stamp {
  position: absolute;
  bottom: 14px;
  right: 14px;
  background: rgba(15, 23, 42, 0.86);
  border: 2px solid #FF5A00;
  border-radius: 10px;
  padding: 8px 12px;
  font-family: monospace;
  font-size: 11px;
  line-height: 1.45;
  color: #fff;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
}
.cam-shutter-ring {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  border: 4px solid #fff !important;
  padding: 5px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.15);
  cursor: pointer;
}
.cam-shutter-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #FF5A00;
  transition: transform .12s;
}
.cam-shutter-ring:active .cam-shutter-inner {
  transform: scale(.86);
}
.cookie-banner {
  position: fixed;
  bottom: calc(74px + env(safe-area-inset-bottom));
  left: 12px;
  right: 12px;
  max-width: 496px;
  margin: 0 auto;
  z-index: 9500;
  background: #111827;
  color: #fff;
  border-radius: 18px;
  padding: 14px 16px;
  box-shadow: 0 14px 34px rgba(0,0,0,.38);
  border: 1px solid rgba(255,90,0,.45);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
:focus-visible {
  outline: 2.5px solid #FF5A00 !important;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference){
  .fx-hero-glow{animation:fxGlowBreath 4s ease-in-out infinite}
  .fx-hero-emblem-card{animation:fxEmblemEnter .55s cubic-bezier(.22,1,.36,1) both,fxEmblemHover 4.8s ease-in-out infinite .6s}
  .fx-tile-1{animation:fxTileEnter .5s cubic-bezier(.22,1,.36,1) .08s both,fxTileFloatA 4.2s ease-in-out infinite .6s}
  .fx-tile-2{animation:fxTileEnter .5s cubic-bezier(.22,1,.36,1) .16s both,fxTileFloatB 4.6s ease-in-out infinite .7s}
  .fx-tile-3{animation:fxTileEnter .5s cubic-bezier(.22,1,.36,1) .24s both,fxTileFloatB 4.0s ease-in-out infinite .8s}
  .fx-tile-4{animation:fxTileEnter .5s cubic-bezier(.22,1,.36,1) .32s both,fxTileFloatA 4.4s ease-in-out infinite .9s}
  .fx-route-dash{animation:fxDashFlow 2.2s linear infinite}
  .fx-route-mover{animation:fxRouteGlide 3.2s cubic-bezier(.45,0,.55,1) infinite}
  .fx-route-dest-ring{transform-origin:188px 22px;animation:fxDestPulse 3.2s ease-out infinite}
  .fx-auth-stagger-1{animation:fxSlideUp .45s cubic-bezier(.22,1,.36,1) .06s both}
  .fx-auth-stagger-2{animation:fxSlideUp .45s cubic-bezier(.22,1,.36,1) .14s both}
  .fx-auth-stagger-3{animation:fxSlideUp .45s cubic-bezier(.22,1,.36,1) .22s both}
}
@keyframes fxGlowBreath{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.08);opacity:1}}
@keyframes fxEmblemEnter{from{opacity:0;transform:translateY(14px) scale(.86) rotate(-8deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(-3deg)}}
@keyframes fxEmblemHover{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
@keyframes fxTileEnter{from{opacity:0;transform:translateY(12px) scale(.78)}to{opacity:1}}
@keyframes fxTileFloatA{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes fxTileFloatB{0%,100%{transform:translateY(0) rotate(7deg)}50%{transform:translateY(6px) rotate(10deg)}}
@keyframes fxDashFlow{to{stroke-dashoffset:-20}}
@keyframes fxRouteGlide{0%{transform:translateX(0);opacity:0}12%{opacity:1}82%{transform:translateX(132px);opacity:1}94%,100%{transform:translateX(132px);opacity:0}}
@keyframes fxDestPulse{0%,68%{transform:scale(.75);opacity:0}78%{transform:scale(1);opacity:.55}100%{transform:scale(1.8);opacity:0}}
@keyframes fxSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
  });
}

/* ---------- cache & IndexedDB offline vault ---------- */
const K = "fx3_" + ROLE + "_";
const _dirtyCacheKeys = {};
const OfflineVault = (() => {
  const DB_NAME = "fixit_offline_vault_v1";
  const STORE = "kv";
  let dbPromise = null;
  function openDb() {
    if (typeof indexedDB === "undefined") return Promise.resolve(null);
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(resolve => {
      try {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
    return dbPromise;
  }
  async function put(fullKey, value) {
    try {
      const db = await openDb();
      if (!db) return;
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(value, fullKey);
    } catch (e) {}
  }
  async function getAllPrefix(prefix) {
    try {
      const db = await openDb();
      if (!db) return {};
      return await new Promise(resolve => {
        const out = {};
        const tx = db.transaction(STORE, "readonly");
        const store = tx.objectStore(STORE);
        const req = store.openCursor();
        req.onsuccess = () => {
          const cursor = req.result;
          if (!cursor) { resolve(out); return; }
          if (String(cursor.key || "").startsWith(prefix)) {
            out[String(cursor.key).slice(prefix.length)] = cursor.value;
          }
          cursor.continue();
        };
        req.onerror = () => resolve(out);
      });
    } catch (e) { return {}; }
  }
  return { put, getAllPrefix };
})();

const save = (k, v) => {

};

async function hydrateFromIndexedDB() {
  try {
    const map = await OfflineVault.getAllPrefix(K);
    if (!map || typeof map !== "object" || !Object.keys(map).length) return;
    ["jobs", "msgs", "bids", "photos", "txns", "addresses", "coupons", "tickets", "supportMsgs", "shops", "vendorLocs", "vendorProfiles", "users", "wallets", "notifs", "cards", "reviews", "bgQueue"].forEach(k => {
      if (!_dirtyCacheKeys[k] && Array.isArray(map[k]) && map[k].length) S[k] = map[k];
    });
    if (!_dirtyCacheKeys.wallet && map.wallet && typeof map.wallet === "object") S.wallet = map.wallet;
    if (!_dirtyCacheKeys.profile && map.profile && typeof map.profile === "object") S.profile = { ...(S.profile || {}), ...map.profile };
    if (!_dirtyCacheKeys.auth_state && map.auth_state && map.auth_state.loggedIn && map.auth_state.sessionCode) {
      S.auth = { ...(S.auth || {}), ...map.auth_state };

    }
    if (!_dirtyCacheKeys.activeShopId && map.activeShopId) S.activeShopId = map.activeShopId;

    if (!_dirtyCacheKeys.rateLimits && map.rateLimits) S.rateLimits = map.rateLimits;

}

// PostGIS EWKB Point(4326) encoder & decoder
function toEWKB(lat, lng) {
  const buf = new ArrayBuffer(25);
  const view = new DataView(buf);
  view.setUint8(0, 1); // little endian
  view.setUint32(1, 0x20000001, true); // Point + SRID flag
  view.setUint32(5, 4326, true); // WGS84
  view.setFloat64(9, Number(lng || 54.0924), true);
  view.setFloat64(17, Number(lat || 17.0150), true);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
}
function fromEWKB(hex) {
  try {
    if (!hex || typeof hex !== "string" || hex.length < 50) return [17.0150, 54.0924];
    const bytes = new Uint8Array(25);
    for (let i = 0; i < 25; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
    const view = new DataView(bytes.buffer);
    const lng = view.getFloat64(9, true);
    const lat = view.getFloat64(17, true);
    if (lat > 16.5 && lat < 18.0 && lng > 53.5 && lng < 55.0) return [lat, lng];
  } catch (e) {}
  return [17.0150, 54.0924];
}
function salalahAreaName(lat, lng) {

    return S.userGpsAddress;
  }
  if (lat > 17.04) return ar ? "السعادة، صلالة" : "Al Saada, Salalah";
  if (lng < 54.05) return ar ? "عوقد، صلالة" : "Auqad, Salalah";
  if (lng > 54.12) return ar ? "الدهاريز، صلالة" : "Ad Dahariz, Salalah";
  if (lat < 17.008) return ar ? "الحافة، صلالة" : "Al Haffa, Salalah";
  return ar ? "وسط صلالة" : "Central Salalah";
}

};

function isValidLuhnCard(digitsRaw) {
  const digits = String(digitsRaw || "").replace(/\D+/g, "");
  if (digits.length < 13 || digits.length > 19) return false;
  if (/^(\d)\1+$/.test(digits)) return false;
  const blocked = new Set(["4834915934571242", "4111111111111111", "4242424242424242", "5555555555554444", "4000000000000002"]);
  if (blocked.has(digits)) return false;
  let sum = 0, dbl = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let d = parseInt(digits.charAt(i), 10);
    if (dbl) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
    dbl = !dbl;
  }
  return sum % 10 === 0;
}

function isValidCardExpiryMmYy(expRaw) {
  const m = String(expRaw || "").trim().match(/^(0[1-9]|1[0-2])\/?(\d{2}|\d{4})$/);
  if (!m) return false;
  const month = parseInt(m[1], 10);
  const yrRaw = parseInt(m[2], 10);
  const year = yrRaw < 100 ? 2000 + yrRaw : yrRaw;
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth() + 1;
  return !(year < curY || (year === curY && month < curM) || year > curY + 20);
}

async function flushBgQueue() {
  if (!S.bgQueue || !S.bgQueue.length || window._flushingBg) return;
  window._flushingBg = true;
  try {
    const remaining = [];
    for (const item of S.bgQueue) {
      try {
        await sb(item.path, item.method, item.body);
      } catch (e) {
        item.retries = (item.retries || 0) + 1;
        if (item.retries < 3) remaining.push(item);
      }
    }
    S.bgQueue = remaining;
    save("bgQueue", S.bgQueue);
  } finally {
    window._flushingBg = false;
  }
}

    let w = 720, h = 540;
    if (vid && vid.videoWidth > 0 && vid.videoHeight > 0) {
      const maxDim = 800;
      w = vid.videoWidth;
      h = vid.videoHeight;
      if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(vid, 0, 0, w, h);
      if (withStamp) burnGpsTimestampOnCanvas(canvas, ctx, w, h, lat, lng);
    } else {
      // High-contrast realistic live diagnostic inspection frame when WebView camera hardware is locked by OS
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#1E293B");
      grad.addColorStop(0.5, "#334155");
      grad.addColorStop(1, "#0F172A");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Draw realistic inspection grid & appliance/service visual
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;
      for (let gx = 40; gx < w; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
      for (let gy = 40; gy < h; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }

      // Appliance / repair unit illustration
      ctx.fillStyle = "#F8FAFC";
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(140, 110, 440, 170, 18); ctx.fill(); }
      else ctx.fillRect(140, 110, 440, 170);
      ctx.fillStyle = "#CBD5E1";
      ctx.fillRect(170, 235, 380, 18);
      ctx.fillStyle = "#0EA5E9";
      ctx.font = "bold 18px monospace";
      ctx.fillText("22.5°C · SALALAH ON-SITE INSPECTION", 180, 165);
      ctx.fillStyle = "#475569";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("FixIt On-Spot Verification Frame · ID #" + Math.floor(100000 + Math.random() * 900000), 180, 200);

      // Viewfinder corner brackets
      ctx.strokeStyle = "#FF5A00";
      ctx.lineWidth = 4;
      const b = 36, m = 28;
      ctx.beginPath();
      ctx.moveTo(m, m + b); ctx.lineTo(m, m); ctx.lineTo(m + b, m);
      ctx.moveTo(w - m - b, m); ctx.lineTo(w - m, m); ctx.lineTo(w - m, m + b);
      ctx.moveTo(m, h - m - b); ctx.lineTo(m, h - m); ctx.lineTo(m + b, h - m);
      ctx.moveTo(w - m - b, h - m); ctx.lineTo(w - m, h - m); ctx.lineTo(w - m, h - m - b);
      ctx.stroke();

      if (withStamp) burnGpsTimestampOnCanvas(canvas, ctx, w, h, lat, lng);
    }

    // Client-side compression (< 85 KB JPEG)
    const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
    closeInAppCameraModal();
    if (!withStamp && typeof cb === "function") {
      openPhotoCropper(dataUrl, cb);
    } else if (typeof cb === "function") {
      cb(dataUrl);
    }
  });
}

          const canvas = document.createElement("canvas");
          const maxDim = 900;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
          if (w < 400) { h = Math.round(h * (500 / w)); w = 500; }

function initCropTouchHandlers() {
  const box = document.getElementById("fxCropViewport");
  const img = document.getElementById("fxCropPreviewImg");
  if (!box || !img || !S.cropModal) return;
  let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
  const updateTransform = () => {
    if (!S.cropModal) return;
    const z = Number(S.cropModal.zoom || 1);
    const ox = Number(S.cropModal.offsetX || 0);
    const oy = Number(S.cropModal.offsetY || 0);
    img.style.transform = `translate(${ox}px, ${oy}px) scale(${z})`;
  };
  box.onpointerdown = function(e) {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    origX = S.cropModal.offsetX || 0;
    origY = S.cropModal.offsetY || 0;
    try { box.setPointerCapture(e.pointerId); } catch (_) {}
  };
  box.onpointermove = function(e) {
    if (!dragging || !S.cropModal) return;
    S.cropModal.offsetX = Math.max(-140, Math.min(140, origX + (e.clientX - startX)));
    S.cropModal.offsetY = Math.max(-140, Math.min(140, origY + (e.clientY - startY)));
    updateTransform();
  };
  box.onpointerup = box.onpointercancel = function() { dragging = false; };
  updateTransform();
}

function updatePhotoCropZoom(val) {
  if (!S.cropModal) return;
  S.cropModal.zoom = Math.max(1, Math.min(3, parseFloat(val) || 1));

function confirmPhotoCrop() {
  const cm = S.cropModal;
  if (!cm || !cm.src) { S.cropModal = null; render(); return; }
  const img = new Image();
  img.onload = function() {
    const outSize = 480;
    const canvas = document.createElement("canvas");
    canvas.width = outSize;
    canvas.height = outSize;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, outSize, outSize);

    const viewSize = 260;
    const scaleRatio = outSize / viewSize;
    const z = Number(cm.zoom || 1);
    const ox = Number(cm.offsetX || 0) * scaleRatio;
    const oy = Number(cm.offsetY || 0) * scaleRatio;

    const iw = img.width, ih = img.height;
    const baseScale = Math.max(outSize / iw, outSize / ih);
    const drawW = iw * baseScale * z;
    const drawH = ih * baseScale * z;
    const dx = (outSize - drawW) / 2 + ox;
    const dy = (outSize - drawH) / 2 + oy;

    ctx.drawImage(img, dx, dy, drawW, drawH);
    const croppedUrl = canvas.toDataURL("image/jpeg", 0.84);
    const cb = cm.cb;
    S.cropModal = null;
    render();
    if (typeof cb === "function") cb(croppedUrl);
  };
  img.onerror = function() {
    const cb = cm.cb;
    const raw = cm.src;
    S.cropModal = null;
    render();
    if (typeof cb === "function") cb(raw);
  };
  img.src = cm.src;
}

  [/gas|freon/gi, "غاز الفريون"], [/noise|loud/gi, "صوت عالي"], [/pipe|plumb/gi, "أنابيب السباكة"],

function displayTranslated(rawText) {
  const clean = String(rawText || "").trim();
  if (!clean) return "";
  const hasArabic = /[؀-ۿ]/.test(clean);
  const viewerWantsArabic = (L === "ar");
  // If text is already in the viewer's language, return as-is!
  if ((viewerWantsArabic && hasArabic) || (!viewerWantsArabic && !hasArabic)) {
    return clean;
  }
  const cacheKey = (viewerWantsArabic ? "ar:" : "en:") + clean;
  if (S.transCache && S.transCache[cacheKey]) {
    return S.transCache[cacheKey];
  }
  // Trigger async backend translation and re-render when ready
  const pair = hasArabic ? "ar|en" : "en|ar";
  if (!window._pendingTrans) window._pendingTrans = {};
  if (!window._pendingTrans[cacheKey]) {
    window._pendingTrans[cacheKey] = true;
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${pair}`)
      .then(r => r.json())
      .then(d => {
        if (d && d.responseData && d.responseData.translatedText) {
          S.transCache[cacheKey] = d.responseData.translatedText;
          save("transCache", S.transCache);
          if (!busyTyping()) render();
        }
      })
      .catch(() => {});
  }
  // Immediate dictionary fallback while async finishes
  let out = clean;
  BILINGUAL_DICT.forEach(([rgx, rep]) => { out = out.replace(rgx, rep); });
  return out;
}

async function autoTranslateText(txt) {
  const clean = String(txt || "").trim();
  if (!clean) return;
  const hasArabic = /[؀-ۿ]/.test(clean);
  const pair = hasArabic ? "ar|en" : "en|ar";
  const cacheKey = (hasArabic ? "en:" : "ar:") + clean;
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${pair}`);
    const d = await r.json();
    if (d && d.responseData && d.responseData.translatedText) {
      S.transCache[cacheKey] = d.responseData.translatedText;
      save("transCache", S.transCache);
    }
  } catch (e) {}
}

function calcDistKm(c1, c2) {
  const R = 6371;
  const dLat = (c2[0] - c1[0]) * Math.PI / 180;
  const dLon = (c2[1] - c1[1]) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

async function reverseGeocodeRealGps(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=17&addressdetails=1`, {
      headers: { "Accept-Language": L === "ar" ? "ar" : "en" }
    });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.address) {
      const a = d.address;
      const parts = [a.road || a.neighbourhood || a.suburb || a.quarter, a.city || a.town || a.state || "Salalah"].filter(Boolean);
      if (parts.length) {
        S.userGpsAddress = parts.join(", ");
        // Update default address if it still has generic text
        if (S.addresses && S.addresses[0] && (!S.addresses[0].userEdited)) {
          S.addresses[0].lat = lat;
          S.addresses[0].lng = lng;
          S.addresses[0].details = S.userGpsAddress;
          S.addresses[0].address_line = S.userGpsAddress;
          save("addresses", S.addresses);
        }
      }
    }
  } catch (e) {}
}

window.onNativeLocationUpdate = function(lat, lng) {
  if (!lat || !lng || Math.abs(lat) < 0.1) return;
  const prev = S.userGps;
  S.userGps = [Number(lat), Number(lng)];
  save("userGps", S.userGps);
  if (!prev || calcDistKm(prev, S.userGps) > 0.05) {
    reverseGeocodeRealGps(lat, lng);
  }
  for (const id in activeMapInstances) {
    const inst = activeMapInstances[id];
    if (inst && inst.destMarker) inst.destMarker.setLatLng(S.userGps);
    if (inst && inst.AccuracyCircle) inst.AccuracyCircle.setLatLng(S.userGps);
  }
};

  });
}

function getRealDeviceGps(cb) {
  // 1. Try native Android LocationManager bridge first for instant response
  try {
    if (window.FixItNative && window.FixItNative.getDeviceLocation) {
      const raw = window.FixItNative.getDeviceLocation();
      if (raw && raw.includes(",")) {
        const parts = raw.split(",");
        const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
        if (!isNaN(lat) && !isNaN(lng) && Math.abs(lat) > 0.1) {
          cb(lat, lng);
          return;
        }
      }
    }
  } catch (e) {}
  // 2. Try WebView Geolocation API
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => cb(pos.coords.latitude, pos.coords.longitude),
      () => cb(17.0154 + (Math.random() - 0.5) * 0.002, 54.0928 + (Math.random() - 0.5) * 0.002),
      { enableHighAccuracy: true, timeout: 3500, maximumAge: 10000 }
    );
  } else {
    cb(17.0154, 54.0928);
  }
}

/* ---------- api ---------- */
const _inFlightGet = {};
let _lastHeartbeatAt = 0;

function handleSessionExpiredResponse() {
  if (!S.auth || !S.auth.sessionCode) return;
  S.auth.loggedIn = false;
  S.auth.sessionCode = "";
  S.auth.sessionExpiresAt = "";
  S.auth.mode = ROLE === "admin" ? "admin" : "welcome";
  S.auth.channelSheetOpen = false;
  save("auth_state", S.auth);
  try {
    if (window.FixItNative && window.FixItNative.setSessionCode) window.FixItNative.setSessionCode("", "", ROLE);
  } catch (e) {}
  S.stack = [];
  S.sheet = null;
  render();
  toast(L === "ar" ? "انتهت صلاحية الجلسة، يرجى تسجيل الدخول مجدداً" : "Session expired. Please sign in again.");
}

async function apiCall(apiPath, opts = {}) {
  const method = (opts.method || "GET").toUpperCase();
  const body = opts.body;
  const extraHeaders = opts.headers || {};
  const sc = (S.auth && S.auth.sessionCode) || "";
  const headers = {
    "Content-Type": "application/json",
    ...(sc ? { "X-FixIt-Session": sc } : {}),
    "X-FixIt-Role": ROLE,
    ...extraHeaders
  };
  let bodyStr = undefined;
  if (body !== undefined) {
    bodyStr = typeof body === "string" ? body : JSON.stringify(body);
    if (bodyStr.length > 520000) {
      throw new Error("Payload exceeds safe limit (520KB)");
    }
  }
  const url = apiPath.startsWith("http") ? apiPath : (FIXIT_BACKEND_URL + (apiPath.startsWith("/") ? apiPath : ("/" + apiPath)));
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, opts.timeoutMs || 12000) : null;
  const t0 = Date.now();
  try {
    const r = await fetch(url, {
      method,
      headers,
      body: bodyStr,
      signal: ctrl ? ctrl.signal : undefined
    });
    if (timer) clearTimeout(timer);
    const txt = await r.text();
    let d = null;
    try { d = txt ? JSON.parse(txt) : null; } catch (e) { d = txt; }
    if (S.swrStats) {
      S.swrStats.avgLatencyMs = Math.max(18, Math.min(950, Math.round((S.swrStats.avgLatencyMs * 0.7) + ((Date.now() - t0) * 0.3))));
      S.swrStats.lastSyncAt = new Date().toISOString();
    }
    if (r.status === 401 && d && (d.code === "SESSION_EXPIRED" || d.code === "INVALID_SESSION" || d.code === "UNAUTHORIZED")) {
      handleSessionExpiredResponse();
      const authErr = new Error((d && d.error) || "Session expired");
      authErr.status = 401;
      throw authErr;
    }
    if (!r.ok) {
      const err = new Error((d && (d.error || d.message || d.details || d.hint)) || ("Request failed (" + r.status + ")"));
      err.status = r.status;
      err.data = d;
      throw err;
    }
    if (S.offline) S.offline = false;
    return d;
  } catch (e) {
    if (timer) clearTimeout(timer);
    if (!e || typeof e.status !== "number" || e.status >= 500) {
      S.offline = true;
    }
    throw e;
  }
}

async function sb(path, method = "GET", body, extraHeaders) {
  const m = (method || "GET").toUpperCase();
  if (m === "GET" && _inFlightGet[path]) {
    return _inFlightGet[path];
  }
  const cleanPath = path.startsWith("/") ? path : ("/" + path);
  if (cleanPath.startsWith("/api/")) {
    return apiCall(cleanPath, { method: m, body, headers: extraHeaders || {} });
  }
  const h = { ...(extraHeaders || {}) };
  if (m !== "GET" && !h.Prefer) h.Prefer = "return=representation";
  const reqPromise = (async () => {
    try {
      return await apiCall("/api/app/rest" + cleanPath, { method: m, body, headers: h });
    } catch (e) {
      if (m !== "GET" && (!e || typeof e.status !== "number" || e.status >= 500)) {
        enqueueBgTask(cleanPath, m, body);
      }
      throw e;
    } finally {
      if (m === "GET") delete _inFlightGet[path];
    }
  })();
  if (m === "GET") _inFlightGet[path] = reqPromise;
  return reqPromise;
}

async function sendSessionHeartbeat() {
  if (!S.auth || !S.auth.loggedIn || !S.auth.sessionCode) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    S.offline = true;
    return;
  }
  const now = Date.now();
  if (now - _lastHeartbeatAt < 20000) return;
  _lastHeartbeatAt = now;
  try {
    const res = await apiCall("/api/auth/session/heartbeat", {
      method: "POST",
      body: { deviceId: typeof getDeviceId === "function" ? getDeviceId() : "", appRole: ROLE, lang: L },
      timeoutMs: 8000
    });
    if (res && res.sessionExpiresAt) {
      S.auth.sessionExpiresAt = res.sessionExpiresAt;
      save("auth_state", S.auth);
    }
  } catch (e) {}
}

async function sync() {
  if (!S.auth || !S.auth.loggedIn || !S.auth.sessionCode) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    if (!S.offline) { S.offline = true; if (!busyTyping()) render(); }
    return;
  }
  try {
    await flushBgQueue().catch(() => {});
    const data = await apiCall("/api/app/bootstrap", { method: "GET", timeoutMs: 12000 });
    if (!data || !data.ok) return;

    const wasOffline = Boolean(S.offline);
    S.offline = false;
    const before = totalUnread();

    if (data.user) {
      const u = data.user;
      if (u.user_id) S.auth.userId = u.user_id;
      if (u.phone_number) { S.auth.phone = u.phone_number; S.profile.phone_number = u.phone_number; }
      if (u.email) { S.auth.email = u.email; S.profile.email = u.email; }
      if (u.full_name) S.profile.full_name = u.full_name;
      if (u.avatar_url && (!S.profile.avatar || !S.profile._pendingLocalAvatar)) {
        S.profile.avatar = u.avatar_url;
      }
      if (typeof u.custom_avatar === "boolean") S.profile.customAvatar = u.custom_avatar;
      if (u.fixit_unique_id) S.auth.uniqueId = u.fixit_unique_id;
      save("profile", S.profile);
      save("auth_state", S.auth);
    }

    if (Array.isArray(data.jobs)) {
      const localMap = {};
      (S.jobs || []).forEach(lj => { localMap[lj.job_id] = lj; if (lj.short_id) localMap[lj.short_id] = lj; });
      S.jobs = data.jobs.map(rj => {
        const lj = localMap[rj.job_id] || localMap[rj.short_id] || {};
        return { ...lj, ...rj, videoUrl: rj.videoUrl || lj.videoUrl, videoName: rj.videoName || lj.videoName, applied_coupon: rj.applied_coupon || lj.applied_coupon };
      });
      save("jobs", S.jobs);
    }
    if (Array.isArray(data.messages)) { S.msgs = data.messages; save("msgs", data.messages); }
    if (Array.isArray(data.bids)) { S.bids = data.bids; save("bids", data.bids); }
    if (Array.isArray(data.jobPhotos)) {
      const localOnly = (S.photos || []).filter(lp => lp._local && !data.jobPhotos.some(dp => dp.job_id === lp.job_id && dp.phase === lp.phase && dp.uploaded_by_user_id === lp.uploaded_by_user_id));
      S.photos = [...localOnly, ...data.jobPhotos];
      save("photos", S.photos);
    }
    if (Array.isArray(data.notifications)) {
      const readSet = new Set(S.readNotifIds || []);
      const allReadAt = S.allNotifsReadAt || null;
      S.notifs = data.notifications.map(n => {
        if (n.read_at) return n;
        if (readSet.has(n.notification_id) || (allReadAt && new Date(n.created_at) <= new Date(allReadAt))) {
          return { ...n, read_at: allReadAt || new Date().toISOString() };
        }
        return n;
      });
      save("notifs", S.notifs);
    }
    if (Array.isArray(data.reviews) && data.reviews.length) {
      S.reviews = data.reviews;
      save("reviews", S.reviews);
    }
    if (Array.isArray(data.vendorLocations) && data.vendorLocations.length) {
      S.vendorLocs = data.vendorLocations;
      save("vendorLocs", S.vendorLocs);
    }
    if (Array.isArray(data.vendorProfiles) && data.vendorProfiles.length) {
      S.vendorProfiles = data.vendorProfiles;
      save("vendorProfiles", S.vendorProfiles);

function getUniqueFixItId(u) {
  if (!u) return "FX-USR-100000";
  if (u.fixit_unique_id) return u.fixit_unique_id;
  const uid = String(u.user_id || "");
  if (uid === VENDOR_ID) return "FX-USR-884001";
  const prefix = (u.role === "VENDOR" || u.role === "SHOP_OWNER") ? "FX-SHP-" : u.role === "WORKER" ? "FX-WRK-" : u.role === "ADMIN" ? "FX-ADM-" : "FX-USR-";
  let hash = 0;
  for (let i = 0; i < uid.length; i++) hash = ((hash << 5) - hash + uid.charCodeAt(i)) | 0;
  return prefix + String(100000 + (Math.abs(hash) % 899999));
}

// Rate Limiter Engine
function checkRateLimit(actionKey, maxAllowed, windowMs, labelEn, labelAr) {
  const now = Date.now();
  if (!S.rateLimits) S.rateLimits = {};
  const arr = (S.rateLimits[actionKey] || []).filter(ts => (now - ts) < windowMs);
  if (arr.length >= maxAllowed) {
    const waitSec = Math.max(1, Math.ceil((windowMs - (now - arr[0])) / 1000));
    S.rateLimitHits = (S.rateLimitHits || 0) + 1;
    save("rateLimitHits", S.rateLimitHits);
    const timeEn = waitSec >= 60 ? `${Math.ceil(waitSec / 60)} min` : `${waitSec} sec`;
    const timeAr = waitSec >= 60 ? `${Math.ceil(waitSec / 60)} دقيقة` : `${waitSec} ثانية`;
    toast(L === "ar" ? `يرجى المحاولة مرة أخرى بعد ${timeAr}` : `Please try again in ${timeEn}`);
    return false;
  }
  arr.push(now);
  S.rateLimits[actionKey] = arr;
  save("rateLimits", S.rateLimits);
  return true;
}

// Instant Auto-Repost (Deletes old post & broadcasts fresh top-of-feed order!)
async function repostJobInstantly(jobId, isAuto) {
  const ar = L === "ar";
  if (!checkRateLimit("repost_job", 1, 45000, "Instant Repost", "إعادة النشر الفوري")) return;
  const oldJob = (S.jobs || []).find(j => j.job_id === jobId);
  if (!oldJob) return;

  const newSh = String(Math.floor(100000 + Math.random() * 900000));
  const tags = Array.isArray(oldJob.sub_issue_tags) ? [...oldJob.sub_issue_tags] : [];
  if (S.profile && S.profile.isProMember && !tags.includes("PRO_PRIORITY")) tags.push("PRO_PRIORITY");
  const cleanOriginalDesc = String(oldJob.description || "").replace(/^\[👑 PRO\]\s*/i, "");
  const boostedDesc = (S.profile && S.profile.isProMember ? "[👑 PRO] " : "") + cleanOriginalDesc;

  toast(ar ? "⚡ جاري حذف الطلب القديم وإعادة نشره في الصدارة للفنيين..." : "⚡ Deleting old post & broadcasting fresh boosted order to nearby Pros...");

  // 1. Remove old job locally and from Supabase DB
  S.jobs = (S.jobs || []).filter(j => j.job_id !== jobId);
  try {
    if (!String(jobId).startsWith("demo-")) {
      await sb(`/jobs?job_id=eq.${jobId}`, "DELETE");
    }
  } catch (e) {}

  // 2. Create fresh job at top of feed
  const payload = {
    consumer_id: oldJob.consumer_id || ME,
    category_id: oldJob.category_id || "AC_REPAIR",
    sub_issue_tags: tags,
    urgency: "EMERGENCY",
    description: boostedDesc,
    original_description: oldJob.original_description || cleanOriginalDesc,
    location_geom: oldJob.location_geom,
    status: "OPEN",
    posting_kind: "STANDARD",
    budget_range_min: oldJob.budget_range_min || 10,
    budget_range_max: oldJob.budget_range_max || 25,
    ai_rewritten: false,
    media_urls: oldJob.media_urls || [],
    is_approved: true,
    short_id: newSh,
    tracking_id: "FX-" + newSh
  };

  let newJob = {
    ...oldJob,
    ...payload,
    job_id: "demo-" + newSh,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };

  try {
    const created = await sb("/jobs", "POST", payload);
    if (Array.isArray(created) && created[0]) newJob = created[0];
  } catch (e) {}

  // Move any Customer Before photos from old jobId to newJob.job_id
  (S.photos || []).forEach(p => {
    if (p.job_id === jobId) {
      p.job_id = newJob.job_id;
      sb("/job_photos", "POST", {
        job_id: newJob.job_id,
        uploaded_by_user_id: ME || CONSUMER_ID,
        phase: "BEFORE",
        url: p.url,
        captured_in_app: true
      }).catch(() => {});
    }
  });
  save("photos", S.photos);

  S.jobs.unshift(newJob);
  save("jobs", S.jobs);
  S.jobId = newJob.job_id;
  S.autoRepostCount = (S.autoRepostCount || 0) + 1;
  save("autoRepostCount", S.autoRepostCount);

  sb("/notifications", "POST", {
    user_id: VENDOR_ID,
    kind: "NEW_JOB",
    title: `🔥 Boosted Repost #${newSh} · ${cat(newJob.category_id).name}`,
    body: `Priority reposted order looking for immediate bids — tap to send offer now!`,
    job_id: newJob.job_id
  }).catch(() => {});

  render();
  toast(ar ? `✓ تم حذف الطلب القديم ونشر طلب جديد #${newSh} في الصدارة!` : `✓ Old post deleted & fresh Order #${newSh} boosted to top of vendor feeds!`);
}

  OM: { minLen: 8, maxLen: 8, regex: /^[79]\d{7}$/, msgEn: "Oman (+968) numbers must be 8 digits starting with 9 or 7.", msgAr: "يجب أن يتكون الرقم العُماني (+968) من 8 أرقام ويبدأ بـ 9 أو 7." },
  AE: { minLen: 9, maxLen: 9, regex: /^5\d{8}$/ },
  SA: { minLen: 9, maxLen: 9, regex: /^5\d{8}$/ },
  QA: { minLen: 8, maxLen: 8, regex: /^[3567]\d{7}$/ },
  KW: { minLen: 8, maxLen: 8, regex: /^[4569]\d{7}$/ },
  BH: { minLen: 8, maxLen: 8, regex: /^[36]\d{7}$/ },
  YE: { minLen: 9, maxLen: 9, regex: /^7\d{8}$/ },
  US: { minLen: 10, maxLen: 10, regex: /^[2-9]\d{9}$/ },
  CA: { minLen: 10, maxLen: 10, regex: /^[2-9]\d{9}$/ },
  GB: { minLen: 10, maxLen: 10, regex: /^7\d{9}$/ },
  IN: { minLen: 10, maxLen: 10, regex: /^[6-9]\d{9}$/ },
  PK: { minLen: 10, maxLen: 10, regex: /^3\d{9}$/ },
  EG: { minLen: 10, maxLen: 10, regex: /^1\d{9}$/ },
  JO: { minLen: 9, maxLen: 9, regex: /^7\d{8}$/ }
};

function getSelectedCountry() {
  const iso = String((S.auth && S.auth.countryIso) || "OM").toUpperCase();
  return ALL_COUNTRIES.find(c => c.iso === iso) || ALL_COUNTRIES[0];
}

function parsePhoneSelection(rawInput, countryObj) {
  const c = countryObj || getSelectedCountry();
  let txt = String(rawInput || "").trim().replace(/[^0-9+]/g, "");
  if (txt.startsWith("00")) txt = "+" + txt.slice(2);
  let digits = "";
  if (txt.startsWith("+")) {
    const afterPlus = txt.slice(1).replace(/[^0-9]/g, "");
    digits = afterPlus.startsWith(c.dial) ? afterPlus.slice(c.dial.length) : afterPlus;
  } else {
    digits = txt.replace(/[^0-9]/g, "");
    if (digits.startsWith(c.dial) && digits.length > 8) {
      digits = digits.slice(c.dial.length);
    }
  }
  if (!digits) {
    return { ok: false, empty: true, nationalDigits: "", e164: "", errorEn: "Please enter your phone number.", errorAr: "يرجى إدخال رقم هاتفك." };
  }
  if (c.iso !== "OM" && digits.startsWith("0")) {
    digits = digits.replace(/^0+/, "");
  }
  if (c.iso === "OM") {
    if (!/^[79]\d{7}$/.test(digits)) {
      return {
        ok: false,
        empty: false,
        nationalDigits: digits,
        e164: "",
        errorEn: COUNTRY_RULES_CLIENT.OM.msgEn,
        errorAr: COUNTRY_RULES_CLIENT.OM.msgAr
      };
    }
    return { ok: true, nationalDigits: digits, e164: "+968" + digits, dialCode: "+968", countryIso: "OM" };
  }
  const rule = COUNTRY_RULES_CLIENT[c.iso];
  if (rule) {
    if (digits.length < rule.minLen || digits.length > rule.maxLen || !rule.regex.test(digits)) {
      return {
        ok: false,
        empty: false,
        nationalDigits: digits,
        e164: "",
        errorEn: `Enter a valid ${c.name} mobile number (${rule.minLen} digits).`,
        errorAr: `أدخل رقم جوال صحيحاً لدولة ${c.nameAr || c.name}.`
      };
    }
  } else if (digits.length < 6 || digits.length > 12 || /^0+$/.test(digits)) {
    return {
      ok: false,
      empty: false,
      nationalDigits: digits,
      e164: "",
      errorEn: "Enter a valid mobile number (6 to 12 digits).",
      errorAr: "أدخل رقم هاتف صحيحاً (6 إلى 12 رقماً)."
    };
  }
  const totalDigits = c.dial + digits;
  if (totalDigits.length < 7 || totalDigits.length > 15) {
    return { ok: false, empty: false, nationalDigits: digits, e164: "", errorEn: "Phone number length is invalid.", errorAr: "طول رقم الهاتف غير صالح." };
  }
  return { ok: true, nationalDigits: digits, e164: "+" + totalDigits, dialCode: "+" + c.dial, countryIso: c.iso };
}

function normalizePhoneE164(raw, isoOverride) {
  const c = isoOverride ? (ALL_COUNTRIES.find(x => x.iso === String(isoOverride).toUpperCase()) || getSelectedCountry()) : getSelectedCountry();
  const str = String(raw || "").trim();
  if (!str) return "";
  if (str.startsWith("+") && str.replace(/[^0-9]/g, "").length >= 7) return "+" + str.replace(/[^0-9]/g, "");
  const parsed = parsePhoneSelection(str, c);
  return parsed.ok ? parsed.e164 : ("+" + c.dial + str.replace(/[^0-9]/g, ""));
}

function formatOmanDisplayPhone(raw) {
  if (!raw) return "";
  const e164 = String(raw).startsWith("+") ? raw : normalizePhoneE164(raw);
  if (e164.startsWith("+968") && e164.length >= 12) {
    const rest = e164.slice(4);
    return "+968 " + rest.slice(0, 4) + " " + rest.slice(4);
  }
  return e164;
}

function validatePhoneField(isBlur) {
  const ar = L === "ar";
  const c = getSelectedCountry();
  const inp = document.getElementById("authPhoneInp");
  const raw = inp ? inp.value : (S.auth.nationalDraft || "");
  const parsed = parsePhoneSelection(raw, c);
  const errEl = document.getElementById("authPhoneErr");
  const wrapEl = document.getElementById("authPhoneWrap");
  if (parsed.ok) {
    S.auth.phone = parsed.e164;
    S.auth.phoneError = "";
    if (wrapEl) wrapEl.classList.remove("err");
    if (errEl) {
      errEl.style.color = "";
      errEl.textContent = c.iso === "OM" ? (ar ? "عُمان (+968): 8 أرقام تبدأ بـ 9 أو 7" : "Oman (+968): 8 digits starting with 9 or 7") : "";
    }
    return parsed;
  }
  const shouldShowErr = Boolean(isBlur || (!parsed.empty && ((c.iso === "OM" && (parsed.nationalDigits.length >= 1 && !/^[79]/.test(parsed.nationalDigits))) || parsed.nationalDigits.length >= 8)));
  const msg = ar ? parsed.errorAr : parsed.errorEn;
  if (shouldShowErr) {
    S.auth.phoneError = msg;
    if (wrapEl) wrapEl.classList.add("err");
    if (errEl) {
      errEl.style.color = "#DC2626";
      errEl.textContent = msg;
    }
  } else {
    S.auth.phoneError = "";
    if (wrapEl) wrapEl.classList.remove("err");
    if (errEl) {
      errEl.style.color = "";
      errEl.textContent = c.iso === "OM" ? (ar ? "عُمان (+968): 8 أرقام تبدأ بـ 9 أو 7" : "Oman (+968): 8 digits starting with 9 or 7") : "";
    }
  }
  return parsed;
}

function startOtpResendTimer(seconds) {
  if (window._otpResendTimer) {
    clearInterval(window._otpResendTimer);
    window._otpResendTimer = null;
  }
  S.auth.resendLeft = Number(seconds) > 0 ? Number(seconds) : 45;
  window._otpResendTimer = setInterval(() => {
    S.auth.resendLeft = Math.max(0, (Number(S.auth.resendLeft) || 0) - 1);
    const btn = document.getElementById("otpResendBtn");
    if (btn) {
      if (S.auth.resendLeft > 0) {
        btn.disabled = true;
        btn.style.color = "#6B7280";
        btn.textContent = (L === "ar" ? "إعادة الإرسال" : "Resend") + ` (0:${String(S.auth.resendLeft).padStart(2, "0")})`;
      } else {
        btn.disabled = false;
        btn.style.color = "#FF5A00";
        btn.textContent = L === "ar" ? "إعادة إرسال الرمز" : "Resend code";
      }
    }
    if (S.auth.resendLeft <= 0) {
      clearInterval(window._otpResendTimer);
      window._otpResendTimer = null;
    }
  }, 1000);
}

window._otpSending = false;

async function sendWhatsAppOtp(rawPhone, purpose) {
  const ar = L === "ar";
  if (window._otpSending) return false;
  if (!checkRateLimit("send_otp", 3, 60000, "OTP Request", "طلب رمز التحقق")) return false;
  const inp = !rawPhone ? document.getElementById("authPhoneInp") : null;
  if (inp) S.auth.nationalDraft = inp.value;
  const c = getSelectedCountry();
  const inputVal = (S.auth.nationalDraft && !rawPhone) ? S.auth.nationalDraft : (rawPhone || S.auth.nationalDraft || S.auth.phone);
  const parsed = parsePhoneSelection(inputVal, c);
  if (!parsed.ok) {
    const msg = ar ? parsed.errorAr : parsed.errorEn;
    S.auth.phoneError = msg;
    S.auth.channelSheetOpen = false;
    save("auth_state", S.auth);
    render();
    toast(msg);
    return false;
  }

  const toPhone = parsed.e164;
  S.auth.phone = toPhone;
  S.auth.otpTargetPhone = toPhone;
  S.auth.otpChannel = "whatsapp";
  S.auth.otpPurpose = purpose || "login";
  S.auth.otpTyped = "";
  S.auth.lastOtpCode = "";
  S.auth.phoneError = "";
  S.auth.channelSheetOpen = false;
  if (inp) S.auth.nationalDraft = parsed.nationalDigits;
  save("auth_state", S.auth);

  window._otpSending = true;
  render();
  toast(ar
    ? `جاري إرسال رمز التحقق عبر واتساب إلى ${toPhone}...`
    : `Sending verification code via WhatsApp to ${toPhone}...`);

  try {
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const tid = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
    const res = await fetch(`${FIXIT_BACKEND_URL}/api/auth/otp/send`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phone: toPhone,
        countryIso: parsed.countryIso,
        dialCode: parsed.dialCode,
        nationalNumber: parsed.nationalDigits,
        channel: "whatsapp",
        purpose: S.auth.otpPurpose,
        mode: S.auth.linkGoogleMode ? "link_google" : "login",
        role: ROLE
      }),
      signal: ctrl ? ctrl.signal : undefined
    });
    if (tid) clearTimeout(tid);
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data || !data.ok) {
      const errMsg = ar ? (data.errorAr || data.error || "تعذر إرسال رمز التحقق") : (data.error || "Unable to send verification code");
      if (res.status === 400) S.auth.phoneError = errMsg;
      if (data.retryAfterSec) startOtpResendTimer(Number(data.retryAfterSec));
      save("auth_state", S.auth);
      toast(errMsg);
      return false;
    }

    if (data.code) {
      S.auth.lastOtpCode = data.code;
      toast(ar ? `رمز التحقق: ${data.code}` : `Verification code: ${data.code}`);
    } else {
      toast(ar
        ? "تم إرسال الرمز المكون من 6 أرقام عبر واتساب"
        : "6-digit code sent via WhatsApp");
    }

    S.auth.mode = "otp_verify";
    save("auth_state", S.auth);
    startOtpResendTimer(data.cooldownSec || 45);
    setTimeout(() => {
      const el = document.getElementById("authOtpInp");
      if (el) el.focus();
    }, 120);
    return true;
  } catch (e) {
    toast(ar
      ? "لا يوجد اتصال بالخادم حالياً. تحقق من الإنترنت وحاول مجدداً."
      : "Cannot reach FixIt servers right now. Check your connection and try again.");
    return false;
  } finally {
    window._otpSending = false;
    render();
  }
}

async function verifyTalabatOtp() {
  const ar = L === "ar";
  if (window._otpVerifying) return;
  const digits = String(S.auth.otpTyped || (document.getElementById("authOtpInp") || {}).value || "").replace(/[^0-9]/g, "");
  if (digits.length !== 6) {
    toast(ar ? "أدخل الرمز المكون من 6 أرقام كاملاً" : "Enter all 6 digits of your code");
    return;
  }
  if (!checkRateLimit("verify_otp", 5, 60000, "Code Verification", "التحقق من الرمز")) return;

  window._otpVerifying = true;
  try {
    const c = getSelectedCountry();
    const res = await fetch(`${FIXIT_BACKEND_URL}/api/auth/otp/verify`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phone: S.auth.otpTargetPhone || S.auth.phone,
        countryIso: c.iso,
        dialCode: "+" + c.dial,
        nationalNumber: S.auth.nationalDraft || "",
        code: digits,
        role: ROLE,
        mode: S.auth.linkGoogleMode ? "link_google" : "login",
        pendingToken: S.auth.pendingGoogleToken || "",
        firstName: S.auth.pendingFirstName || "",
        lastName: S.auth.pendingLastName || "",
        avatarUrl: S.auth.pendingAvatarUrl || "",
        customAvatar: Boolean(S.auth.pendingCustomAvatar),
        lang: L,
        deviceId: getDeviceId()
      })
    });
    const data = await res.json().catch(() => ({}));

    if (res.status === 409 && data && data.code === "PHONE_ALREADY_LINKED") {
      const msg = ar ? (data.errorAr || data.error) : (data.error || "This phone number is already linked to another account.");
      S.auth.mode = "google_phone";
      S.auth.otpTyped = "";
      S.auth.phoneError = msg;
      save("auth_state", S.auth);
      render();
      toast(msg);
      return;
    }

    if (!res.ok || !data || !data.ok) {
      toast(ar ? (data.errorAr || data.error || "رمز التحقق غير صحيح") : (data.error || "Incorrect code. Please check and try again."));
      return;
    }

    if (window._otpResendTimer) {
      clearInterval(window._otpResendTimer);
      window._otpResendTimer = null;
    }

    const wasGoogleLink = Boolean(S.auth.linkGoogleMode);
    applyAuthenticatedSession(data);

    if (ROLE === "vendor") {
      S.auth.accountType = "shop_owner";
      const curShop = typeof getActiveShop === "function" ? getActiveShop() : null;
      S.onboardingPreviewGate = !(curShop && curShop.kyc_status === "APPROVED");
      save("onboardingPreviewGate", S.onboardingPreviewGate);
    }

    if (!wasGoogleLink && data.needsProfileCompletion) {
      const parts = String((data.user && data.user.full_name) || "").trim().split(/\s+/);
      const isPlaceholder = !parts[0] || /^fixit\b/i.test(parts[0]) || parts[0] === "عميل";
      S.auth.pendingFirstName = isPlaceholder ? "" : parts[0];
      S.auth.pendingLastName = isPlaceholder ? "" : parts.slice(1).join(" ");
      S.auth.pendingEmail = (data.user && data.user.email) || "";
      S.auth.needsProfileCompletion = true;
      S.auth.mode = "complete_profile";
      if (!S.stack.includes("auth")) S.stack.push("auth");
      save("auth_state", S.auth);
      render();
      sync();
      toast(ar ? "تم توثيق الرقم. أكمل بياناتك الآن." : "Number verified. Complete your details.");
      return;
    }

    S.auth.needsProfileCompletion = false;
    S.auth.mode = "welcome";
    if (S.stack[S.stack.length - 1] === "auth") S.stack.pop();
    save("auth_state", S.auth);
    render();
    sync();
    toast(ar ? "تم تسجيل الدخول بنجاح" : "Verified and signed in to FixIt.");
    maybeOfferBiometricEnrollment();
  } catch (e) {
    toast(ar ? "تعذر الاتصال بالخادم للتحقق من الرمز" : "Network error while verifying code. Try again.");
  } finally {
    window._otpVerifying = false;
  }
}

window._handledOAuthKeys = window._handledOAuthKeys || new Set();
window.onInAppGoogleOAuthCallback = async function(uriStr) {
  const ar = L === "ar";
  try {
    if (!uriStr) return;
    if (typeof window !== "undefined" && window.FixItNative && typeof window.FixItNative.consumePendingOAuthUri === "function") {
      try { window.FixItNative.consumePendingOAuthUri(); } catch (ignored) {}
    }

    let parsedUrl = null;
    try {
      const normalized = String(uriStr).includes("://")
        ? String(uriStr)
        : "https://fixit-now.xyz/" + String(uriStr).replace(/^\/+/, "");
      parsedUrl = new URL(normalized);
    } catch (e) {
      parsedUrl = null;
    }

    const searchParams = parsedUrl ? parsedUrl.searchParams : new URLSearchParams("");
    const rawHash = parsedUrl && parsedUrl.hash ? parsedUrl.hash.replace(/^#/, "") : "";
    const hashParams = new URLSearchParams(rawHash.startsWith("?") ? rawHash.slice(1) : rawHash);
    const getParam = name => (searchParams.get(name) || hashParams.get(name) || "").trim();

    if (!window.FixItNative && typeof window !== "undefined" && window.history && window.location && (window.location.search || window.location.hash)) {
      try { window.history.replaceState({}, "", window.location.pathname || "/app"); } catch (ignored) {}
    }

    const errDesc = getParam("error_description");
    const errCode = getParam("error");
    if (errDesc || errCode) {
      const dedupeErrKey = "err:" + (errDesc || errCode);
      if (window._handledOAuthKeys.has(dedupeErrKey)) return;
      window._handledOAuthKeys.add(dedupeErrKey);
      toast(ar ? `تعذر تسجيل الدخول عبر Google: ${errDesc || errCode}` : `Google Sign-In error: ${errDesc || errCode}`);
      return;
    }

    const pendingToken = getParam("pending_token");
    const accessToken = getParam("access_token");
    const idToken = getParam("id_token");
    const code = getParam("code");

    if (!pendingToken && !accessToken && !idToken && !code) {
      toast(ar ? "لم يتم استلام رمز Google صالح" : "No valid Google sign-in token received");
      return;
    }

    const dedupeKey = pendingToken || code || idToken || accessToken;
    if (window._handledOAuthKeys.has(dedupeKey)) return;
    window._handledOAuthKeys.add(dedupeKey);

    toast(ar ? "جاري التحقق من حساب Google..." : "Verifying your Google account...");
    const res = await fetch(`${FIXIT_BACKEND_URL}/api/auth/google/exchange`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pendingToken, accessToken, idToken, code, role: ROLE, deviceId: getDeviceId() })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data || !data.ok) {
      window._handledOAuthKeys.delete(dedupeKey);
      toast(ar ? (data.errorAr || data.error || "تعذر إكمال تسجيل دخول Google") : (data.error || "Could not verify Google account"));
      return;
    }

    if (data.status === "NEEDS_ONBOARDING") {
      const gp = data.googleProfile || {};
      S.auth.pendingGoogleToken = data.pendingToken || "";
      S.auth.pendingEmail = gp.email || "";
      S.auth.pendingFirstName = gp.firstName || (gp.fullName ? String(gp.fullName).split(/\s+/)[0] : "");
      S.auth.pendingLastName = gp.lastName || "";
      S.auth.pendingAvatarUrl = gp.avatarUrl || "";
      S.auth.pendingCustomAvatar = false;
      S.auth.linkGoogleMode = false;
      S.auth.mode = "google_confirm";
      S.sheet = null;
      if (!S.stack.includes("auth")) S.stack.push("auth");
      save("auth_state", S.auth);
      render();
      return;
    }

    applyAuthenticatedSession(data);
    if (ROLE === "vendor") S.auth.accountType = "shop_owner";
    S.auth.needsProfileCompletion = false;
    S.auth.mode = "welcome";
    S.sheet = null;
    if (S.stack[S.stack.length - 1] === "auth") S.stack.pop();
    save("auth_state", S.auth);
    render();
    sync();
    toast(ar ? `مرحباً بعودتك (${S.profile.full_name || S.auth.email})` : `Welcome back${S.profile.full_name ? ", " + S.profile.full_name : ""}!`);
    maybeOfferBiometricEnrollment();
  } catch (e) {
    toast(ar ? "حدث خطأ أثناء تسجيل الدخول عبر Google" : "Network error during Google Sign-In");
  }
};

    if (!S.auth || !S.auth.loggedIn || !S.auth.sessionCode || S.auth.needsProfileCompletion) return;
    if (!isBiometricHardwareAvailable() || isBiometricLoginReady()) return;
    if (localStorage.getItem("fixit_bio_dismissed_" + ROLE) === "1") return;
    setTimeout(() => {
      if (!S.sheet && S.auth && S.auth.loggedIn && !S.auth.needsProfileCompletion && isBiometricHardwareAvailable() && !isBiometricLoginReady()) {
        S.sheet = "biometric_optin";
        render();
      }
    }, 450);
  } catch (e) {}
}

async function enableBiometricLogin() {
  const ar = L === "ar";
  if (ROLE === "admin" || window._biometricBusy) return;
  if (!S.auth || !S.auth.loggedIn || !S.auth.sessionCode) {
    toast(ar ? "يرجى تسجيل الدخول أولاً" : "Please sign in first.");
    return;
  }
  if (!isBiometricHardwareAvailable()) {
    toast(ar ? "فعّل البصمة أو قفل الشاشة في إعدادات الجهاز أولاً" : "Set up fingerprint, face unlock, or screen lock in Device Settings first.");
    return;
  }
  window._biometricBusy = true;
  render();
  try {
    const res = await fetch(`${FIXIT_BACKEND_URL}/api/auth/biometric/register`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-FixIt-Session": S.auth.sessionCode,
        "X-FixIt-Role": ROLE
      },
      body: JSON.stringify({ deviceId: getDeviceId() })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data || !data.ok || !data.biometricToken) {
      window._biometricBusy = false;
      render();
      toast(ar ? "تعذر تفعيل الدخول السريع" : (data.error || "Could not enable biometric login"));
      return;
    }
    const label = String((S.profile && S.profile.phone_number) || (S.auth && S.auth.phone) || (S.profile && S.profile.full_name) || (S.auth && S.auth.email) || "").trim();
    window.FixItNative.enrollBiometricLogin(
      ROLE,
      String(data.userId || ""),
      String(data.biometricToken),
      String(data.keyId || ""),
      label,
      ar ? "تفعيل البصمة والوجه" : "Enable Biometric Login",
      ar ? "تأكيد الهوية للدخول السريع" : "Confirm your fingerprint or face for quick sign in"
    );
  } catch (e) {
    window._biometricBusy = false;
    render();
    toast(ar ? "تعذر الاتصال بالخادم" : "Network error. Please try again.");
  }
}

window.onNativeBiometricEnrollResult = async function(ok, errMsg) {
  const ar = L === "ar";
  window._biometricBusy = false;
  if (ok) {
    S.profile.biometric_enabled = true;
    save("profile", S.profile);
    try { localStorage.removeItem("fixit_bio_dismissed_" + ROLE); } catch (e) {}
    if (S.sheet === "biometric_optin") S.sheet = null;
    render();
    toast(ar ? "تم تفعيل الدخول بالبصمة والوجه" : "Fingerprint & Face login enabled");
    return;
  }
  if (S.auth && S.auth.sessionCode) {
    fetch(`${FIXIT_BACKEND_URL}/api/auth/biometric/revoke`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-FixIt-Session": S.auth.sessionCode,
        "X-FixIt-Role": ROLE
      },
      body: JSON.stringify({ deviceId: getDeviceId() })
    }).catch(() => {});
  }
  render();
  if (errMsg && !/cancel/i.test(String(errMsg))) toast(String(errMsg));
};

async function disableBiometricLogin() {
  const ar = L === "ar";
  if (window._biometricBusy) return;
  window._biometricBusy = true;
  render();
  try {
    if (typeof window !== "undefined" && window.FixItNative && typeof window.FixItNative.clearBiometricVault === "function") {
      window.FixItNative.clearBiometricVault(ROLE);
    }
    if (S.auth && S.auth.sessionCode) {
      await fetch(`${FIXIT_BACKEND_URL}/api/auth/biometric/revoke`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-FixIt-Session": S.auth.sessionCode,
          "X-FixIt-Role": ROLE
        },
        body: JSON.stringify({ deviceId: getDeviceId() })
      }).catch(() => {});
    }
  } finally {
    S.profile.biometric_enabled = false;
    save("profile", S.profile);
    try { localStorage.setItem("fixit_bio_dismissed_" + ROLE, "1"); } catch (e) {}
    window._biometricBusy = false;
    render();
    toast(ar ? "تم إيقاف الدخول بالبصمة والوجه" : "Biometric login turned off");
  }
}

function toggleBiometricLogin() {
  return isBiometricLoginReady() ? disableBiometricLogin() : enableBiometricLogin();
}

function initiateBiometricSignIn() {
  const ar = L === "ar";
  if (window._biometricBusy) return;
  if (typeof checkRateLimit === "function" && !checkRateLimit("biometric_login", 10, 60000, "Biometric Login", "الدخول بالبصمة")) return;
  if (!isBiometricLoginReady()) {
    toast(ar ? "الدخول بالبصمة غير مفعّل على هذا الجهاز" : "Biometric login is not set up on this device.");
    return;
  }
  window._biometricBusy = true;
  render();
  window.FixItNative.authenticateBiometricLogin(
    ROLE,
    ar ? "تسجيل الدخول السريع" : "Quick Sign In",
    ar ? "استخدم بصمتك أو وجهك للمتابعة" : "Use fingerprint or face unlock to continue"
  );
}

window.onNativeBiometricLoginResult = async function(rawResult) {
  const ar = L === "ar";
  let payload = null;
  try {
    payload = typeof rawResult === "string" ? JSON.parse(rawResult) : rawResult;
  } catch (e) {
    payload = null;
  }
  if (!payload || !payload.ok || !payload.userId || !payload.biometricToken) {
    window._biometricBusy = false;
    render();
    if (payload && payload.error && !/cancel/i.test(String(payload.error))) {
      toast(String(payload.error));
    }
    return;
  }
  try {
    const res = await fetch(`${FIXIT_BACKEND_URL}/api/auth/biometric/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        userId: String(payload.userId),
        biometricToken: String(payload.biometricToken),
        keyId: String(payload.keyId || ""),
        role: ROLE,
        deviceId: getDeviceId()
      })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      if (window.FixItNative && window.FixItNative.clearBiometricVault) {
        window.FixItNative.clearBiometricVault(ROLE);
      }
      window._biometricBusy = false;
      render();
      toast(ar ? "انتهت صلاحية البصمة، سجل الدخول بالهاتف أو Google" : "Biometric key expired. Please sign in with phone or Google.");
      return;
    }
    if (!res.ok || !data || !data.ok) {
      window._biometricBusy = false;
      render();
      toast(ar ? (data.errorAr || data.error || "تعذر تسجيل الدخول") : (data.error || "Could not sign in with biometrics"));
      return;
    }
    applyAuthenticatedSession(data);
    if (ROLE === "vendor") S.auth.accountType = "shop_owner";
    S.auth.needsProfileCompletion = false;
    S.auth.mode = "welcome";
    S.sheet = null;
    if (S.stack[S.stack.length - 1] === "auth") S.stack.pop();
    save("auth_state", S.auth);
    window._biometricBusy = false;
    render();
    sync();
    toast(ar ? `مرحباً بعودتك${S.profile.full_name ? "، " + S.profile.full_name : ""}` : `Welcome back${S.profile.full_name ? ", " + S.profile.full_name : ""}!`);
  } catch (e) {
    window._biometricBusy = false;
    render();
    toast(ar ? "تعذر الاتصال بالخادم" : "Network error while signing in.");
  }
};

function renderCountryRowsHtml(query) {
  const ar = L === "ar";
  const q = String(query || "").trim().toLowerCase().replace(/^\+/, "");
  const selectedIso = (S.auth && S.auth.countryIso) || "OM";
  let list = ALL_COUNTRIES;
  if (q) {
    list = ALL_COUNTRIES.filter(c =>
      c.name.toLowerCase().includes(q) ||
      (c.nameAr && c.nameAr.includes(q)) ||
      c.iso.toLowerCase().includes(q) ||
      c.dial.includes(q)
    );
  }
  if (!list.length) {
    return `<div style="padding:28px 12px;text-align:center;color:#6B7280;font-size:14px">${ar ? "لم يتم العثور على دولة مطابقة" : "No matching country found"}</div>`;
  }
  return list.slice(0, 220).map(c => {
    const isSel = c.iso === selectedIso;
    const label = ar && c.nameAr ? `${c.nameAr} · ${c.name}` : c.name;
    return `<button type="button" class="fx-country-row ${isSel ? "on" : ""}" onclick="selectCountryIso('${c.iso}')">

/* ================= VENDOR SHOP ONBOARDING GATE & CR KYC ================= */
function syncKycDraftInputsToShop(shop) {
  if (!shop) return;
  const crInp = document.getElementById("kycCrInp");
  if (crInp) shop.cr_number = crInp.value.trim().toUpperCase();
  const nameInp = document.getElementById("kycShopNameInp");
  if (nameInp) shop.shop_name = nameInp.value.trim();
  const branchInp = document.getElementById("kycBranchInp");
  if (branchInp) shop.branch_name = branchInp.value.trim();
  const muniInp = document.getElementById("kycMuniInp");
  if (muniInp) shop.municipality_license = muniInp.value.trim().toUpperCase();
  const civilInp = document.getElementById("kycCivilIdInp");
  if (civilInp) shop.civil_id = civilInp.value.replace(/\D/g, "").slice(0, 12);
}

function verifyCrWithOmanBusinessPlatform(shopIdx) {
  const ar = L === "ar";
  const shop = S.shops[shopIdx || 0] || getActiveShop();
  syncKycDraftInputsToShop(shop);

  const crDigits = String(shop.cr_number || "").replace(/\D/g, "");
  if (crDigits.length < 5) {
    shop.obp_status = "INVALID_CR";
    toast(ar ? "يرجى إدخال رقم سجل تجاري صحيح (5 أرقام على الأقل)" : "Please enter a valid CR number (at least 5 digits)");
  } else {
    shop.obp_status = "PERMITTED";
    shop.obp_checked_at = new Date().toISOString();
    toast(ar ? `تم التحقق من السجل التجاري ${shop.cr_number}` : `Commercial Registration ${shop.cr_number} verified`);
  }
  syncShopsToCloud();
  render();
}

function captureShopSignboardPhoto() {
  const shop = getActiveShop();
  syncKycDraftInputsToShop(shop);
  openInAppCameraModal("SHOP_SIGNBOARD", shop.shop_id, function(stampedDataUrl) {
    shop.board_photo = stampedDataUrl;
    if (shop.kyc_status === "CONFLICT") {
      toast(L === "ar" ? "تم تحديث صورة اللوحة التجارية — اضغط حفظ وإرسال" : "Signboard photo updated. Tap Submit below.");
    } else {
      toast(L === "ar" ? "تم حفظ صورة لوحة المحل" : "Shop signboard photo saved.");

    render();
