  const keepChat = document.getElementById("chat"), atBottom = keepChat && keepChat.scrollHeight - keepChat.scrollTop - keepChat.clientHeight < 60;
  const imgModal = S.previewImg ? `<div class="sheet" style="align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.85)" onclick="S.previewImg=null;render()"><img src="${esc(S.previewImg)}" alt="Preview Image" style="max-width:100%;max-height:82vh;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)" /></div>` : "";
  const camModal = renderInAppCameraModal();
  const mainContent = S.isLoadingSkeleton ? `${bar(L === "ar" ? "جاري التحميل..." : "Loading...", S.stack.length > 0)}<div class="pad">${renderSkeletonCards(3)}</div>` : screen();

  // Preserve active Leaflet map containers so re-rendering the page never flashes or reloads map tiles!
  const preservedMaps = {};
  ["cjobLeafletMap", "vjobLeafletMap", "ajobLeafletMap", "fullTrackLeafletMap", "addrPinLeafletMap", "chkMiniMap"].forEach(mid => {
    const existingEl = document.getElementById(mid);
    if (existingEl && existingEl._leaflet_id && activeMapInstances && activeMapInstances[mid] && activeMapInstances[mid].el === existingEl) {
      preservedMaps[mid] = existingEl;
    }
  });

  const prevScrollY = typeof window !== "undefined" ? window.scrollY : 0;
  const appEl = document.getElementById("app");
  if (appEl) {
    if (S._navChanged) {
      appEl.classList.add("page-anim");
    } else {
      appEl.classList.remove("page-anim");
    }
    appEl.innerHTML = banner + offlineBanner + mainContent + nav + sheet + imgModal + camModal;
  }
  if (!S._navChanged && typeof window !== "undefined" && prevScrollY > 0) {
    window.scrollTo(0, prevScrollY);
  }
  S._navChanged = false;

  // Re-attach preserved map DOM nodes immediately so there is 0ms flash!
  Object.keys(preservedMaps).forEach(mid => {
    const newPlaceholder = document.getElementById(mid);
    if (newPlaceholder && newPlaceholder.parentNode) {
      newPlaceholder.parentNode.replaceChild(preservedMaps[mid], newPlaceholder);

  // Also ensure toastOverlay reflects S.toast
  const tEl = document.getElementById("toastOverlay");

    tEl.innerHTML = S.toast ? `<div class="toast" role="status" aria-live="polite">${esc(S.toast)}</div>` : "";
  }

  if (atBottom) scrollChat();
  if (ROLE === "admin" && typeof checkWhatsAppStatus === "function" && document.getElementById("waStatusPill")) {
    checkWhatsAppStatus();
  }
}

async function tryAutoTrustedAdminLogin() {
  if (ROLE !== "admin" || (S.auth && S.auth.loggedIn && S.auth.sessionCode)) return;
  try {
    const res = await fetch(`${FIXIT_BACKEND_URL}/api/auth/admin-login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deviceId: getDeviceId() })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data && data.ok && data.sessionCode) {
      applyAuthenticatedSession(data);
      S.auth.mode = "admin";
      if (S.stack[S.stack.length - 1] === "auth") S.stack.pop();
      save("auth_state", S.auth);
      render();
      sync();
    }
  } catch (e) {}
}

// Native Pull-to-Refresh Small Circle Rotator (refreshes exact page on scroll release with no toast!)
(function initPullToRefresh() {
  if (typeof window === "undefined" || typeof document === "undefined") return;
  let startY = 0;
  let pulling = false;
  let pullDist = 0;
  window.addEventListener("touchstart", function(e) {
    if (window.scrollY <= 2 && !S.sheet && !S.cameraModal && !isOpenScreen("job_chat") && !isOpenScreen("addr_map") && !isOpenScreen("tracking")) {
      startY = e.touches && e.touches[0] ? e.touches[0].clientY : 0;
      pulling = true;
      pullDist = 0;
    } else {
      pulling = false;
    }
  }, { passive: true });

  window.addEventListener("touchmove", function(e) {
    if (!pulling) return;
    const curY = e.touches && e.touches[0] ? e.touches[0].clientY : 0;
    pullDist = Math.max(0, curY - startY);
    const sp = document.getElementById("ptrSpinner");
    if (sp && pullDist > 12) {
      const y = Math.min(54, (pullDist - 12) * 0.55) - 44;
      const rot = Math.min(320, pullDist * 2.2);
      sp.style.display="grid"; sp.classList.add("visible");
      sp.style.transform = `translate(-50%, ${y}px) rotate(${rot}deg)`;
    }
  }, { passive: true });

  window.addEventListener("touchend", function() {
    if (!pulling) return;
    pulling = false;
    const sp = document.getElementById("ptrSpinner");
    if (!sp) return;
    if (pullDist >= 72) {
      sp.classList.add("visible", "spinning");
      sp.style.transform = "translate(-50%, 10px) scale(1)";
      sync().finally(() => {
        setTimeout(() => {
          render();
          sp.classList.remove("visible", "spinning"); sp.style.display="none";
          sp.style.transform = "translate(-50%, -70px) scale(0.8)";
        }, 450);
      });
    } else {
      sp.classList.remove("visible", "spinning"); sp.style.display="none";
      sp.style.transform = "translate(-50%, -70px) scale(0.8)";
    }
    pullDist = 0;
  }, { passive: true });
})();

    urlHref.includes("pending_token=") ||

});
