function submitShopKycForAdminApproval() {
  const ar = L === "ar";
  const shop = getActiveShop();
  syncKycDraftInputsToShop(shop);

  if (!shop.shop_name || !String(shop.shop_name).trim()) {
    toast(ar ? "يرجى إدخال اسم المحل التجاري" : "Please enter your official shop name");
    return;
  }
  const crDigits = String(shop.cr_number || "").replace(/\D/g, "");
  if (crDigits.length < 5) {
    toast(ar ? "يرجى إدخال رقم السجل التجاري (5 أرقام على الأقل)" : "Please enter a valid CR number (min 5 digits)");
    return;
  }
  const civilDigits = String(shop.civil_id || "").replace(/\D/g, "");
  if (civilDigits.length < 7) {
    toast(ar ? "يرجى إدخال الرقم المدني للمالك أو الفني المسؤول (7 أرقام على الأقل)" : "Please enter Owner/Technician Civil ID (min 7 digits)");
    return;
  }
  if (!shop.regulations_accepted) {
    toast(ar ? "يرجى الموافقة على لائحة التزامات الشركاء والضمان" : "Please accept the Partner Regulations & Warranty Charter");
    return;
  }

  shop.obp_status = "PERMITTED";
  shop.kyc_status = "PENDING";
  shop.conflict_note = "";
  shop.submitted_at = new Date().toISOString();
  syncShopsToCloud();
  sb("/notifications", "POST", {
    user_id: CONSUMER_ID,
    kind: "ADMIN_ACTION",
    title: `Partner KYC Submitted: ${shop.shop_name}`,
    body: `CR ${shop.cr_number} · Civil ID ${shop.civil_id} · ${shop.branch_name || "Salalah"} submitted for regulatory review.`
  }).catch(() => {});
  render();
  toast(ar ? "تم إرسال ملف التوثيق واللوائح للمراجعة" : "Partner KYC & compliance dossier submitted for review");
}

function toggleShopSpecialty(catId) {
  const shop = getActiveShop();
  syncKycDraftInputsToShop(shop);
  if (!Array.isArray(shop.specialties)) shop.specialties = ["AC_REPAIR", "PLUMBER", "ELECTRICIAN"];
  const idx = shop.specialties.indexOf(catId);
  if (idx >= 0) {
    if (shop.specialties.length > 1) shop.specialties.splice(idx, 1);
  } else {
    shop.specialties.push(catId);
  }
  syncShopsToCloud();
  render();
}

function aAnalyticsScreen() {
  const ar = L === "ar";
  const jobs = S.jobs || [];
  const totalJobs = jobs.length;
  const completedJobs = jobs.filter(j => j.status === "COMPLETED").length;
  const openJobs = jobs.filter(j => j.status === "OPEN").length;
  const approvedShops = (S.shops || []).filter(s => s.kyc_status === "APPROVED").length;

  const jobVolumeOmr = jobs.reduce((sum, j) => {
    const acceptedBid = (S.bids || []).find(b => b.job_id === j.job_id && (b.status === "SELECTED" || b.status === "ACCEPTED"));
    const val = acceptedBid ? Number(acceptedBid.bid_amount || 0) : Number(j.final_price || j.budget_max || 0);
    return sum + (Number.isFinite(val) ? val : 0);
  }, 0);
  const txnVolumeOmr = (S.txns || []).reduce((sum, tx) => sum + Math.abs(Number(tx.amount || 0)), 0);
  const gmvNum = Math.max(jobVolumeOmr, txnVolumeOmr);
  const gmv = gmvNum.toFixed(3);
  const netRev = (gmvNum * 0.10).toFixed(3);

  const countByCat = (ids) => jobs.filter(j => ids.includes(j.category_id)).length;
  const denom = Math.max(1, totalJobs);
  const catBreakdown = [
    ["AC Repair & Maintenance", Math.round((countByCat(["AC_REPAIR"]) / denom) * 100), "#0284C7"],
    ["Electrician & Power", Math.round((countByCat(["ELECTRICIAN", "SOLAR_POWER"]) / denom) * 100), "#F59E0B"],
    ["Roadside SOS & Automotive", Math.round((countByCat(["ROADSIDE", "GARAGE", "TIRE_BATTERY", "CAR_WASH"]) / denom) * 100), "#DC2626"],
    ["Taxi & Local Delivery", Math.round((countByCat(["TAXI", "ERRANDS", "MOVING"]) / denom) * 100), "#EA580C"],
    ["Plumbing, Cleaning & Home", Math.round((countByCat(["PLUMBER", "CLEANING", "CARPENTER", "PAINTER", "PEST_CONTROL", "APPLIANCE", "CCTV_SMART", "WATER_TANK"]) / denom) * 100), "#10B981"]
  ];

  return `${bar(ar ? "لوحة الإحصائيات" : "Platform Analytics", S.stack.length > 0)}
  <div class="pad">
    <div class="card" style="background:linear-gradient(135deg,#111827,#1E3A8A);color:#fff;display:flex;flex-direction:column;gap:12px">
      <div class="row" style="justify-content:space-between">
        <div>
          <div style="font-size:12px;color:#93C5FD;font-weight:800">${ar ? "إجمالي حجم المعاملات الفعلية" : "Live Platform Order Volume"}</div>
          <div class="big" style="font-size:30px;color:#4ADE80;margin-top:4px">${gmv} <span style="font-size:15px;color:#fff">OMR</span></div>
        </div>
        <div style="text-align:end">
          <div style="font-size:11px;color:#CBD5E1">${ar ? "إيرادات رسوم المنصة" : "Platform Fee Revenue"}</div>
          <div style="font-size:19px;font-weight:900;color:#FBBF24">${netRev} OMR</div>
        </div>
      </div>

async function postJob() {
  const ar = L === "ar";

    d.step = 1;
    render();

    return;
  }
  if (!checkRateLimit("create_job", 3, 60000, "New Order Post", "نشر طلب جديد")) return;
  const c = cat(d.cat), sh = String(Math.floor(100000 + Math.random() * 900000));
  const addr = (S.addresses && S.addresses.find(a => a.address_id === d.address_id)) || defAddr();
  const [lat, lng] = addrCoords(addr);
  const tags = Array.from(new Set([
    ...(Array.isArray(d.tags) ? d.tags : []),
    ...(S.profile && S.profile.isProMember ? ["PRO_PRIORITY"] : [])
  ]));
  const tagStr = tags.length ? `[${tags.join(", ")}] ` : "";
  const destStr = d.destination ? ` [Destination: ${d.destination}]` : "";
  const schedStr = (d.when === "scheduled" && d.schedTime) ? ` [Schedule: ${d.schedTime}]` : "";
  const instStr = Array.isArray(d.instructions) && d.instructions.length ? ` [Instructions: ${d.instructions.join(", ")}]` : "";
  const addrLabel = (addr && addr.label) ? addr.label : "Location";
  const addrTag = ` [${addrLabel}: ${addrText(addr)}]`;
  const desc = (tagStr + rawNote + destStr + schedStr + instStr + addrTag).trim();
  const urg = d.when === "now" ? "EMERGENCY" : d.when === "urgent" ? "URGENT" : "NORMAL";
  const mediaList = [...(d.photos || [])];
  if (d.videoUrl) mediaList.push(d.videoUrl);

  const localJob = {
    job_id: "demo-" + sh,
    consumer_id: ME,
    category_id: c.id,
    sub_issue_tags: tags,
    urgency: urg,
    scheduled_for: (d.when === "scheduled" && d.schedTime) ? d.schedTime : null,
    description: desc,
    original_description: rawNote,
    location_geom: toEWKB(lat, lng),
    status: "OPEN",
    posting_kind: "STANDARD",
    budget_range_min: 0,
    budget_range_max: 0,
    ai_rewritten: false,
    media_urls: mediaList,
    videoUrl: d.videoUrl || null,
    videoName: d.videoName || null,
    is_approved: true,
    short_id: sh,
    tracking_id: "FX-" + sh,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };

  S.sheet = null;
  S.jobs.unshift(localJob);
  save("jobs", S.jobs);
  if (S.stack[S.stack.length - 1] === "book") S.stack.pop();
  render();

  try {
    const payload = {
      consumer_id: ME,
      category_id: c.id,
      sub_issue_tags: tags,
      urgency: urg,
      description: desc,
      original_description: rawNote,
      location_geom: toEWKB(lat, lng),
      status: "OPEN",
      posting_kind: "STANDARD",
      budget_range_min: 0,
      budget_range_max: 0,
      ai_rewritten: false,
      media_urls: mediaList,
      is_approved: true,
      short_id: sh,
      tracking_id: "FX-" + sh
    };
    const created = await sb("/jobs", "POST", payload);
    const realJob = Array.isArray(created) && created[0] ? created[0] : localJob;
    realJob.videoUrl = d.videoUrl || null;
    realJob.videoName = d.videoName || null;
    if (localJob.scheduled_for) realJob.scheduled_for = localJob.scheduled_for;

    // Save Customer Before verification photos into DB with valid phase='BEFORE'
    if (Array.isArray(d.photos) && d.photos.length) {
      for (const u of d.photos) {
        const phObj = { job_id: realJob.job_id, uploaded_by_user_id: ME || CONSUMER_ID, phase: "BEFORE", url: u, captured_in_app: true, _local: true, created_at: new Date().toISOString() };
        S.photos.unshift(phObj);
        try { await sb("/job_photos", "POST", { job_id: realJob.job_id, uploaded_by_user_id: ME || CONSUMER_ID, phase: "BEFORE", url: u, captured_in_app: true }); } catch (e) {}
      }

    }

    const vLoc = (S.vendorLocs && S.vendorLocs[0] && S.vendorLocs[0].live_geom) ? fromEWKB(S.vendorLocs[0].live_geom) : [17.0185, 54.0882];
    const distKm = Math.max(0.4, calcDistKm([lat, lng], vLoc)).toFixed(1);
    const schedNote = (d.when === "scheduled" && d.schedTime) ? ` (Scheduled: ${d.schedTime})` : "";
    sb("/notifications", "POST", {
      user_id: VENDOR_ID,
      kind: "NEW_JOB",
      title: `New ${cat(c.id).name} Job${schedNote} · ${distKm} km away`,
      body: `#${sh}: "${rawNote.slice(0, 70)}" — Tap to view details & send your bid!`,
      job_id: realJob.job_id

    await sync();

  } catch (e) {
    toast(L === "ar" ? `✓ تم حفظ وإرسال طلبك #${sh}` : `✓ Request #${sh} saved & broadcasted!`);
    go("job", localJob.job_id);
  }
}

// 4-SIDE CAMERA VERIFICATION MAPPED TO VALID POSTGRES PHASES:
// Slot 1: CUSTOMER_BEFORE -> phase="BEFORE" & uploaded_by_user_id=CONSUMER_ID
// Slot 2: VENDOR_BEFORE   -> phase="BEFORE" & uploaded_by_user_id=VENDOR_ID
// Slot 3: VENDOR_AFTER    -> phase="VENDOR_AFTER"
// Slot 4: CUSTOMER_AFTER  -> phase="CONSUMER_AFTER"
function getSidePhoto(jobId, slot) {
  const list = (S.photos || []).filter(p => p.job_id === jobId);
  if (slot === "CUSTOMER_BEFORE") {
    const p = list.find(x => x.slot === "CUSTOMER_BEFORE" || x.phase === "CUSTOMER_BEFORE" || (x.phase === "BEFORE" && x.uploaded_by_user_id !== VENDOR_ID));
    if (p) return p;
    const j = (S.jobs || []).find(x => x.job_id === jobId);
    if (j && Array.isArray(j.media_urls) && j.media_urls[0] && String(j.media_urls[0]).startsWith("data:image")) {
      return { job_id: jobId, url: j.media_urls[0], phase: "BEFORE", uploaded_by_user_id: j.consumer_id || ME || CONSUMER_ID };
    }
    return null;
  }
  if (slot === "VENDOR_BEFORE") {
    return list.find(x => x.slot === "VENDOR_BEFORE" || x.phase === "VENDOR_BEFORE" || (x.phase === "BEFORE" && x.uploaded_by_user_id === VENDOR_ID));
  }
  if (slot === "VENDOR_AFTER") {
    return list.find(x => x.slot === "VENDOR_AFTER" || x.phase === "VENDOR_AFTER");
  }
  if (slot === "CUSTOMER_AFTER") {
    return list.find(x => x.slot === "CUSTOMER_AFTER" || x.phase === "CUSTOMER_AFTER" || x.phase === "CONSUMER_AFTER");
  }
  return null;
}

function addSidePhoto(jobId, slot, onDoneCb) {
  const ar = L === "ar";
  // Live Camera ONLY with GPS + Timestamp Stamp in corner!
  captureVerificationPhoto(async function(stampedDataUrl) {
    const dbPhase = (slot === "CUSTOMER_BEFORE" || slot === "VENDOR_BEFORE")
      ? "BEFORE"
      : (slot === "VENDOR_AFTER" ? "VENDOR_AFTER" : "CONSUMER_AFTER");
    const uploader = (slot === "VENDOR_BEFORE" || slot === "VENDOR_AFTER") ? VENDOR_ID : (ME || CONSUMER_ID);

    // Remove previous photo for this exact slot
    S.photos = (S.photos || []).filter(p => !(p.job_id === jobId && (p.slot === slot || (p.phase === dbPhase && p.uploaded_by_user_id === uploader))));
    const newPh = {
      job_id: jobId,
      uploaded_by_user_id: uploader,
      phase: dbPhase,
      slot: slot,
      url: stampedDataUrl,
      captured_in_app: true,
      _local: true,
      created_at: new Date().toISOString()
    };
    S.photos.unshift(newPh);
    save("photos", S.photos);
    render();
    toast(ar ? "✓ تم التقاط وتوثيق الصورة بالإحداثيات والوقت" : "✓ Live camera photo stamped with GPS & timestamp!");
    try {
      await sb("/job_photos", "POST", {
        job_id: jobId,
        uploaded_by_user_id: uploader,
        phase: dbPhase,
        url: stampedDataUrl,
        captured_in_app: true
      });
    } catch (e) {}
    if (typeof onDoneCb === "function") onDoneCb(stampedDataUrl);
  });
}

// FINAL PAYMENT CONFIRMATION ON CHECKOUT PAGE (ONLY AFTER BID IS ACCEPTED!)
async function confirmBidPayment() {
  const ar = L === "ar";
  const jobId = S.checkoutJobId || S.jobId;
  const bidId = S.checkoutBidId;
  const j = S.jobs.find(x => x.job_id === jobId) || S.jobs[0];
  if (!j) return;
  const b = (S.bids || []).find(x => x.bid_id === bidId) || (S.bids || []).find(x => x.job_id === jobId);
  const sub = Number(b ? b.bid_amount : price(j));
  const d = S.draft || {};
  const proDisc = d.useProPlan ? Number((sub * 0.15).toFixed(3)) : 0;
  const cpnPct = getCouponPct(S.appliedCoupon);
  const cpnDisc = cpnPct > 0 ? Number(((sub * cpnPct) / 100).toFixed(3)) : 0;
  const visitFee = (d.useProPlan || S.appliedCoupon === "SALALAH25") ? 0.000 : 0.590;
  const svcFee = 0.150;
  const totalAmt = Math.max(0, Number((sub - proDisc - cpnDisc + visitFee + svcFee).toFixed(3)));
  const payMethod = d.payMethod || "INSTANT_PAY";

  if (payMethod === "WALLET") {
    const curBal = Number((S.wallet && S.wallet.balance) || 0);
    if (curBal < totalAmt) {
      toast(ar ? `⚠ رصيد المحفظة غير كافٍ (${fmtOmr(curBal)} ر.ع) — اشحن المحفظة أو اختر الدفع بالبطاقة` : `⚠ Insufficient Wallet balance (${fmtOmr(curBal)} OMR) — Top up or pay by card!`);
      return;

    },

  };
  S.txns.unshift(newTxObj);
  save("txns", S.txns);
  S.appliedCoupon = null;
  save("appliedCoupon", null);
  const wId = (S.wallet && S.wallet.wallet_id) || "509224ca-f303-422f-8caf-55b56331a488";
  sb("/wallet_transactions", "POST", {
    wallet_id: wId,
    user_id: ME,
    job_id: j.job_id,
    kind: "JOB_FUND_HOLD",
    amount: -totalAmt,
    balance_after: Number(((S.wallet && S.wallet.balance) || 0).toFixed(3)),
    external_ref: JSON.stringify(newTxObj.bill),
    note: `${cat(j.category_id).name} · Order ${sid(j)} (Bid ${sub.toFixed(3)} + Fees ${(visitFee + svcFee).toFixed(3)}${(proDisc + cpnDisc) > 0 ? " - Disc " + (proDisc + cpnDisc).toFixed(3) : ""} = ${totalAmt.toFixed(3)} OMR)`

  const lat = (S.addrDraft && S.addrDraft.lat) || 17.0150;

  const geom = toEWKB(lat, lng);

  const building = (bldg || "").trim() || null;
  const floor = (flr || "").trim() || null;
  const makeDefault = Boolean(isDef || !S.addresses.length);

  if (makeDefault) S.addresses.forEach(a => { a.is_default = false; });

    const idx = S.addresses.findIndex(a => a.address_id === editId);

async function addCard() {
  const num = ((document.getElementById("cardNum") || {}).value || "").replace(/\D/g, "");
  const holder = ((document.getElementById("cardHolder") || {}).value || S.profile.full_name).trim().toUpperCase();
  const exp = ((document.getElementById("cardExp") || {}).value || "").trim();
  const cvv = ((document.getElementById("cardCvv") || {}).value || "").replace(/\D/g, "");
  if (!isValidLuhnCard(num)) { toast(L === "ar" ? "رقم البطاقة غير صحيح" : "Invalid card number. Please check your card details."); return; }
  if (!isValidCardExpiryMmYy(exp)) { toast(L === "ar" ? "تاريخ انتهاء البطاقة غير صالح" : "Please enter a valid non-expired date (MM/YY)"); return; }
  if (cvv.length < 3 || cvv.length > 4) { toast(L === "ar" ? "أدخل رمز الأمان CVV" : "Please enter your card CVV code"); return; }
  if (holder.length < 2) { toast(L === "ar" ? "أدخل اسم حامل البطاقة" : "Please enter the cardholder name"); return; }
  const last4 = num.slice(-4);
  const brand = num.startsWith("4") ? "VISA" : /^5[1-5]/.test(num) || /^2[2-7]/.test(num) ? "MASTERCARD" : num.startsWith("3") ? "AMEX" : "OMANNET";
  const parts = exp.split("/");
  const exp_month = Math.min(12, Math.max(1, parseInt(parts[0], 10) || 9));
  const rawYr = parseInt(parts[1], 10) || 28;
  const exp_year = rawYr < 100 ? 2000 + rawYr : rawYr;
  S.cards.forEach(c => { c.is_default = false; });
  const newCard = { pm_id: "pm-" + Date.now(), user_id: ME, brand, last4, cardNumber: num, cvv, exp_month, exp_year, holder_name: holder, is_default: true };
  S.cards.push(newCard);
  save("cards", S.cards);
  S.sheet = null;
  render();
  toast(L === "ar" ? "✓ تم حفظ البطاقة" : "✓ Card saved");
}

    S.sheet = "paypal";

  }

    status: "COMPLETED",

  });

  try {
    if (S.wallet.wallet_id) {
      await sb(`/wallets?wallet_id=eq.${S.wallet.wallet_id}`, "PATCH", { balance: newBal, updated_at: new Date().toISOString() });
      await sb("/wallet_transactions", "POST", { wallet_id: S.wallet.wallet_id, user_id: ME, kind: "TOPUP", amount: amt, balance_after: newBal, external_ref: ppOrd.id || null, note: "Wallet Top-Up" });

    sync();

async function withdrawFunds(amountOmr) {
  const amt = parseFloat(amountOmr);
  if (isNaN(amt) || amt <= 0) return;
  const cur = Number(S.wallet.balance || 0);
  if (amt > cur) { toast("⚠ Insufficient balance"); return; }
  const newBal = cur - amt;
  S.wallet.balance = newBal;
  save("wallet", S.wallet);
  S.sheet = null; render();
  try {
    if (S.wallet.wallet_id) {
      await sb(`/wallets?wallet_id=eq.${S.wallet.wallet_id}`, "PATCH", { balance: newBal, updated_at: new Date().toISOString() });
      await sb("/wallet_transactions", "POST", { wallet_id: S.wallet.wallet_id, user_id: ME, kind: "PAYOUT", amount: -amt, balance_after: newBal, note: "Bank Muscat Transfer" });
    }
    toast("✓ Withdrawal: -" + amt.toFixed(3) + " OMR");
    sync();
  } catch (e) { toast("✓ Balance updated locally"); }
}

/* ================= REAL TALABAT GPS MAP ENGINE (NO FAKE MOVING CAR) ================= */
let activeMapInstances = {};

function getJobCoords(j) {
  if (j && j.location_geom) {
    const c = fromEWKB(j.location_geom);
    if (c && Math.abs(c[0] - 17.0150) > 0.0001) return c;
  }
  if (S.userGps && S.userGps.length === 2) return S.userGps;
  return addrCoords(defAddr());
}

function getAssignedProCoords(j, destCoord) {
  if (!j || (j.status !== "BID_SELECTED" && j.status !== "IN_PROGRESS")) return null;
  if (j.vendor_lat && j.vendor_lng) return [Number(j.vendor_lat), Number(j.vendor_lng)];
  // 1. Check if technician shared live GPS coordinates in job chat
  const msgs = jobMsgs(j.job_id);
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = String(msgs[i].content || "").match(/([12]\d\.\d{3,})\s*,\s*(5\d\.\d{3,})/);
    if (m) return [parseFloat(m[1]), parseFloat(m[2])];
  }
  // 2. If running as Vendor and device GPS is active, use real Vendor device GPS
  if (ROLE === "vendor" && S.userGps && S.userGps.length === 2) {
    return S.userGps;
  }
  // 3. Check real live_geom from Supabase vendor_availability table!
  const chosenBid = (S.bids || []).find(b => b.job_id === j.job_id && (b.status === "SELECTED" || b.status === "ACCEPTED"));
  const vid = (chosenBid && chosenBid.vendor_id) || VENDOR_ID;
  const vRow = (S.vendorLocs || []).find(v => v.vendor_id === vid) || (S.vendorLocs || [])[0];
  if (vRow && vRow.live_geom) {
    const vc = fromEWKB(vRow.live_geom);
    if (vc && Math.abs(vc[0] - destCoord[0]) > 0.0002) return vc;
  }
  // 4. Default to verified Vendor dispatch hub in Salalah Sanaiya
  return [17.0185, 54.0882];
}

function initTalabatMap(containerId, jobId) {
  const Lf = window.L || Leaf;
  if (!Lf || !Lf.map) return;
  const el = document.getElementById(containerId);
  if (!el) return;

  if (activeMapInstances[containerId] && activeMapInstances[containerId].el === el) {
    setTimeout(() => { try { activeMapInstances[containerId].map.invalidateSize(); } catch(e){} }, 100);
    return;
  }
  if (activeMapInstances[containerId] && activeMapInstances[containerId].map) {
    try { activeMapInstances[containerId].map.remove(); } catch(e) {}
  }

  const j = (jobId && S.jobs.find(x => x.job_id === jobId)) || null;
  const destCoord = getJobCoords(j);
  const proCoord = getAssignedProCoords(j, destCoord);

  try {
    const center = proCoord
      ? [(destCoord[0] + proCoord[0]) / 2, (destCoord[1] + proCoord[1]) / 2]
      : destCoord;

    const map = Lf.map(containerId, {
      center,
      zoom: proCoord ? 14 : 16,
      zoomControl: false,
      attributionControl: false
    });

    const tl = Lf.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", {
      maxZoom: 19
    }).addTo(map);
    tl.on("tileerror", function() {
      Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    });

    // Soft Talabat accuracy / service radius halo around customer pin
    const AccuracyCircle = Lf.circle(destCoord, {
      radius: proCoord ? 120 : 220,
      color: "#FF5A00",
      weight: 1.5,
      fillColor: "#FF5A00",
      fillOpacity: 0.10
    }).addTo(map);

    // Talabat-style Customer Location Pin (Orange Pin + White Home Center)
    const destIcon = Lf.divIcon({
      className: "talabat-dest-pin",
      html: `<div style="position:relative;display:flex;flex-direction:column;align-items:center">
        <div style="background:#1A1A1A;color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;margin-bottom:4px;box-shadow:0 3px 8px rgba(0,0,0,.25)">${L === "ar" ? "موقعك المثبت" : "Service Location"}</div>
        <div style="background:#FF5A00;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid #fff;box-shadow:0 4px 14px rgba(255,90,0,0.45)">
          <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.4"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </div>
      </div>`,
      iconSize: [110, 62],
      iconAnchor: [55, 54]
    });
    const destMarker = Lf.marker(destCoord, { icon: destIcon }).addTo(map);

    let proMarker = null, routeLine = null;
    // ONLY show Technician Pin & Real Street Route when a technician is ACTUALLY assigned
    if (proCoord) {
      routeLine = Lf.polyline([proCoord, destCoord], {
        color: "#FF5A00",
        weight: 5,
        opacity: 0.9
      }).addTo(map);

      // Fetch real road geometry from OSRM so the route follows actual Salalah streets!
      fetch(`https://router.project-osrm.org/route/v1/driving/${proCoord[1]},${proCoord[0]};${destCoord[1]},${destCoord[0]}?overview=full&geometries=geojson`)
        .then(r => r.json())
        .then(data => {
          if (data && data.routes && data.routes[0] && data.routes[0].geometry) {
            const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            if (routeLine) routeLine.setLatLngs(coords);
          }
        })
        .catch(() => {});

      const proIcon = Lf.divIcon({
        className: "talabat-pro-pin",
        html: `<div style="position:relative;display:flex;flex-direction:column;align-items:center">
          <div style="background:#00A862;color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;margin-bottom:4px;box-shadow:0 3px 8px rgba(0,0,0,.25)">${L === "ar" ? "الفني المعتمد" : "Assigned Pro"}</div>
          <div style="width:36px;height:36px;border-radius:50%;background:#00A862;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,168,98,0.45);border:3px solid #fff">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.3"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </div>
        </div>`,
        iconSize: [90, 62],
        iconAnchor: [45, 54]
      });
      proMarker = Lf.marker(proCoord, { icon: proIcon }).addTo(map);
      map.fitBounds(Lf.latLngBounds([destCoord, proCoord]), { padding: [45, 45], maxZoom: 15 });
    }

    activeMapInstances[containerId] = { map, marker: proMarker, destMarker, AccuracyCircle, routeLine, el };
    setTimeout(() => { map.invalidateSize(); }, 200);
  } catch(e) {}
}

function initAddressPinMap() {
  const Lf = window.L || Leaf;
  if (!Lf || !Lf.map) return;
  const el = document.getElementById("addrPinMap");
  if (!el) return;
  if (activeMapInstances._addrPin && activeMapInstances._addrPin.el === el) return;
  if (activeMapInstances._addrPin && activeMapInstances._addrPin.map) {
    try { activeMapInstances._addrPin.map.remove(); } catch(e) {}
  }
  const defaultCoords = S.userGps || [17.0150, 54.0924];
  const d = S.addrDraft || { lat: defaultCoords[0], lng: defaultCoords[1] };
  try {
    const map = Lf.map("addrPinMap", { center: [d.lat, d.lng], zoom: 16, zoomControl: false, attributionControl: false });
    const tl2 = Lf.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", { maxZoom: 19 }).addTo(map);
    tl2.on("tileerror", function() { Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map); });
    const updatePin = (lat, lng) => {
      if (!S.addrDraft) S.addrDraft = {};
      S.addrDraft.lat = Number(lat.toFixed(5));
      S.addrDraft.lng = Number(lng.toFixed(5));
      const area = salalahAreaName(lat, lng);
      S.addrDraft.area = area;
      const areaEl = document.getElementById("addrPinArea");
      if (areaEl) areaEl.innerText = area;
    };
    map.on("move", () => {
      const c = map.getCenter();
      updatePin(c.lat, c.lng);
    });
    map.on("click", e => {
      map.panTo(e.latlng);
      updatePin(e.latlng.lat, e.latlng.lng);
    });
    activeMapInstances._addrPin = { map, el };
    setTimeout(() => { map.invalidateSize(); }, 200);
  } catch (e) {}
}

function isNotifRead(n) {
  if (!n) return true;
  if (n.read_at) return true;
  if (S.allNotifsReadAt && n.created_at) {
    const t = new Date(n.created_at).getTime();
    if (!isNaN(t) && t <= S.allNotifsReadAt) return true;
  }
  const key = n.notif_id || n.id || ((n.title || "") + "_" + (n.created_at || ""));

function getProDirectoryInfo(vendorId) {
  const base = PRO_DIRECTORY[vendorId] || PRO_DIRECTORY[VENDOR_ID];
  const defaultRevs = [
    {
      job_id: "default-rv-1",
      rating: 5,
      reviewer: "Ahmed Al Shanfari",
      comment: "5 stars! Khalid arrived in 20 minutes in Al Saada, refilled our split AC R410A gas and cleaned the drain pipe. Super clean work.",
      created_at: new Date(Date.now() - 2 * 86400000).toISOString()
    },
    {
      job_id: "default-rv-2",
      rating: 5,
      reviewer: "Fatima Bait Said",
      comment: "Very polite and professional electrician. Fixed our main breaker trip on the spot and tested all sockets.",
      created_at: new Date(Date.now() - 5 * 86400000).toISOString()
    },
    {
      job_id: "default-rv-3",
      rating: 1,
      reviewer: "Salim Al Kathiri",
      comment: "1 star - he ruined my work and burst the main water pipe while tightening the heater valve, we had to call support for a warranty revisit.",
      created_at: new Date(Date.now() - 11 * 86400000).toISOString()
    }
  ];
  // Deduplicate DB reviews by job_id AND comment text so only 1 review per job ever appears
  const seenJobs = new Set();
  const seenComments = new Set();
  const dbRevs = [];
  (S.reviews || []).forEach(r => {
    if (vendorId && r.vendor_id && r.vendor_id !== vendorId) return;
    const cm = String(r.comment || r.body || "").trim();
    if (!cm || cm.toLowerCase() === "test") return;
    const jKey = r.job_id || "";
    const cKey = cm.toLowerCase().slice(0, 40);
    if ((jKey && seenJobs.has(jKey)) || seenComments.has(cKey)) return;
    if (jKey) seenJobs.add(jKey);
    seenComments.add(cKey);
    dbRevs.push({
      job_id: jKey,
      rating: Number(r.rating || 5),
      reviewer: r.reviewer_name || r.reviewer || "Verified Customer",
      comment: cm,
      created_at: r.created_at
    });
  });

  const combined = [...dbRevs];
  defaultRevs.forEach(dr => {
    const cKey = dr.comment.toLowerCase().slice(0, 40);
    if (!seenComments.has(cKey)) {
      seenComments.add(cKey);
      combined.push(dr);
    }
  });
  const doneCount = Math.max(base.jobsDone, 40 + S.jobs.filter(j => j.status === "COMPLETED").length);
  const customPfp = (ROLE === "vendor" && S.profile && S.profile.avatar) ? S.profile.avatar : base.pfpUrl;
  return { ...base, pfpUrl: customPfp, isOnline: isVendorOnline(vendorId), jobsDone: doneCount, reviews: combined };
}

const PAYPAL_MERCHANT_EMAIL = "payments@fixit-now.xyz";

async function createRealPayPalOrder(amountOmr, description, refId, payDetails) {
  const usdVal = Math.max(1.00, Number(amountOmr || 1) * 2.60).toFixed(2);
  const details = payDetails || S.inAppCardDraft || {};
  const savedCard = (S.cards && S.cards.find(c => c.is_default)) || (S.cards && S.cards[0]) || null;
  const paymentMode = details.mode === "PAYPAL_BALANCE" ? "PAYPAL_BALANCE" : "CARD";
  const resolvedCardNum = details.cardNumber || (savedCard && savedCard.cardNumber) || "";
  const resolvedExp = details.cardExpiry || (savedCard && savedCard.exp_month && savedCard.exp_year ? `${String(savedCard.exp_month).padStart(2, "0")}/${String(savedCard.exp_year).slice(-2)}` : "");
  const resolvedCvv = details.cardCvv || (savedCard && savedCard.cvv) || "";
  const resolvedHolder = details.cardHolder || (savedCard && savedCard.holder_name) || S.profile.full_name || "";
  const resolvedEmail = details.paypalEmail || S.profile.paypal_email || S.profile.email || "";

  const resp = await apiCall("/api/payments/paypal/checkout", {
    method: "POST",
    body: {
      amountOmr: Number(amountOmr || 1),
      description: String(description || "FixIt Salalah Home Service").slice(0, 120),
      refId: String(refId || ("FX-" + Date.now())).slice(0, 32),
      purpose: S.paypalPurpose || "ORDER",
      paymentMode,
      cardNumber: resolvedCardNum,
      cardExpiry: resolvedExp,
      cardCvv: resolvedCvv,
      cardHolder: resolvedHolder,
      paypalEmail: resolvedEmail
    }
  });
  if (!resp || !resp.ok) {
    throw new Error((resp && resp.error) || "In-app payment failed. Please check your card or PayPal details.");
  }
  S.lastPayPalOrder = {
    id: resp.id || resp.orderId || ("PP-INAPP-" + Date.now()),
    status: resp.status || "COMPLETED",
    inAppProcessed: true,
    redirectRequired: false,
    paymentMode: resp.paymentMode || paymentMode,
    cardBrand: resp.cardBrand || null,
    cardLast4: resp.cardLast4 || null,
    payerEmail: resp.payerEmail || null,
    amountOmr: Number(amountOmr).toFixed(3),
    amountUsd: resp.amountUsd || usdVal,
    approveUrl: null,
    merchant: PAYPAL_MERCHANT_EMAIL,
    created_at: resp.capturedAt || new Date().toISOString()
  };
  save("lastPayPalOrder", S.lastPayPalOrder);
  return S.lastPayPalOrder;
}

function updateOpenJobChatInPlace() {
  const chatEl = document.getElementById("chat");

  const j = S.jobs.find(x => x.job_id === S.jobId) || S.jobs[0];
  if (!j) return;
  const ms = jobMsgs(j.job_id);
  const sig = j.job_id + "_" + ms.length + "_" + (ms.length ? (ms[ms.length - 1].message_id || ms[ms.length - 1].created_at) : "");
  if (chatEl.getAttribute("data-chat-sig") !== sig) {
    const wasNearBottom = (chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight) < 120;
    chatEl.innerHTML = renderJobChatMessagesHtml(j);
    chatEl.setAttribute("data-chat-sig", sig);
    if (wasNearBottom) scrollChat();
  }

// POST-BID CHECKOUT SCREEN: Only opened AFTER customer accepts a specific Technician's Bid!
function checkoutScreen() {
  const ar = L === "ar";
  const jobId = S.checkoutJobId || S.jobId || (S.jobs[0] && S.jobs[0].job_id);
  const j = S.jobs.find(x => x.job_id === jobId) || S.jobs[0] || {};
  const bid = S.bids.find(b => b.bid_id === S.checkoutBidId) || S.bids.find(b => b.job_id === j.job_id) || { bid_amount: price(j), vendor_id: VENDOR_ID };
  const c = cat(j.category_id);
  const a = defAddr();
  const [lat, lng] = j.location_geom ? fromEWKB(j.location_geom) : addrCoords(a);
  setTimeout(() => initMiniPreviewMap("chkMiniMap", lat, lng), 50);

  if (!S.draft) S.draft = {};
  if (!S.draft.payMethod || S.draft.payMethod === "CASH") S.draft.payMethod = "PAYPAL";
  const useProPlan = Boolean(S.draft.useProPlan || (S.profile && S.profile.isProMember));

  const bidSub = Number(bid.bid_amount || 10);
  const proDisc = useProPlan ? Number((bidSub * 0.15).toFixed(3)) : 0;
  const cpnPct = getCouponPct(S.appliedCoupon);
  const cpnDisc = cpnPct > 0 ? Number(((bidSub * cpnPct) / 100).toFixed(3)) : 0;
  const visitFee = (useProPlan || S.appliedCoupon === "SALALAH25") ? 0.000 : 0.590;
  const svcFee = 0.150;
  const totalAmt = Math.max(0, Number((bidSub - proDisc - cpnDisc + visitFee + svcFee).toFixed(3)));
  S.draft.finalTotal = totalAmt;

  const vInfo = getProDirectoryInfo(bid.vendor_id);

  return `<div style="background:#F5F5F7;min-height:100vh;padding-bottom:110px">
    <div style="padding:12px 16px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:50">
      <button class="ib" style="background:#fff;border:1px solid #E5E7EB!important" onclick="back()">${I("back", "flip")}</button>
      <div class="sp">
        <div style="font-size:18px;font-weight:800;line-height:1.15">${ar ? "الدفع وتأكيد قبول العرض" : "Accept Bid & Checkout"}</div>
        <div style="font-size:12px;color:#6B7280">${c.name} · ${sid(j)} · ${esc(ar ? vInfo.nameAr : vInfo.nameEn)}</div>
      </div>
    </div>

    <div class="pad" style="gap:14px">
      <!-- 1. Selected Pro & Accepted Bid Summary -->
      <div class="card row" style="gap:12px;border:1.5px solid var(--o)">
        <div class="av" style="background:var(--o);width:48px;height:48px;font-size:16px">${esc(vInfo.avatar)}</div>
        <div class="sp">
          <div class="row" style="gap:6px">
            <span class="t1" style="font-size:16px">${esc(ar ? vInfo.nameAr : vInfo.nameEn)}</span>
            <span class="pill ok" style="font-size:10px">★ ${vInfo.rating.toFixed(1)} (${vInfo.jobsDone} ${ar ? "عمل" : "jobs"})</span>
          </div>
          <div class="t2" style="font-size:12.5px;margin-top:2px">${ar ? "عرض السعر المقبول شاملة ضمان 14 يوماً" : "Accepted offer · Covered by 14-day warranty"}</div>
        </div>
        <div style="text-align:end">
          <div class="num" style="font-size:19px;color:var(--o)">${bidSub.toFixed(3)}</div>
          <div class="t2" style="font-size:11px">${t("omr")}</div>
        </div>
      </div>

      <!-- 2. Address Card with Mini Google Map -->
      <div class="card" style="padding:0;overflow:hidden">
        <div id="chkMiniMap" style="height:110px;width:100%;background:#EAECEF"></div>
        <div style="padding:12px 16px;display:flex;align-items:center;gap:10px">
          <div style="color:var(--tx)">${I("pin")}</div>
          <div class="sp">
            <div style="font-size:15px;font-weight:800">${esc(a.label)} (${esc(salalahAreaName(lat, lng))})</div>
            <div style="font-size:13px;color:#6B7280">${esc(addrText(a))}</div>
          </div>
        </div>
      </div>

      <!-- 3. FixIt Pro Purple Subscription Banner -->
      <div class="pro-banner">
        <div class="sp">
          <div style="font-size:16.5px;font-weight:900;color:#D9F99D">${ar ? "باقة FixIt Pro · وفر 15% + زيارة مجانية" : "FixIt Pro · 15% Off + Free Visit"}</div>
          <div style="font-size:12px;opacity:.92;margin-top:3px">${ar ? "فعّل خصم الأعضاء فوراً على عرض الفني" : "Apply instant 15% member discount on this technician's bid"}</div>
          <button style="margin-top:10px;background:#fff;color:#1A1A1A;font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:99px" onclick="S.draft.useProPlan=!S.draft.useProPlan;render()">
            ${useProPlan ? (ar ? "✓ خصم Pro مفعل (-15%)" : "✓ FixIt Pro applied (-15%)") : (ar ? "تفعيل خصم Pro الآن" : "Apply FixIt Pro (-15%)")}
          </button>
        </div>
        <div style="text-align:center;background:rgba(0,0,0,.25);padding:10px 12px;border-radius:14px;flex-shrink:0">
          <div style="font-size:20px;font-weight:900;color:#D9F99D;line-height:1">PRO</div>
          <div style="font-size:11px;font-weight:800;color:#fff;margin-top:2px">-15%</div>
        </div>
      </div>

      <!-- 4. Payment Method -->
      <div>
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <div style="font-size:18px;font-weight:800">${ar ? "طريقة الدفع" : "Payment Method"}</div>
          <button style="text-decoration:underline;font-weight:700;font-size:13.5px;color:#003087" onclick="S.paypalPurpose='CONNECT';S.sheet='paypal';render()">${ar ? "تعديل" : "Edit"}</button>
        </div>
        <div class="card" style="padding:0 16px">
          <button class="li" onclick="S.draft.payMethod='PAYPAL';render()">
            <div style="background:#003087;color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:17px">P</div>
            <div class="sp">
              <div class="t1" style="font-size:15px">${ar ? "بطاقة بنكية أو PayPal" : "Card or PayPal"}</div>
              <div class="t2" style="font-size:12px">${S.cards && S.cards[0] ? `${esc(S.cards[0].brand || "CARD")} •••• ${esc(S.cards[0].last4)}` : esc(S.profile.paypal_email || S.profile.email || (ar ? "فيزا، ماستركارد، أو PayPal" : "Visa, Mastercard, or PayPal"))}</div>
            </div>
            <div class="radio-dot ${S.draft.payMethod === 'PAYPAL' ? 'on' : ''}"></div>
          </button>
          <button class="li" onclick="S.draft.payMethod='WALLET';render()">
            <div style="background:var(--o2);color:var(--o);width:38px;height:38px;border-radius:10px;display:grid;place-items:center">${I("wallet")}</div>
            <div class="sp">
              <div class="t1" style="font-size:15px">${ar ? "رصيد المحفظة" : "Wallet Balance"} (${fmtOmr(S.wallet.balance)} ${t("omr")})</div>
              <div class="t2" style="font-size:12px">${ar ? "خصم مباشر من رصيدك" : "Pay from your wallet balance"}</div>
            </div>
            <div class="radio-dot ${S.draft.payMethod === 'WALLET' ? 'on' : ''}"></div>
          </button>
        </div>
      </div>

      <!-- 5. Voucher / Promo Code -->
      <div>
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <div style="font-size:18px;font-weight:800">${ar ? "قسيمة الخصم" : "Save on your order"}</div>
          <button style="text-decoration:underline;font-weight:700;font-size:13.5px" onclick="go('coupons')">${ar ? "إدارة القسائم" : "All vouchers"}</button>
        </div>
        <div class="card" style="display:flex;flex-direction:column;gap:10px">
          <div class="row" style="gap:8px">
            <input id="chkVoucherInp" class="sp" style="height:40px;background:#F3F4F6;padding:0 12px;border-radius:10px;font-size:14px;font-weight:700;text-transform:uppercase" placeholder="${ar ? "أدخل رمز القسيمة..." : "Enter voucher code..."}" value="${esc(S.appliedCoupon || "")}">
            ${S.appliedCoupon
              ? `<button class="btn s" style="width:auto;height:40px;padding:0 14px;background:var(--rd2);color:var(--rd)" onclick="S.appliedCoupon=null;save('appliedCoupon',null);toast('Voucher removed');render()">${ar ? "إزالة" : "Remove"}</button>`
              : `<button class="btn s" style="width:auto;height:40px;padding:0 16px" onclick="validateAndApplyCoupon((document.getElementById('chkVoucherInp')||{}).value)">${ar ? "تطبيق" : "Apply"}</button>`}
          </div>
          <div class="chips" style="margin:0;padding:0">
            ${getAvailableVouchers().map(vc => {
              const code = String(vc.code).toUpperCase();
              const pct = Number(vc.discount_value || vc.discount_pct || 15);
              const isOn = S.appliedCoupon === code;
              return `<button class="chip ${isOn ? 'on' : ''}" style="height:32px;font-size:12px" onclick="if(S.appliedCoupon==='${esc(code)}'){S.appliedCoupon=null;save('appliedCoupon',null);render();}else{validateAndApplyCoupon('${esc(code)}');}">
                ${esc(code)} (-${pct}%) ${isOn ? "✓" : ""}
              </button>`;
            }).join("")}
          </div>
        </div>
      </div>

      <!-- 6. Final Payment Summary -->
      <div>
        <div style="font-size:18px;font-weight:800;margin-bottom:8px">${ar ? "ملخص الدفع النهائي" : "Final Payment Summary"}</div>
        <div class="card" style="display:flex;flex-direction:column;gap:8px">
          <div class="sumr"><span>${ar ? "قيمة عرض الفني" : "Technician's Bid Amount"}</span><b>${bidSub.toFixed(3)} ${t("omr")}</b></div>
          ${cpnDisc > 0 ? `<div class="sumr"><span style="color:var(--gr)">${ar ? `خصم القسيمة (${S.appliedCoupon} · ${cpnPct}%)` : `Voucher Discount (${S.appliedCoupon} · ${cpnPct}%)`}</span><b style="color:var(--gr)">-${cpnDisc.toFixed(3)} ${t("omr")}</b></div>` : ""}
          ${proDisc > 0 ? `<div class="sumr"><span style="color:#6B21A8">${ar ? "خصم باقة Pro (15%)" : "FixIt Pro Discount (15%)"}</span><b style="color:#6B21A8">-${proDisc.toFixed(3)} ${t("omr")}</b></div>` : ""}
          <div class="sumr"><span class="hl-lime">${ar ? "رسوم الزيارة" : "Visit fee"}</span><b><span class="hl-lime">${visitFee.toFixed(3)} ${t("omr")}</span></b></div>

          <div class="sumr" style="border-top:1px solid var(--ln);padding-top:10px;margin-top:4px;font-size:17px">
            <b style="color:var(--tx)">${ar ? "المبلغ الإجمالي للدفع" : "Total to Pay Now"}</b>

          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Sticky Pay & Assign Pro Button -->
    <div style="position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);z-index:120">
      <button class="tlbt-pill-btn" onclick="confirmBidPayment()">
        ${ar ? `الدفع وتعيين الفني (${totalAmt.toFixed(3)} ${t("omr")})` : `Pay ${totalAmt.toFixed(3)} ${t("omr")} & Assign Pro`}
      </button>
    </div>
  </div>`;
}

// Talabat "One last check..." 6-Second Confirmation Screen
let _lastCheckInterval = null;
function startLastCheckFlow() {
  const ar = L === "ar";
  const d = S.draft || {};
  const noteEl = document.getElementById("note");
  if (noteEl && noteEl.value) d.note = noteEl.value.trim();
  const schedInp = document.getElementById("schedTimeInp");
  if (schedInp && schedInp.value) d.schedTime = schedInp.value.trim();

  if (!d.cat || !CATS.some(x => x[0] === d.cat)) {
    d.step = 1;
    render();
    toast(ar ? "اختر نوع الخدمة أولاً" : "Please select a service category first");
    return;
  }
  const rawNote = (d.note || "").trim();
  if (rawNote.length < 3) {
    d.step = 2;
    render();
    toast(ar ? "يرجى كتابة وصف المشكلة أولاً قبل إرسال الطلب" : "Please describe the problem before sending your request");
    return;
  }

  clearInterval(_lastCheckInterval);
  S.lastCheckSec = 6;
  go("last_check");
  _lastCheckInterval = setInterval(() => {
    if (!isOpenScreen("last_check")) {
      clearInterval(_lastCheckInterval);
      return;
    }
    S.lastCheckSec = Math.max(0, (S.lastCheckSec || 6) - 1);
    const btnEl = document.getElementById("lastCheckTimerTxt");
    if (btnEl) btnEl.innerText = `(00:0${S.lastCheckSec})`;
    const barEl = document.getElementById("lastCheckProgBar");
    if (barEl) barEl.style.width = `${((6 - S.lastCheckSec) / 6) * 100}%`;
    if (S.lastCheckSec <= 0) {
      clearInterval(_lastCheckInterval);
      confirmLastCheckOrder();
    }
  }, 1000);
}

function getTxBill(tx) {
  if (!tx) return null;
  if (tx.bill && typeof tx.bill === "object") return tx.bill;
  if (tx.external_ref && typeof tx.external_ref === "string") {
    if (tx.external_ref.startsWith("{")) {
      try { return JSON.parse(tx.external_ref); } catch (e) {}
    }
    if (tx.external_ref.startsWith("BILL|")) {
      const map = {};
      tx.external_ref.slice(5).split("|").forEach(kv => {
        const [k, v] = kv.split("=");
        if (k) map[k] = v;
      });
      return {
        bid_amount: Number(map.bid || 0),
        visit_fee: Number(map.callout || 0.500),
        service_fee: Number(map.svc || 0.500),
        coupon_discount: Number(map.disc || 0),
        pro_discount: 0,
        vat_amount: Number(map.vat || 0),
        total_paid: Number(map.total || Math.abs(Number(tx.amount || 0))),
        payment_method: map.method || tx.payment_method || "FixIt Pay Wallet"
      };
    }
  }
  const isOrder = Number(tx.amount) < 0 && tx.kind !== "SUBSCRIPTION" && !/sub|membership|pro\+/i.test(tx.note || "");
  if (isOrder) {
    const tot = Math.abs(Number(tx.amount || 0));
    const linkedJob = (tx.job_id && (S.jobs || []).find(j => j.job_id === tx.job_id)) || null;
    const linkedBid = (tx.job_id && (S.bids || []).find(b => b.job_id === tx.job_id && b.status === "SELECTED")) || null;
    const bidAmt = linkedBid ? Number(linkedBid.bid_amount) : Math.max(0, Number((tot - 0.740).toFixed(3)));
    return {
      bid_amount: bidAmt,
      visit_fee: tot >= bidAmt + 0.590 ? 0.590 : 0.000,
      service_fee: 0.150,
      pro_discount: 0,
      coupon_discount: 0,
      total_paid: tot,
      order_ref: linkedJob ? sid(linkedJob) : "",
      payment_method: tx.payment_method || "FixIt Pay Wallet"
    };
  }
  return null;
}

/* ================= IN-APP CARD & PAYPAL CHECKOUT MODAL (ZERO REDIRECTS) ================= */
function formatInAppCardInput(el) {
  if (!el) return;
  const digits = String(el.value || "").replace(/\D/g, "").slice(0, 16);
  el.value = digits.replace(/(\d{4})(?=\d)/g, "$1 ").trim();
}
function formatInAppExpInput(el) {
  if (!el) return;
  const digits = String(el.value || "").replace(/\D/g, "").slice(0, 4);
  if (digits.length >= 3) el.value = digits.slice(0, 2) + "/" + digits.slice(2);
  else el.value = digits;
}

async function completePaypalAction() {
  const ar = L === "ar";
  const mode = (S.inAppPayMode === "PAYPAL_BALANCE") ? "PAYPAL_BALANCE" : "CARD";
  const ppEm = ((document.getElementById("ppEmailInp") || {}).value || S.profile.paypal_email || S.profile.email || "").trim();
  const cardNumRaw = ((document.getElementById("ppCardNumInp") || {}).value || "").replace(/\D/g, "");
  const cardExp = ((document.getElementById("ppCardExpInp") || {}).value || "").trim();
  const cardCvv = ((document.getElementById("ppCardCvvInp") || {}).value || "").replace(/\D/g, "");
  const cardHolder = (((document.getElementById("ppCardHolderInp") || {}).value || S.profile.full_name || "")).trim().toUpperCase();

  if (mode === "CARD") {
    if (!isValidLuhnCard(cardNumRaw)) {
      toast(ar ? "رقم البطاقة غير صحيح. يرجى التحقق من البطاقة." : "Invalid card number. Please check your card details.");
      return;
    }
    if (!isValidCardExpiryMmYy(cardExp)) {
      toast(ar ? "تاريخ انتهاء البطاقة غير صالح أو منتهي (MM/YY)" : "Please enter a valid non-expired date (MM/YY)");
      return;
    }
    const isAmex = /^3[47]/.test(cardNumRaw);
    if (isAmex ? cardCvv.length !== 4 : cardCvv.length !== 3) {
      toast(ar ? "يرجى إدخال رمز الأمان CVV الصحيح" : "Please enter a valid CVV security code");
      return;
    }
    if (cardHolder.length < 2) {
      toast(ar ? "يرجى إدخال اسم حامل البطاقة" : "Please enter the cardholder name");
      return;
    }
    const last4 = cardNumRaw.slice(-4);
    const brand = cardNumRaw.startsWith("4") ? "VISA" : /^5[1-5]/.test(cardNumRaw) || /^2[2-7]/.test(cardNumRaw) ? "MASTERCARD" : isAmex ? "AMEX" : "OMANNET";
    const parts = cardExp.split("/");
    const exp_month = Math.min(12, Math.max(1, parseInt(parts[0], 10) || 12));
    const rawYr = parseInt(parts[1], 10) || 28;
    const exp_year = rawYr < 100 ? 2000 + rawYr : rawYr;
    if (!Array.isArray(S.cards)) S.cards = [];
    S.cards.forEach(c => { c.is_default = false; });
    const existing = S.cards.find(c => c.last4 === last4);
    if (existing) {
      existing.is_default = true;
      existing.brand = brand;
      existing.cardNumber = cardNumRaw;
      existing.cvv = cardCvv;
      existing.exp_month = exp_month;
      existing.exp_year = exp_year;
      existing.holder_name = cardHolder;
    } else {
      S.cards.unshift({ pm_id: "pm-" + Date.now(), user_id: ME, brand, last4, cardNumber: cardNumRaw, cvv: cardCvv, exp_month, exp_year, holder_name: cardHolder, is_default: true });
    }
    save("cards", S.cards);
  } else {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ppEm)) {
      toast(ar ? "يرجى إدخال بريد إلكتروني صحيح لحساب PayPal" : "Please enter a valid PayPal email address");
      return;
    }
    if (S.paypalPurpose === "TOPUP" || S.paypalPurpose === "ORDER_CHECKOUT" || S.paypalPurpose === "PRO_SUB") {
      toast(ar ? "يرجى اختيار البطاقة البنكية لإتمام الدفع المباشر" : "Please select Debit / Credit Card to complete payment");
      S.inAppPayMode = "CARD";
      render();
      return;
    }
    S.profile.paypal_email = ppEm;
    save("profile", S.profile);
  }

  S.inAppCardDraft = {
    mode,
    cardNumber: cardNumRaw,
    cardExpiry: cardExp,
    cardCvv,
    cardHolder,
    paypalEmail: ppEm
  };

  try {
    if (S.paypalPurpose === "ORDER_CHECKOUT") {
      S.sheet = null;
      render();
      await confirmBidPayment();
      return;
    }
    if (S.paypalPurpose === "PRO_SUB") {
      toast(ar ? "جاري تفعيل الاشتراك..." : "Processing subscription...");
      const ppOrd = await createRealPayPalOrder(1.980, "FixIt Pro Monthly Subscription", "SUB-" + Date.now(), S.inAppCardDraft);
      S.profile.isProMember = true;
      if (S.draft) S.draft.useProPlan = true;
      save("profile", S.profile);
      const wid = (S.wallet && S.wallet.wallet_id) || "933349f2-c1f0-4a8e-9b7a-111111111111";
      const curBal = Number((S.wallet && S.wallet.balance) || 0);
      try {
        const dbRes = await sb("/wallet_transactions", "POST", {
          wallet_id: wid,
          user_id: ME,
          amount: -1.980,
          balance_after: curBal,
          kind: "SUBSCRIPTION",
          external_ref: (ppOrd && ppOrd.id) ? ppOrd.id : null,
          note: "FixIt Pro Monthly"
        });
        if (Array.isArray(dbRes) && dbRes[0]) S.txns.unshift({ ...dbRes[0], paypal_order_id: ppOrd && ppOrd.id, status: "ACTIVE" });
      } catch (e) {}
      save("txns", S.txns);
      S.sheet = null;
      render();
      toast(ar ? "✓ تم تفعيل اشتراك FixIt Pro" : "✓ FixIt Pro subscription active");
      return;
    }
    if (S.paypalPurpose === "TOPUP") {
      const topAmt = Number(S.topupAmtDraft || 10);
      toast(ar ? "جاري معالجة الدفع..." : "Processing payment...");
      const ppOrd = await createRealPayPalOrder(topAmt, "FixIt Wallet Top-Up", "TOPUP-" + Date.now(), S.inAppCardDraft);
      S.sheet = null;
      await depositFunds(topAmt, ppOrd);
      return;
    }
    await createRealPayPalOrder(0.000, "FixIt Payment Method Verification", "CONNECT-" + Date.now(), S.inAppCardDraft);
    S.sheet = null;
    render();
    toast(ar ? "✓ تم حفظ طريقة الدفع" : "✓ Payment method saved");
  } catch (err) {
    toast((err && err.message) || (ar ? "تعذر إتمام الدفع" : "Payment could not be completed"));
  }
}

function selectSavedInAppCard(pmId) {

      cardCvv: card.cvv || "",
      cardHolder: card.holder_name || S.profile.full_name || ""
    };
  }
  render();
}

function exportUserDataJSON() {
  const payload = {
    exported_at: new Date().toISOString(),
    platform: "FixIt Marketplace (fixit-now.xyz)",
    user_id: ME,
    profile: S.profile,
    addresses: S.addresses,
    orders_count: (S.jobs || []).length,
    wallet: S.wallet,
    transactions: S.txns,
    consents: {
      cookie_consent: S.cookieConsent || "ESSENTIAL_ONLY",
      age_18_verified: S.profile.ageVerified18 !== false,
      marketing_opt_in: Boolean(S.profile.optInOffers),
      newsletter_opt_in: Boolean(S.profile.optInNewsletter),
      trial_reminder_enabled: S.profile.trialReminder !== false
    }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `FixIt_MyData_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {} }, 500);
  toast(L === "ar" ? "تم تحميل نسخة كاملة من بياناتك بصيغة JSON" : "Your personal data export (JSON) has been downloaded!");
}

// SCREENSHOT 2: Exact Talabat "Account info" Page (Clean, no 'Change profile picture' text!)
function saveAccountInfoPage() {
  const ar = L === "ar";
  const fn = ((document.getElementById("ai_first") || {}).value || "").trim();
  const ln = ((document.getElementById("ai_last") || {}).value || "").trim();
  const fullName = (fn + " " + ln).trim();
  if (fullName.length < 2) {
    toast(ar ? "يرجى إدخال اسمك الكامل" : "Please enter your full name");
    return;
  }
  const em = ((document.getElementById("ai_email") || {}).value || S.profile.email || "").trim();
  if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) {
    toast(ar ? "يرجى إدخال بريد إلكتروني صحيح" : "Please enter a valid email address");
    return;
  }
  const dob = ((document.getElementById("ai_dob") || {}).value || "").trim();
  S.profile.full_name = fullName;
  S.profile.email = em;
  S.profile.dob = dob;
  save("profile", S.profile);
  render();

  apiCall("/api/auth/profile/complete", {
    method: "POST",
    body: {
      firstName: fn,
      lastName: ln,
      fullName,
      email: em,
      dob,
      gender: S.profile.gender || "",
      avatarUrl: S.profile.avatar || "",
      customAvatar: Boolean(S.profile.customAvatar),
      preferredLanguage: L
    }
  }).then(r => {
    if (r && r.ok) {
      toast(ar ? "✓ تم حفظ معلومات الحساب" : "✓ Account info saved");
    } else {
      enqueueBgTask("/users?user_id=eq." + encodeURIComponent(ME), "PATCH", { full_name: fullName, email: em || undefined, preferred_language: L, updated_at: new Date().toISOString() });
      toast(ar ? "تم الحفظ محلياً وسيتم المزامنة عند الاتصال" : "Saved locally · will sync when back online");
    }
  }).catch(() => {
    enqueueBgTask("/users?user_id=eq." + encodeURIComponent(ME), "PATCH", { full_name: fullName, email: em || undefined, preferred_language: L, updated_at: new Date().toISOString() });
    toast(ar ? "تم الحفظ محلياً وسيتم المزامنة عند الاتصال" : "Saved locally · will sync when back online");
  });
}

function confirmCancelProSubscription() {
  const ar = L === "ar";

  const reason = S.cancelSubReason || "Other";
  const stars = Number(S.cancelSubStars || 4);
  if (!comment && stars <= 2) {

    return;

  S.profile.isProMember = false;
  S.profile.proCancelledAt = new Date().toISOString();
  S.profile.proCancelFeedback = { stars, reason, comment, date: new Date().toISOString() };
  save("profile", S.profile);
  if (S.draft) S.draft.useProPlan = false;
  (S.txns || []).forEach(tx => {

function useCurrentGpsLocation() {
  const ar = L === "ar";
  toast(ar ? "📡 جاري تحديد موقعك الحالي..." : "📡 Getting your current location...");
  getRealDeviceGps((lat, lng) => {

    const area = salalahAreaName(lat, lng);
    const curAddr = {
      address_id: "a-gps",
      user_id: ME,
      label: ar ? "موقعي الحالي" : "Current Location",
      area,
      details: area,
      address_line: area,
      is_default: true,
      lat, lng,
      geom: toEWKB(lat, lng),
      userEdited: true
    };
    S.addresses.forEach(a => { a.is_default = false; });
    S.addresses = S.addresses.filter(a => a.address_id !== "a-gps");

function initMiniPreviewMap(containerId, lat, lng) {
  const Lf = window.L || Leaf;
  if (!Lf || !Lf.map) return;
  const el = document.getElementById(containerId);
  if (!el) return;
  if (activeMapInstances[containerId] && activeMapInstances[containerId].el === el) return;
  if (activeMapInstances[containerId] && activeMapInstances[containerId].map) {
    try { activeMapInstances[containerId].map.remove(); } catch(e) {}
  }
  try {
    const map = Lf.map(containerId, { center: [lat, lng], zoom: 16, zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false });
    Lf.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", { maxZoom: 19 }).addTo(map);
    const pinIcon = Lf.divIcon({
      className: "tlbt-mini-pin",
      html: `<svg viewBox="0 0 36 44" style="width:34px;height:42px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))"><path d="M18 2C9.7 2 3 8.7 3 17c0 10.5 15 24 15 24s15-13.5 15-24c0-8.3-6.7-15-15-15z" style="fill:#FF5A00!important;stroke:#fff;stroke-width:2"/><circle cx="18" cy="16" r="5" style="fill:#fff!important"/></svg>`,
      iconSize: [34, 42],
      iconAnchor: [17, 40]
    });
    Lf.marker([lat, lng], { icon: pinIcon }).addTo(map);
    activeMapInstances[containerId] = { map, el };
    setTimeout(() => { map.invalidateSize(); }, 150);
  } catch (e) {}
}

async function saveTalabatAddressForm() {
  const d = S.addrDraft || {};
  const bldg = (document.getElementById("f_bldg") || {}).value || "";
  const apt = (document.getElementById("f_apt") || {}).value || "";
  const flr = (document.getElementById("f_flr") || {}).value || "";
  const str = (document.getElementById("f_str") || {}).value || "";
  const blk = (document.getElementById("f_blk") || {}).value || "";
  const way = (document.getElementById("f_way") || {}).value || "";
  const ph = (document.getElementById("f_phone") || {}).value || getMyPhone();
  const dir = (document.getElementById("f_dir") || {}).value || "";
  const lbl = (document.getElementById("f_lbl") || {}).value || d.type || "Apartment";
  const area = d.area || salalahAreaName(d.lat || 17.015, d.lng || 54.092);
  const fullLine = [bldg, apt, flr, str, blk, area].filter(Boolean).join(", ") || area;

  const newAddr = {
    address_id: d.editId || ("a-" + Date.now()),
    user_id: ME,
    label: lbl.trim(),
    type: d.type || "Apartment",
    area,
    details: fullLine,
    address_line: fullLine,
    building: bldg.trim() || "1",
    apt: apt.trim(),
    floor: flr.trim() || "1",
    street: str.trim(),
    block: blk.trim(),
    way: way.trim(),
    directions: dir.trim(),
    phone: ph.trim(),
    is_default: true,
    lat: d.lat || 17.0150,
    lng: d.lng || 54.0924,
    geom: toEWKB(d.lat || 17.0150, d.lng || 54.0924),
    userEdited: true
  };

  S.addresses.forEach(a => { a.is_default = false; });
  if (d.editId) {
    const idx = S.addresses.findIndex(a => a.address_id === d.editId);
    if (idx !== -1) S.addresses[idx] = newAddr;
    else S.addresses.unshift(newAddr);
  } else {
    S.addresses.unshift(newAddr);
  }
  save("addresses", S.addresses);
  if (S.draft) S.draft.address_id = newAddr.address_id;

  // Pop addr_form and addr_map from stack
  while (S.stack.length && (S.stack[S.stack.length - 1] === "addr_form" || S.stack[S.stack.length - 1] === "addr_map")) {
    S.stack.pop();
  }
  render();
  toast(L === "ar" ? "✓ تم حفظ العنوان بنجاح" : "✓ Address saved");
  try {
    await sb(`/user_addresses?user_id=eq.${ME}`, "PATCH", { is_default: false });
    if (d.editId && !String(d.editId).startsWith("addr-")) {
      await sb(`/user_addresses?address_id=eq.${d.editId}`, "PATCH", { label: newAddr.label, details: newAddr.details, building: newAddr.building, floor: newAddr.floor, is_default: true, geom: newAddr.geom });
    } else {
      await sb("/user_addresses", "POST", { user_id: ME, label: newAddr.label, details: newAddr.details, building: newAddr.building, floor: newAddr.floor, is_default: true, geom: newAddr.geom });
    }
    sync();
  } catch (e) {}
}

  const uniq = allCoupons.filter(c => { if (!c || !c.code || seenCodes.has(c.code)) return false; seenCodes.add(c.code); return true; });
  const now = Date.now();
  const categorized = uniq.map(c => {
    const val = Number(c.discount_value ?? c.discount_pct ?? 15);
    const expDate = c.expires_at ? new Date(c.expires_at) : new Date(now + 180 * 86400000);
    const isExp = expDate.getTime() < now || c.is_active === false;
    const isUsed = (S.usedCoupons || []).includes(c.code);
    const state = isUsed ? "USED" : isExp ? "EXPIRED" : "UNUSED";
    const expStr = expDate.toLocaleDateString(ar ? "ar-OM" : "en-GB", { day: "2-digit", month: "short", year: "numeric" });
    return { ...c, val, state, expStr };
  });
  const list = categorized.filter(c => c.state === (S.cpnTab || "UNUSED"));

  return `${bar(t("coupons"), true)}<div class="pad">
    <div class="card row" style="padding:8px 8px 8px 14px">
      <input id="codeInp" class="sp" style="height:44px;font-size:15px;font-weight:700;text-transform:uppercase" placeholder="${ar ? "أدخل رمز القسيمة (مثال: SALALAH25)" : "Enter voucher code (e.g. SALALAH25)"}">

    </div>

    <div class="seg3">
      <button class="${S.cpnTab === "UNUSED" ? "on" : ""}" onclick="S.cpnTab='UNUSED';render()">${ar ? "المتاحة" : "Available"} (${categorized.filter(x => x.state === "UNUSED").length})</button>
      <button class="${S.cpnTab === "USED" ? "on" : ""}" onclick="S.cpnTab='USED';render()">${ar ? "المستخدمة" : "Used"} (${categorized.filter(x => x.state === "USED").length})</button>
      <button class="${S.cpnTab === "EXPIRED" ? "on" : ""}" onclick="S.cpnTab='EXPIRED';render()">${ar ? "المنتهية" : "Expired"} (${categorized.filter(x => x.state === "EXPIRED").length})</button>
    </div>

    ${list.length ? list.map(c => `<div class="cpn" style="opacity:${c.state === "UNUSED" ? "1" : "0.6"}">
      <div class="l" style="${c.state !== "UNUSED" ? "background:#E5E7EB;color:#6B7280" : ""}">
        <b>${c.val}%</b>
        <span style="font-size:11px;font-weight:800">${ar ? "خصم" : "OFF"}</span>
      </div>
      <div class="r">
        <div class="sp">
          <div class="row" style="gap:6px">
            <span class="code">${esc(c.code)}</span>
            ${S.appliedCoupon === c.code ? `<span class="pill ok" style="font-size:10px">${ar ? "مفعل ✓" : "Applied ✓"}</span>` : ""}
          </div>
          <div class="t1" style="font-size:14px;margin-top:4px">${ar ? `خصم ${c.val}% على جميع خدمات الصيانة` : `${c.val}% off any home repair service`}</div>
          <div class="t2" style="font-size:11.5px;margin-top:2px">
            ${c.min_order_omr ? `${ar ? "الحد الأدنى:" : "Min. order:"} ${Number(c.min_order_omr).toFixed(3)} ${t("omr")} · ` : `${ar ? "بدون حد أدنى · " : "No min. order · "}`}
            <span style="color:${c.state === "EXPIRED" ? "var(--rd)" : "var(--mu)"}">${c.state === "EXPIRED" ? (ar ? "انتهت في " : "Expired ") : (ar ? "صالح حتى " : "Expires ")} ${c.expStr}</span>
          </div>
        </div>
        ${c.state === "UNUSED" ? `<button class="pill" style="background:var(--o);color:#fff;padding:7px 14px" onclick="S.appliedCoupon='${esc(c.code)}';toast(t('promoApplied')+' (${esc(c.code)})');render()">${S.appliedCoupon === c.code ? (ar ? "مفعل" : "Active") : (ar ? "استخدام" : "Apply")}</button>` : `<span class="pill" style="background:#F3F3F3;color:var(--mu)">${c.state === "USED" ? (ar ? "مستخدم" : "Used") : (ar ? "منتهي" : "Expired")}</span>`}
      </div>
    </div>`).join("") : empty("tag", ar ? "لا توجد قسائم في هذا القسم" : "No vouchers in this section")}
  </div>`;
}

function startSupportFlow(subject, autoMsg, jobId) {
  S.sheet = null;
  if (jobId) S.supportOrderId = jobId;
  const newT = {
    ticket_id: "t-" + Date.now(),
    user_id: ME,
    subject,
    body: autoMsg,
    status: "OPEN",
    created_at: new Date().toISOString()
  };
  S.tickets.unshift(newT);
  save("tickets", S.tickets);
  S.ticketId = newT.ticket_id;
  sb("/support_tickets", "POST", { ticket_id: newT.ticket_id, user_id: ME, subject: newT.subject, body: newT.body, status: "OPEN" }).catch(() => {});
  go("support_chat", newT.ticket_id);
  setTimeout(() => {
    sendSupportMsg(autoMsg);
  }, 120);
}

function markAllNotifsRead() {
  const now = new Date().toISOString();
  S.allNotifsReadAt = Date.now();
  save("allNotifsReadAt", S.allNotifsReadAt);
  if (!Array.isArray(S.readNotifIds)) S.readNotifIds = [];
  (S.notifs || []).forEach(n => {
    n.read_at = now;
    const key = n.notif_id || n.id || (n.title + "_" + n.created_at);
    if (key && !S.readNotifIds.includes(key)) S.readNotifIds.push(key);
  });
  save("readNotifIds", S.readNotifIds);
  save("notifs", S.notifs);
  render();
  toast(L === "ar" ? "✓ تم تحديد جميع الإشعارات كمقروءة" : "✓ All notifications marked as read");
  sb(`/notifications?user_id=eq.${ME}`, "PATCH", { read_at: now }).catch(() => {});
}

function openNotifItem(idx) {
  const n = S.notifs && S.notifs[idx];
  if (!n) return;
  const now = new Date().toISOString();

}

function triggerSupportBotStep(stepKey) {
  const ar = L === "ar";

  const ordName = `${cat(j.category_id).name} (${sid(j)})`;

  if (stepKey === "PHOTO_REQ") {
    S.supportMsgs.push({ user_id: ME, sender: "USER", content: ar ? "لدي مشكلة في الخدمة / إرفاق صورة للمراجعة" : "I have an issue with the service / Attach photo for review", created_at: new Date().toISOString() });
    S.supportMsgs.push({
      user_id: ME,
      sender: "AGENT",
      botStep: "WAIT_PHOTO",
      content: ar
        ? `نأسف لسماع ذلك بخصوص طلب ${ordName}. يرجى التقاط صورة واضحة للمشكلة عبر زر الكاميرا بالأسفل ليقوم فريق مراجعة الطلبات (WhatsApp: +968 9595 6361) بالتحقق منها:`
        : `We're sorry to hear that regarding ${ordName}. Please attach a photo of the issue using the camera button below so our Admin Claims team (WhatsApp: +968 9595 6361) can inspect and verify it:`,
      created_at: new Date().toISOString()
    });
    save("supportMsgs", S.supportMsgs);
    render();
    sendSupportPhoto();
    return;
  }
  if (stepKey === "SUBMIT_REFUND_CLAIM") {
    const claimTicket = {
      ticket_id: "t-claim-" + Date.now(),
      user_id: ME,
      subject: `Refund Review Request (${ordName})`,
      body: `Customer requested wallet refund review for ${ordName}. Pending Admin verification.`,
      status: "OPEN",
      created_at: new Date().toISOString()
    };

    save("tickets", S.tickets);
    sb("/support_tickets", "POST", claimTicket).catch(() => {});
    S.supportMsgs.push({ user_id: ME, sender: "USER", content: ar ? "تقديم طلب استرداد للمراجعة من الإدارة" : "Submit refund request for Admin review", created_at: new Date().toISOString() });
    S.supportMsgs.push({
      user_id: ME,
      sender: "AGENT",
      botStep: "RATE",
      content: ar
        ? `تم تسجيل طلب المراجعة رقم ${claimTicket.ticket_id.slice(-5)} وإحالته إلى مشرف العمليات (WhatsApp: +968 9595 6361). سيتم التحقق من صور التوثيق (قبل وبعد) وإشعارك فور اعتماد المبلغ.`
        : `Claim #${claimTicket.ticket_id.slice(-5)} has been logged with our Operations Admin (WhatsApp: +968 9595 6361). Our team will verify the job photos and process your refund once approved.`,
      created_at: new Date().toISOString()
    });
    save("supportMsgs", S.supportMsgs);
    render();
    setTimeout(() => { const c = document.getElementById("supportChat"); if (c) c.scrollTop = c.scrollHeight; }, 40);
    return;
  }
  if (stepKey === "FREE_REVISIT") {
    S.supportMsgs.push({ user_id: ME, sender: "USER", content: ar ? "طلب زيارة ضمان 14 يوماً" : "Request 14-day warranty revisit", created_at: new Date().toISOString() });

    render();

  }

async function sendSupportMsg(presetText) {
  const inp = document.getElementById("supportInp");
  const txt = (presetText || (inp ? inp.value : "")).trim();
  if (!txt) return;
  if (inp && !presetText) inp.value = "";
  const tkt = S.tickets.find(x => x.ticket_id === S.ticketId) || {};
  const senderRole = ROLE === "admin" ? "AGENT" : "USER";
  const targetUser = ROLE === "admin" ? (tkt.user_id || ME) : ME;
  const newMsg = {
    user_id: targetUser,
    sender: senderRole,
    content: (ROLE === "admin" ? "[FixIt Admin]: " : "") + txt,
    created_at: new Date().toISOString()
  };
  if (!S.supportMsgs) S.supportMsgs = [];
  S.supportMsgs.push(newMsg);
  save("supportMsgs", S.supportMsgs);
  render();
  setTimeout(() => { const c = document.getElementById("supportChat"); if (c) c.scrollTop = c.scrollHeight; }, 30);

  if (ROLE !== "admin") {
    const ar = L === "ar";
    const j = (S.supportOrderId && S.jobs.find(x => x.job_id === S.supportOrderId)) || myJobs()[0] || S.jobs[0];
    const ordRef = j ? `${cat(j.category_id).name} (${sid(j)})` : (ar ? "طلبك" : "your order");
    setTimeout(() => {
      const botMsg = {
        user_id: ME,
        sender: "AGENT",
        botStep: "AFTER_PHOTO",
        content: ar
          ? `تم استلام رسالتك بخصوص ${ordRef}. لقد قمنا بمراجعة الطلب — يمكنك اختيار الحل الفوري المناسب لك بالأسفل أو إرفاق صورة للمشكلة:`
          : `We checked ${ordRef} for you right away. Please choose your preferred instant resolution below, or attach a photo with the camera button:`,
        created_at: new Date().toISOString()
      };
      S.supportMsgs.push(botMsg);
      save("supportMsgs", S.supportMsgs);
      render();
      setTimeout(() => { const c = document.getElementById("supportChat"); if (c) c.scrollTop = c.scrollHeight; }, 30);
      sb("/support_messages", "POST", botMsg).catch(() => {});
    }, 700);
  }
  try { await sb("/support_messages", "POST", newMsg); } catch (e) {}
}

function calcVendorNetPayoutOmr(bidOmr) {
  const amt = Math.max(0, Number(bidOmr || 0));
  const doneCount = myJobs().filter(j => j.status === "COMPLETED").length;
  const feePct = doneCount < 3 ? 0.01 : doneCount < 10 ? 0.05 : doneCount < 25 ? 0.10 : 0.15;
  const feeOmr = Number((amt * feePct).toFixed(3));
  const netOmr = Math.max(0, Number((amt - feeOmr).toFixed(3)));
  return { amt, feePct: Math.round(feePct * 100), feeOmr, netOmr };
}

function formatWaPhoneDisplay(raw) {
  const digits = String(raw || "").split("@")[0].split(":")[0].replace(/\D/g, "");
  if (!digits) return "";
  if (digits.startsWith("968") && digits.length >= 11) {
    return `+968 ${digits.slice(3, 7)} ${digits.slice(7, 11)}`;
  }
  return `+${digits}`;
}

function formatWaCodeDisplay(code) {
  const clean = String(code || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  if (clean.length === 8) return `${clean.slice(0, 4)}-${clean.slice(4)}`;
  return String(code || "").trim();
}

function getWaPillMeta(st, ar) {
  if (st.isConnected) return { text: ar ? "● متصل" : "● Connected", bg: "#DCFCE7", fg: "#15803D" };
  if (st.tab === "qr" && st.qrDataUrl) return { text: ar ? "امسح QR" : "Scan QR", bg: "#FEF3C7", fg: "#B45309" };
  if (st.pairingCode) return { text: ar ? "الرمز جاهز" : "Code Ready", bg: "#FEF3C7", fg: "#B45309" };
  if (st.qrDataUrl) return { text: ar ? "امسح QR" : "Scan QR", bg: "#FEF3C7", fg: "#B45309" };
  if (st.busy || st.isConnecting) return { text: ar ? "جاري الاتصال..." : "Connecting...", bg: "#DBEAFE", fg: "#1D4ED8" };
  if (!st.loaded) return { text: ar ? "جاري الفحص..." : "Checking...", bg: "#F1F5F9", fg: "#64748B" };
  if (st.error === "OFFLINE") return { text: ar ? "غير متصل" : "Offline", bg: "#FEE2E2", fg: "#DC2626" };
  return { text: ar ? "غير مرتبط" : "Not Linked", bg: "#FEE2E2", fg: "#DC2626" };
}

function renderWaCard() {
  const root = document.getElementById("waCardRoot");
  if (!root) return;
  const st = window._waState;
  const ar = L === "ar";
  const pillMeta = getWaPillMeta(st, ar);
  const pill = document.getElementById("waStatusPill");
  if (pill) {
    pill.textContent = pillMeta.text;
    pill.style.background = pillMeta.bg;
    pill.style.color = pillMeta.fg;
  }
  if (document.activeElement && document.activeElement.id === "waPhoneInput") return;
  const sig = JSON.stringify([
    st.tab,
    st.isConnected,
    st.isConnecting,
    st.busy,
    st.loaded,
    st.qrDataUrl ? st.qrDataUrl.slice(-32) : "",
    st.pairingCode || "",
    st.phone || "",
    st.me?.id || "",
    st.error || "",
    ar
  ]);
  if (root.dataset.waSig === sig) return;
  root.dataset.waSig = sig;
  root.innerHTML = renderWaCardHtml();
}

function setWaLinkTab(tab) {
  window._waState.tab = tab === "code" ? "code" : "qr";
  window._waState.error = "";
  const root = document.getElementById("waCardRoot");
  if (root) root.dataset.waSig = "";
  renderWaCard();
}

async function copyWaCode(rawCode) {
  const text = String(rawCode || "").trim();
  if (!text) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    toast(L === "ar" ? "تم نسخ الرمز ✓" : "Code copied ✓");
  } catch (_) {
    toast(L === "ar" ? "انسخ الرمز يدوياً" : "Copy code manually");
  }
}

function updateWaUiFromStatus(res) {
  const st = window._waState;
  st.loaded = true;
  if (!res) {
    st.error = "OFFLINE";
    renderWaCard();
    return;
  }
  st.isConnected = Boolean(res.isConnected);
  st.isConnecting = Boolean(res.isConnecting);
  st.qrDataUrl = res.isConnected ? null : (res.qrDataUrl || null);
  st.pairingCode = res.isConnected ? null : (res.pairingCode || null);
  if (res.phone !== undefined) st.phone = res.phone || "";
  if (res.me !== undefined) st.me = res.me || null;
  st.error = res.error ? String(res.error) : "";
  if (st.isConnected && _waPollTimer) {
    clearInterval(_waPollTimer);
    _waPollTimer = null;
  } else if (!st.isConnected && (st.isConnecting || st.qrDataUrl || st.pairingCode) && !_waPollTimer) {
    startWaPoll();
  }
  renderWaCard();
}

async function checkWhatsAppStatus(force = false) {
  const root = document.getElementById("waCardRoot");
  if (!root) return;
  const now = Date.now();
  if (!force && now - _lastWaCheckAt < 1200) return;
  _lastWaCheckAt = now;
  try {
    const res = await apiCall("/api/app/admin/whatsapp-status", { method: "GET", timeoutMs: 12000 });
    updateWaUiFromStatus(res);
  } catch (e) {
    window._waState.loaded = true;
    window._waState.error = "OFFLINE";
    renderWaCard();
  }
}

function startWaPoll() {
  if (_waPollTimer) clearInterval(_waPollTimer);
  let tries = 0;
  _waPollTimer = setInterval(() => {
    tries++;
    if (tries > 45 || !document.getElementById("waCardRoot")) {
      clearInterval(_waPollTimer);
      _waPollTimer = null;
      return;
    }
    checkWhatsAppStatus(true);
  }, 2000);
}

async function requestWhatsAppQr(forceReset = false) {
  const st = window._waState;
  st.tab = "qr";
  st.busy = true;
  st.error = "";
  if (forceReset) st.qrDataUrl = null;
  renderWaCard();
  toast(L === "ar" ? "جاري تحضير رمز QR..." : "Generating QR code...");
  try {
    const res = await apiCall("/api/app/admin/whatsapp-qr", {
      method: "POST",
      body: { reset: Boolean(forceReset) },
      timeoutMs: 25000
    });
    st.busy = false;

async function requestWhatsAppPairCode(forceReset = true) {
  const inp = document.getElementById("waPhoneInput");
  const phone = ((inp ? inp.value : "") || window._waState.phoneInput || S.profile?.phone || "").trim();
  if (!phone) {
    toast(L === "ar" ? "أدخل رقم الهاتف أولاً" : "Enter phone number first");
    return;
  }
  const st = window._waState;
  st.tab = "code";
  st.phoneInput = phone;
  st.busy = true;
  st.error = "";
  if (forceReset) st.pairingCode = null;
  renderWaCard();
  toast(L === "ar" ? "جاري طلب رمز الربط..." : "Requesting pairing code...");
  try {
    const res = await apiCall("/api/app/admin/whatsapp-pair", {
      method: "POST",
      body: { phone, reset: Boolean(forceReset) },
      timeoutMs: 25000
    });
    st.busy = false;
    updateWaUiFromStatus(res);
    if (res && res.ok && res.isConnected) {
      toast(L === "ar" ? "واتساب متصل بالفعل ✓" : "WhatsApp already connected ✓");
    } else if (res && res.ok && res.pairingCode) {
      toast(L === "ar" ? `تم استلام الرمز: ${formatWaCodeDisplay(res.pairingCode)}` : `Pairing code: ${formatWaCodeDisplay(res.pairingCode)}`);
      startWaPoll();

      toast(L === "ar" ? "جاري توليد رمز الربط..." : "Generating pairing code...");
      startWaPoll();
    } else {
      toast((res && res.error) || "Failed to generate pairing code");
    }
  } catch (err) {
    st.busy = false;
    st.error = (err && err.message) || "Failed to request pairing code";
    renderWaCard();
    toast(st.error);
  }
}

async function disconnectWhatsApp() {
  const st = window._waState;
  st.busy = true;

  try {
    await apiCall("/api/app/admin/whatsapp-disconnect", { method: "POST", body: {}, timeoutMs: 15000 });

}

function checkAppControlStatus() {
  fetch(`https://fixit-now.xyz/api/app/status?role=${encodeURIComponent(ROLE || "consumer")}`)
    .then(r => r.json())
    .then(d => {
      if (!d || !d.ok) return;
      S.appControl = d;
      if (d.otaBundleHash && typeof window !== "undefined") {
        const lastOtaHash = localStorage.getItem("fx3_ota_hash_" + ROLE) || "";
        if (lastOtaHash !== d.otaBundleHash) {
          localStorage.setItem("fx3_ota_hash_" + ROLE, d.otaBundleHash);
          if (window.FixItNative && typeof window.FixItNative.checkAndApplyOtaUpdate === "function") {
            try { window.FixItNative.checkAndApplyOtaUpdate(ROLE || "consumer"); } catch (e) {}
          }
        }
      }
      if (d.maintenance && d.maintenanceUntil && !_appControlTimer) {
        _appControlTimer = setInterval(() => {
          if (!S.appControl || !S.appControl.maintenance) {
            clearInterval(_appControlTimer);
            _appControlTimer = null;
            return;
          }
          const el = document.getElementById("fx-maint-cd");
          if (el && S.appControl.maintenanceUntil) {
            const rem = Math.max(0, Math.floor((Date.parse(S.appControl.maintenanceUntil) - Date.now()) / 1000));
            const h = String(Math.floor(rem / 3600)).padStart(2, "0");
            const m = String(Math.floor((rem % 3600) / 60)).padStart(2, "0");
            const s = String(rem % 60).padStart(2, "0");
            el.textContent = `${h}:${m}:${s}`;
            if (rem === 0) checkAppControlStatus();
          }
        }, 1000);
      }
      render();
    })
    .catch(() => {});
}

  if (ROLE !== "admin" && ((s && adScreens.has(s)) || (!s && adTabs.has(S.tab)))) {
    html += aadsSlotHtml();
  }
  return html;
}
// Update existing Leaflet map markers & polyline in-place without recreating the map!
function updateTalabatMapInPlace(containerId, jobId) {
  const inst = activeMapInstances && activeMapInstances[containerId];
  if (!inst || !inst.map) return;
  const j = (jobId && S.jobs.find(x => x.job_id === jobId)) || S.jobs[0];
  if (!j) return;
  const destCoord = getJobCoords(j);
  const proCoord = getAssignedProCoords(j, destCoord);
  try {
    if (inst.destMarker) inst.destMarker.setLatLng(destCoord);
    if (proCoord && inst.proMarker) inst.proMarker.setLatLng(proCoord);
  } catch (e) {}
}

  const pendingQueueCount = Array.isArray(S.bgQueue) ? S.bgQueue.length : 0;
