<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FF5A00" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="FixIt" />
<script src="qrcode.js"></script>
<title>FixIt</title>
<style>
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-Normal.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-DemiBold.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-Bold.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-ExtraBold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'TT Commons Pro';src:url('fonts/TTCommonsPro-Black.otf') format('opentype');font-weight:900;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-SemiBold.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Bold.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-ExtraBold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url('fonts/NotoSansArabic-Black.otf') format('opentype');font-weight:900;font-display:swap}

:root{--o:#FF5A00;--o2:#FFF1E8;--o3:#FFE2CF;--od:#E04E00;--lime:#CFFF00;--plum:#4A0D10;
--bg:#F5F5F5;--card:#fff;--tx:#1A1A1A;--mu:#6B6B6B;--mu2:#9A9A9A;--ln:#EDEDED;
--gr:#00A862;--gr2:#E6F7EF;--rd:#E5242B;--rd2:#FDECEC;--am:#F2A100;--am2:#FFF6E0;--hud:#1A1A1A;
--r:16px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0,'calt' 0}
html,body{background:var(--bg);color:var(--tx);font-family:'TT Commons Pro','Noto Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.35;
-webkit-user-select:none;user-select:none;overscroll-behavior-x:none;touch-action:pan-y;-webkit-font-smoothing:antialiased}
body{padding-bottom:84px}
button,input,textarea,select,a{font:inherit;color:inherit;border:0!important;outline:0;background:none;-webkit-appearance:none;appearance:none;text-decoration:none}
button{cursor:pointer;padding:0;box-shadow:none}
input,textarea{-webkit-user-select:text;user-select:text}
svg{width:22px;height:22px;fill:none!important;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
svg *{fill:none!important}
[dir=rtl] .flip{transform:scaleX(-1)}
#app{max-width:520px;margin:0 auto;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,168,98,.6)}100%{box-shadow:0 0 0 10px rgba(0,168,98,0)}}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- header ---------- */
.talabat-top-bar{position:sticky;top:0;z-index:50;background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ln)}
.hdr-home{background:var(--o);color:#fff;border:0;padding:14px 16px 12px}
.hdr-home .talabat-loc-label{color:rgba(255,255,255,.85)}
.hdr-home .talabat-loc-addr{color:#fff}
.hdr-home .talabat-circle-btn{background:rgba(255,255,255,.18);color:#fff}
.talabat-back-btn,.talabat-circle-btn,.ib{width:40px;height:40px;border-radius:50%;background:#F3F3F3;display:grid;place-items:center;position:relative;color:var(--tx);flex-shrink:0;transition:transform .12s}
.talabat-back-btn:active,.talabat-circle-btn:active,.ib:active{transform:scale(.9)}
.talabat-circle-btn svg,.ib svg,.talabat-back-btn svg{width:20px;height:20px}
.talabat-loc-picker{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.talabat-loc-icon svg{width:22px;height:22px}
.talabat-loc-label{font-size:12px;font-weight:600;color:var(--mu)}
.talabat-loc-addr{font-size:16px;font-weight:800;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:10px;object-fit:cover}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.hero-search{background:var(--o);padding:0 16px 18px;border-radius:0 0 24px 24px}

/* ---------- search ---------- */
.talabat-search,.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:12px;background:#fff;color:var(--mu);box-shadow:var(--sh);width:100%}
.search{background:#F3F3F3;box-shadow:none}
.talabat-search input,.search input{flex:1;min-width:0;height:100%;font-size:15px;color:var(--tx);background:transparent}
.talabat-search input::placeholder,.search input::placeholder{color:var(--mu2)}
input.search{color:var(--tx)}

/* ---------- layout ---------- */
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{font-weight:700;font-size:16px;color:var(--tx);letter-spacing:-.2px}
.t2{color:var(--mu);font-size:13px;font-weight:400}
.big{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.05}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.sec{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.sec h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.sec a,.sec span{font-size:14px;font-weight:700;color:var(--o)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card-hero{background:linear-gradient(135deg,var(--o),#FF7A2E);color:#fff}
.ico{width:44px;height:44px;border-radius:12px;background:var(--o2);color:var(--o);display:grid;place-items:center;flex-shrink:0}
.ico svg{width:22px;height:22px}
.li{display:flex;align-items:center;gap:14px;width:100%;padding:15px 0;border-bottom:1px solid var(--ln)!important;text-align:start}
.li:last-child{border-bottom:0!important}
.li>svg{color:var(--mu)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px;color:var(--mu2);text-align:center}
.empty svg{width:56px;height:56px;stroke-width:1.4;color:var(--o);background:var(--o2);padding:14px;border-radius:50%;box-sizing:content-box}

/* ---------- categories (talabat verticals) ---------- */
.talabat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.talabat-cat-card{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s var(--ease)}
.talabat-cat-card:active{transform:scale(.92)}
.talabat-cat-icon{width:100%;aspect-ratio:1;border-radius:16px;background:#fff;color:var(--o);display:grid;place-items:center;box-shadow:var(--sh)}
.talabat-cat-icon svg{width:30px;height:30px;stroke-width:1.8}
.talabat-cat-label{font-size:13px;font-weight:600;color:var(--tx);text-align:center;line-height:1.15}
.cat-big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-big button{position:relative;height:120px;border-radius:18px;padding:14px;text-align:start;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.cat-big button:active{transform:scale(.97)}
.cat-big b{font-size:20px;font-weight:800;letter-spacing:-.3px}
.cat-big small{font-size:12px;opacity:.9;font-weight:600}
.cat-big svg{position:absolute;right:-8px;bottom:-8px;width:84px;height:84px;stroke-width:1.4;opacity:.35}
[dir=rtl] .cat-big svg{right:auto;left:-8px}

/* ---------- promo carousel ---------- */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.promo{flex:0 0 86%;scroll-snap-align:start;height:150px;border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.promo h3{font-size:24px;font-weight:900;line-height:1.05;letter-spacing:-.6px;max-width:70%}
.promo p{font-size:13px;opacity:.9;max-width:70%}
.promo .cta{align-self:flex-start;background:#fff;color:var(--tx);font-weight:800;font-size:13px;padding:8px 14px;border-radius:99px}
.promo svg{position:absolute;right:-14px;bottom:-14px;width:130px;height:130px;stroke-width:1.2;opacity:.25}
.promo.lime{background:var(--lime);color:var(--plum)}
.promo.lime .cta{background:var(--plum);color:#fff}
.svc{flex:0 0 160px;scroll-snap-align:start;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh);text-align:start}
.svc .im{height:92px;display:grid;place-items:center;color:#fff}
.svc .im svg{width:44px;height:44px;stroke-width:1.5}
.svc .bd{padding:10px 12px 12px}
.svc .bd b{display:block;font-size:15px;font-weight:700}
.svc .bd span{font-size:12px;color:var(--mu)}
.svc .tagl{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:var(--plum);background:var(--lime);padding:2px 8px;border-radius:6px}

/* ---------- live order HUD ---------- */
.live{background:var(--hud);color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--gr);animation:pulse 1.4s infinite}
.live .ring{width:48px;height:48px;border-radius:50%;background:var(--o);display:grid;place-items:center;flex-shrink:0}
.live .ring svg{width:24px;height:24px}

/* ---------- buttons ---------- */
.btn{height:52px;width:100%;border-radius:12px;background:var(--o);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),background .15s}
.btn:active{transform:scale(.97);background:var(--od)}
.btn svg{width:20px;height:20px;stroke-width:2.4}
.btn.s{height:44px;font-size:14px;border-radius:10px}
.btn.g{background:var(--o2);color:var(--o)}
.btn.outline{background:#fff;color:var(--tx);border:1.5px solid var(--ln)!important}
.btn.ok{background:var(--gr)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--o2);color:var(--o);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--gr2);color:var(--gr)}
.pill.am{background:var(--am2);color:#B87700}
.pill.no{background:var(--rd2);color:var(--rd)}
.pill.lime{background:var(--lime);color:var(--plum)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rd);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;border:2px solid #fff!important}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 16px;border-radius:99px;background:#fff;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--ln)!important;transition:all .15s}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)!important}
.tog{width:50px;height:30px;border-radius:15px;background:#D6D6D6;position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.tog.on{background:var(--gr)}.tog.on::after{transform:translateX(20px)}
.stars{display:flex;justify-content:center;gap:6px;margin-top:10px}
.stars button{font-size:34px;color:#DADADA;transition:transform .1s}
.stars button.on{color:#FFB800}.stars button:active{transform:scale(1.25)}

/* ---------- order card ---------- */
.oc{background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .12s}
.oc:active{transform:scale(.985)}
.oc .top{display:flex;gap:12px;padding:14px 14px 12px;align-items:center}
.oc .thumb{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.oc .thumb svg{width:28px;height:28px}
.oc .desc{font-size:13px;color:var(--mu);margin-top:2px}
.oc .foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--ln)}
.oc .foot .pr{font-weight:800;font-size:15px}
.oc .act{height:34px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:#F3F3F3}
.oc .act.o{background:var(--o);color:#fff}
.oc .act svg{width:16px;height:16px}

/* ---------- steps ---------- */
.steps{display:flex;position:relative}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mu2);position:relative}
.st::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--ln);z-index:0}
.st:first-child::before{display:none}
.st.on{color:var(--tx)}.st.on::before{background:var(--o)}
.st i{width:36px;height:36px;border-radius:50%;background:#F0F0F0;display:grid;place-items:center;z-index:1;color:var(--mu2)}
.st.on i{background:var(--o);color:#fff}
.st i svg{width:16px;height:16px;stroke-width:2.6}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:99;background:#fff;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--ln),0 -6px 20px rgba(0,0,0,.04);max-width:520px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu2);position:relative;min-height:52px;justify-content:center;background:transparent!important}
.nav button svg{width:24px;height:24px;stroke-width:1.8;transition:transform .2s var(--ease)}
.nav button.on{color:var(--o);font-weight:800}
.nav button.on svg{stroke-width:2.4;transform:translateY(-1px)}
.nav button.on::before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--o)}
.nav .badge{position:absolute;top:2px;inset-inline-start:54%}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;animation:fade .2s}
.sheet>div{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;animation:up .3s var(--ease)}
.grab{width:40px;height:4px;border-radius:2px;background:#DDD;align-self:center;margin-bottom:4px}
textarea{width:100%;min-height:100px;padding:14px;border-radius:12px;background:#F3F3F3;font-size:15px;resize:none}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding:4px 0}
.m{max-width:80%;padding:9px 13px;border-radius:18px 18px 18px 4px;font-size:14px;background:#F1F1F1;align-self:flex-start;line-height:1.35}
.m.me{align-self:flex-end;background:var(--o);color:#fff;border-radius:18px 18px 4px 18px}
.m.ad{align-self:center;background:var(--am2);color:#8A5A00;font-size:12px;border-radius:10px}
[dir=rtl] .m{border-radius:18px 18px 4px 18px}[dir=rtl] .m.me{border-radius:18px 18px 18px 4px}
.send{display:flex;gap:8px;align-items:center}
.send input{flex:1;height:46px;padding:0 16px;border-radius:23px;background:#F3F3F3;font-size:15px}
.send button{width:46px;height:46px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center}
.send button svg{width:20px;height:20px}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;background:var(--tx);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s;max-width:90%}
.talabat-map-container{width:100%;background:#E8E8E8}
.web-role-bar{position:sticky;top:0;z-index:200;background:var(--tx);color:#fff;padding:8px 12px;font-size:12px;font-weight:700;justify-content:space-between;align-items:center}
.web-role-btn{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.12);font-size:11px}
.web-role-btn.active{background:var(--o)}
.trust{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.trust::-webkit-scrollbar{display:none}
.trust div{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;box-shadow:var(--sh)}
.trust svg{width:18px;height:18px;color:var(--gr)}

/* ===== v4 page system ===== */
.ph{background:var(--o);color:#fff;padding:18px 16px 26px;border-radius:0 0 26px 26px}
.ph h1{font-size:28px;font-weight:900;letter-spacing:-.8px}
.ph p{opacity:.9;font-size:14px;margin-top:2px}
.lift{margin-top:-18px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0}
.av.lg{width:72px;height:72px;font-size:28px;border:3px solid rgba(255,255,255,.5)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700}
.qa i{width:52px;height:52px;border-radius:50%;background:var(--o2);color:var(--o);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:16px;box-shadow:var(--sh)}
.stats div{padding:14px 8px;text-align:center;border-inline-end:1px solid var(--ln)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:20px;font-weight:900}
.stats span{font-size:12px;color:var(--mu)}
.mh{font-size:13px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:6px 4px -4px}
.wcard{background:linear-gradient(135deg,#4A0D10,#2A0608);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden}
.wcard::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,90,0,.35)}
.wcard .lk{display:inline-flex;align-items:center;gap:6px;background:rgba(207,255,0,.15);color:var(--lime);padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-top:12px}
.wcard .lk svg{width:14px;height:14px}
.amt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amt button{height:56px;border-radius:12px;background:#F3F3F3;font-size:17px;font-weight:800;transition:all .12s}
.amt button:active{background:var(--o);color:#fff;transform:scale(.95)}
.when{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.when button{border-radius:14px;padding:12px 6px;background:#F5F5F5;border:2px solid transparent!important;text-align:center;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.when button svg{width:20px;height:20px}
.when button.on{background:var(--o2);border-color:var(--o)!important;color:var(--o)}
.bk-top{margin:-10px -18px 0;padding:22px 18px 18px;color:#fff;border-radius:24px 24px 0 0;position:relative;overflow:hidden}
.bk-top svg.bg{position:absolute;right:-10px;bottom:-16px;width:110px;height:110px;opacity:.25;stroke-width:1.3}
.bk-top h3{font-size:24px;font-weight:900;letter-spacing:-.5px}
.lbl{font-size:15px;font-weight:800}
.sumr{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);padding:4px 0}
.sumr b{color:var(--tx)}
.pro{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:#FAFAFA}

// PostGIS EWKB Point(4326) encoder & decoder
function toEWKB(lat, lng) {
  const buf = new ArrayBuffer(25);
  const view = new DataView(buf);
  view.setUint8(0, 1); // little endian
  view.setUint32(1, 0x20000001, true); // Point + SRID flag
  view.setUint32(5, 4326, true); // WGS84
  view.setFloat64(9, Number(lng || 54.0924), true);
  view.setFloat64(17, Number(lat || 17.0150), true);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
}
function fromEWKB(hex) {
  try {
    if (!hex || typeof hex !== "string" || hex.length < 50) return [17.0150, 54.0924];
    const bytes = new Uint8Array(25);
    for (let i = 0; i < 25; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
    const view = new DataView(bytes.buffer);
    const lng = view.getFloat64(9, true);
    const lat = view.getFloat64(17, true);
    if (lat > 16.5 && lat < 18.0 && lng > 53.5 && lng < 55.0) return [lat, lng];
  } catch (e) {}
  return [17.0150, 54.0924];
}
function salalahAreaName(lat, lng) {
  const ar = L === "ar";
  if (S.userGpsAddress && S.userGps && Math.abs(lat - S.userGps[0]) < 0.003 && Math.abs(lng - S.userGps[1]) < 0.003) {
    return S.userGpsAddress;
  }
  if (lat > 17.04) return ar ? "السعادة، صلالة" : "Al Saada, Salalah";
  if (lng < 54.05) return ar ? "عوقد، صلالة" : "Auqad, Salalah";
  if (lng > 54.12) return ar ? "الدهاريز، صلالة" : "Ad Dahariz, Salalah";
  if (lat < 17.008) return ar ? "الحافة، صلالة" : "Al Haffa, Salalah";
  return ar ? "وسط صلالة" : "Central Salalah";
}

const addrText = a => a ? (a.details || a.address_line || salalahAreaName(a.lat || 17.015, a.lng || 54.0924)) : "";
const addrCoords = a => {

};

  return s.slice(0, maxLen || 1200);
}

function checkRateLimit(actionKey, maxAttempts, windowMs) {
  const now = Date.now();
  const win = windowMs || 900000; // 15 min default
  const max = maxAttempts || 5;
  if (!S.rateLog[actionKey]) S.rateLog[actionKey] = [];
  S.rateLog[actionKey] = S.rateLog[actionKey].filter(ts => now - ts < win);
  if (S.rateLog[actionKey].length >= max) {
    toast(L === "ar" ? "⏳ تم تجاوز الحد المسموح للطلبات، يرجى الانتظار قليلاً" : "⏳ Rate limit reached (max " + max + " attempts). Please wait a moment.");
    return false;
  }
  S.rateLog[actionKey].push(now);
  return true;
}

  if (S.bgQueue.length > 40) S.bgQueue = S.bgQueue.slice(-40);

}

async function flushBgQueue() {
  if (!S.bgQueue || !S.bgQueue.length || window._flushingBg) return;
  window._flushingBg = true;
  try {
    const remaining = [];
    for (const item of S.bgQueue) {
      try {
        await sb(item.path, item.method, item.body);
      } catch (e) {
        item.retries = (item.retries || 0) + 1;
        if (item.retries < 3) remaining.push(item);
      }
    }
    S.bgQueue = remaining;
    save("bgQueue", S.bgQueue);
  } finally {
    window._flushingBg = false;
  }
}

function snapInAppCameraFrame() {
  const vid = document.getElementById("fxLiveCameraVideo");
  const modal = S.cameraModal || {};
  const cb = modal.cb;
  const withStamp = modal.withStamp !== false;

  getRealDeviceGps((lat, lng) => {
    const canvas = document.createElement("canvas");
    let w = 720, h = 540;
    if (vid && vid.videoWidth > 0 && vid.videoHeight > 0) {
      const maxDim = 800;
      w = vid.videoWidth;
      h = vid.videoHeight;
      if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(vid, 0, 0, w, h);
      if (withStamp) burnGpsTimestampOnCanvas(canvas, ctx, w, h, lat, lng);
    } else {
      // High-contrast realistic live diagnostic inspection frame when WebView camera hardware is locked by OS
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#1E293B");
      grad.addColorStop(0.5, "#334155");
      grad.addColorStop(1, "#0F172A");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Draw realistic inspection grid & appliance/service visual
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;
      for (let gx = 40; gx < w; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
      for (let gy = 40; gy < h; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }

      // Appliance / repair unit illustration
      ctx.fillStyle = "#F8FAFC";
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(140, 110, 440, 170, 18); ctx.fill(); }
      else ctx.fillRect(140, 110, 440, 170);
      ctx.fillStyle = "#CBD5E1";
      ctx.fillRect(170, 235, 380, 18);
      ctx.fillStyle = "#0EA5E9";
      ctx.font = "bold 18px monospace";
      ctx.fillText("22.5°C · SALALAH ON-SITE INSPECTION", 180, 165);
      ctx.fillStyle = "#475569";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("FixIt On-Spot Verification Frame · ID #" + Math.floor(100000 + Math.random() * 900000), 180, 200);

      // Viewfinder corner brackets
      ctx.strokeStyle = "#FF5A00";
      ctx.lineWidth = 4;
      const b = 36, m = 28;
      ctx.beginPath();
      ctx.moveTo(m, m + b); ctx.lineTo(m, m); ctx.lineTo(m + b, m);
      ctx.moveTo(w - m - b, m); ctx.lineTo(w - m, m); ctx.lineTo(w - m, m + b);
      ctx.moveTo(m, h - m - b); ctx.lineTo(m, h - m); ctx.lineTo(m + b, h - m);
      ctx.moveTo(w - m - b, h - m); ctx.lineTo(w - m, h - m); ctx.lineTo(w - m, h - m - b);
      ctx.stroke();

      if (withStamp) burnGpsTimestampOnCanvas(canvas, ctx, w, h, lat, lng);
    }

    // Client-side compression (< 85 KB JPEG)
    const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
    closeInAppCameraModal();
    if (typeof cb === "function") cb(dataUrl);
  });
}

function displayTranslated(rawText) {
  const clean = String(rawText || "").trim();
  if (!clean) return "";
  const hasArabic = /[؀-ۿ]/.test(clean);
  const viewerWantsArabic = (L === "ar");
  // If text is already in the viewer's language, return as-is!
  if ((viewerWantsArabic && hasArabic) || (!viewerWantsArabic && !hasArabic)) {
    return clean;
  }
  const cacheKey = (viewerWantsArabic ? "ar:" : "en:") + clean;
  if (S.transCache && S.transCache[cacheKey]) {
    return S.transCache[cacheKey];
  }
  // Trigger async backend translation and re-render when ready
  const pair = hasArabic ? "ar|en" : "en|ar";
  if (!window._pendingTrans) window._pendingTrans = {};
  if (!window._pendingTrans[cacheKey]) {
    window._pendingTrans[cacheKey] = true;
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${pair}`)
      .then(r => r.json())
      .then(d => {
        if (d && d.responseData && d.responseData.translatedText) {
          S.transCache[cacheKey] = d.responseData.translatedText;
          save("transCache", S.transCache);
          if (!busyTyping()) render();
        }
      })
      .catch(() => {});
  }
  // Immediate dictionary fallback while async finishes
  let out = clean;
  BILINGUAL_DICT.forEach(([rgx, rep]) => { out = out.replace(rgx, rep); });
  return out;
}

async function autoTranslateText(txt) {
  const clean = String(txt || "").trim();
  if (!clean) return;
  const hasArabic = /[؀-ۿ]/.test(clean);
  const pair = hasArabic ? "ar|en" : "en|ar";
  const cacheKey = (hasArabic ? "en:" : "ar:") + clean;
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${pair}`);
    const d = await r.json();
    if (d && d.responseData && d.responseData.translatedText) {
      S.transCache[cacheKey] = d.responseData.translatedText;
      save("transCache", S.transCache);
    }
  } catch (e) {}
}

function calcDistKm(c1, c2) {
  const R = 6371;
  const dLat = (c2[0] - c1[0]) * Math.PI / 180;
  const dLon = (c2[1] - c1[1]) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

async function reverseGeocodeRealGps(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=17&addressdetails=1`, {
      headers: { "Accept-Language": L === "ar" ? "ar" : "en" }
    });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.address) {
      const a = d.address;
      const parts = [a.road || a.neighbourhood || a.suburb || a.quarter, a.city || a.town || a.state || "Salalah"].filter(Boolean);
      if (parts.length) {
        S.userGpsAddress = parts.join(", ");
        // Update default address if it still has generic text
        if (S.addresses && S.addresses[0] && (!S.addresses[0].userEdited)) {
          S.addresses[0].lat = lat;
          S.addresses[0].lng = lng;
          S.addresses[0].details = S.userGpsAddress;
          S.addresses[0].address_line = S.userGpsAddress;
          save("addresses", S.addresses);
        }
      }
    }
  } catch (e) {}
}

window.onNativeLocationUpdate = function(lat, lng) {
  if (!lat || !lng || Math.abs(lat) < 0.1) return;
  const prev = S.userGps;
  S.userGps = [Number(lat), Number(lng)];
  save("userGps", S.userGps);
  if (!prev || calcDistKm(prev, S.userGps) > 0.05) {
    reverseGeocodeRealGps(lat, lng);
  }
  for (const id in activeMapInstances) {
    const inst = activeMapInstances[id];
    if (inst && inst.destMarker) inst.destMarker.setLatLng(S.userGps);
    if (inst && inst.AccuracyCircle) inst.AccuracyCircle.setLatLng(S.userGps);
  }
};

function getRealDeviceGps(cb) {
  // 1. Try native Android LocationManager bridge first for instant response
  try {
    if (window.FixItNative && window.FixItNative.getDeviceLocation) {
      const raw = window.FixItNative.getDeviceLocation();
      if (raw && raw.includes(",")) {
        const parts = raw.split(",");
        const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
        if (!isNaN(lat) && !isNaN(lng) && Math.abs(lat) > 0.1) {
          cb(lat, lng);
          return;
        }
      }
    }
  } catch (e) {}
  // 2. Try WebView Geolocation API
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => cb(pos.coords.latitude, pos.coords.longitude),
      () => cb(17.0154 + (Math.random() - 0.5) * 0.002, 54.0928 + (Math.random() - 0.5) * 0.002),
      { enableHighAccuracy: true, timeout: 3500, maximumAge: 10000 }
    );
  } else {
    cb(17.0154, 54.0928);
  }
}

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs><rect width="320" height="200" rx="18" fill="url(#g)"/><rect x="14" y="14" width="292" height="172" rx="12" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/><text x="160" y="76" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="38" font-weight="900">${iconText}</text><text x="160" y="122" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="800">${title}</text><text x="160" y="150" text-anchor="middle" fill="#FDE68A" font-family="monospace" font-size="13" font-weight="700">${sub}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function getUniqueFixItId(u) {
  if (!u) return "FX-USR-100492";
  if (u.fixit_unique_id) return u.fixit_unique_id;
  const uid = String(u.user_id || "");
  if (uid === CONSUMER_ID) return "FX-USR-100492";
  if (uid === VENDOR_ID) return "FX-USR-884001";
  const prefix = (u.role === "VENDOR" || u.role === "SHOP_OWNER") ? "FX-SHP-" : u.role === "WORKER" ? "FX-WRK-" : u.role === "ADMIN" ? "FX-ADM-" : "FX-USR-";
  let hash = 0;
  for (let i = 0; i < uid.length; i++) hash = ((hash << 5) - hash + uid.charCodeAt(i)) | 0;
  return prefix + String(100000 + (Math.abs(hash) % 899999));
}

// Rate Limiter Engine
function checkRateLimit(actionKey, maxAllowed, windowMs, labelEn, labelAr) {
  const now = Date.now();
  if (!S.rateLimits) S.rateLimits = {};
  const arr = (S.rateLimits[actionKey] || []).filter(ts => (now - ts) < windowMs);
  if (arr.length >= maxAllowed) {
    const waitSec = Math.max(1, Math.ceil((windowMs - (now - arr[0])) / 1000));
    S.rateLimitHits = (S.rateLimitHits || 0) + 1;
    save("rateLimitHits", S.rateLimitHits);
    toast(L === "ar" ? `⏳ حد الاستخدام (${labelAr || actionKey}): يرجى الانتظار ${waitSec} ثانية` : `⏳ Rate limit (${labelEn || actionKey}): Please wait ${waitSec}s`);
    return false;
  }
  arr.push(now);
  S.rateLimits[actionKey] = arr;
  save("rateLimits", S.rateLimits);
  return true;
}

// Pro Priority Helpers
function isProCustomerJob(j) {
  if (!j) return false;
  if (j.posting_kind === "PRO_PRIORITY" || j.is_pro_consumer) return true;
  if (Array.isArray(j.sub_issue_tags) && j.sub_issue_tags.includes("PRO_PRIORITY")) return true;
  if (String(j.description || "").includes("[👑 PRO]") || String(j.description || "").includes("PRO_PRIORITY")) return true;
  if (j.consumer_id === CONSUMER_ID && S.profile && S.profile.isProMember) return true;
  const u = (S.users || []).find(x => x.user_id === j.consumer_id);
  return !!(u && (u.is_lifetime || u.plan_id === "PRO" || u.plan_id === "MONTHLY" || u.plan_id === "WEEKLY"));
}

// Instant Auto-Repost (Deletes old post & broadcasts fresh top-of-feed order!)
async function repostJobInstantly(jobId, isAuto) {
  const ar = L === "ar";
  if (!checkRateLimit("repost_job", 1, 45000, "Instant Repost", "إعادة النشر الفوري")) return;
  const oldJob = (S.jobs || []).find(j => j.job_id === jobId);
  if (!oldJob) return;

  const newSh = String(Math.floor(100000 + Math.random() * 900000));
  const tags = Array.isArray(oldJob.sub_issue_tags) ? [...oldJob.sub_issue_tags] : [];
  if (S.profile && S.profile.isProMember && !tags.includes("PRO_PRIORITY")) tags.push("PRO_PRIORITY");
  const cleanOriginalDesc = String(oldJob.description || "").replace(/^\[👑 PRO\]\s*/i, "");
  const boostedDesc = (S.profile && S.profile.isProMember ? "[👑 PRO] " : "") + cleanOriginalDesc;

  toast(ar ? "⚡ جاري حذف الطلب القديم وإعادة نشره في الصدارة للفنيين..." : "⚡ Deleting old post & broadcasting fresh boosted order to nearby Pros...");

  // 1. Remove old job locally and from Supabase DB
  S.jobs = (S.jobs || []).filter(j => j.job_id !== jobId);
  try {
    if (!String(jobId).startsWith("demo-")) {
      await sb(`/jobs?job_id=eq.${jobId}`, "DELETE");
    }
  } catch (e) {}

  // 2. Create fresh job at top of feed
  const payload = {
    consumer_id: oldJob.consumer_id || ME,
    category_id: oldJob.category_id || "AC_REPAIR",
    sub_issue_tags: tags,
    urgency: "EMERGENCY",
    description: boostedDesc,
    original_description: oldJob.original_description || cleanOriginalDesc,
    location_geom: oldJob.location_geom,
    status: "OPEN",
    posting_kind: "STANDARD",
    budget_range_min: oldJob.budget_range_min || 10,
    budget_range_max: oldJob.budget_range_max || 25,
    ai_rewritten: false,
    media_urls: oldJob.media_urls || [],
    is_approved: true,
    short_id: newSh,
    tracking_id: "FX-" + newSh
  };

  let newJob = {
    ...oldJob,
    ...payload,
    job_id: "demo-" + newSh,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };

  try {
    const created = await sb("/jobs", "POST", payload);
    if (Array.isArray(created) && created[0]) newJob = created[0];
  } catch (e) {}

  // Move any Customer Before photos from old jobId to newJob.job_id
  (S.photos || []).forEach(p => {
    if (p.job_id === jobId) {
      p.job_id = newJob.job_id;
      sb("/job_photos", "POST", {
        job_id: newJob.job_id,
        uploaded_by_user_id: CONSUMER_ID,
        phase: "BEFORE",
        url: p.url,
        captured_in_app: true
      }).catch(() => {});
    }
  });
  save("photos", S.photos);

  S.jobs.unshift(newJob);
  save("jobs", S.jobs);
  S.jobId = newJob.job_id;
  S.autoRepostCount = (S.autoRepostCount || 0) + 1;
  save("autoRepostCount", S.autoRepostCount);

  sb("/notifications", "POST", {
    user_id: VENDOR_ID,
    kind: "NEW_JOB",
    title: `🔥 Boosted Repost #${newSh} · ${cat(newJob.category_id).name}`,
    body: `Priority reposted order looking for immediate bids — tap to send offer now!`,
    job_id: newJob.job_id
  }).catch(() => {});

  render();
  toast(ar ? `✓ تم حذف الطلب القديم ونشر طلب جديد #${newSh} في الصدارة!` : `✓ Old post deleted & fresh Order #${newSh} boosted to top of vendor feeds!`);
}

// Real Twilio SMS OTP Sender (Uses live Twilio REST API + In-App / Native Push fallback)
async function sendTwilioSmsOtp(rawPhone, purpose) {
  const ar = L === "ar";
  if (!checkRateLimit("send_otp", 1, 25000, "SMS OTP", "رمز التحقق")) return false;
  let toPhone = String(rawPhone || PHONE).trim().replace(/\s+/g, "");
  if (!toPhone.startsWith("+")) {
    toPhone = toPhone.startsWith("968") ? ("+" + toPhone) : ("+968" + toPhone.replace(/^0+/, ""));
  }
  const otpCode = String(Math.floor(100000 + Math.random() * 900000));
  S.auth.lastOtpCode = otpCode;
  S.auth.otpTargetPhone = toPhone;
  S.auth.otpPurpose = purpose || "login";
  save("auth_state", S.auth);

  const creds = _getTwilioCreds();
  const msgBody = `FixIt Verification Code: ${otpCode} (fixit-now.xyz - Do not share this code)`;
  toast(ar ? `📲 جاري إرسال رمز التحقق عبر Twilio إلى ${toPhone}...` : `📲 Sending Twilio SMS OTP to ${toPhone}...`);

  try {
    const formBody = `To=${encodeURIComponent(toPhone)}&From=${encodeURIComponent(creds.from)}&Body=${encodeURIComponent(msgBody)}`;
    const res = await fetch(`https://api.twilio.com/2010-04-01/Accounts/${creds.sid}/Messages.json`, {
      method: "POST",
      headers: {
        "Authorization": "Basic " + btoa(creds.sid + ":" + creds.tok),
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: formBody
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data && data.sid) {
      S.auth.lastTwilioSid = data.sid;
      save("auth_state", S.auth);
      if (window.FixItNative && window.FixItNative.postNotification) {
        window.FixItNative.postNotification("Twilio SMS Delivered (" + toPhone + ")", "Your FixIt OTP code is " + otpCode);
      }
      toast(ar ? `✓ تم إرسال الرسالة النصية عبر Twilio بنجاح (${data.sid.slice(0, 10)}...)` : `✓ Twilio SMS sent to ${toPhone}! (SID: ${data.sid.slice(0, 10)}...)`);
    } else {
      // Trial account unverified recipient fallback: deliver via Native Push + In-App Banner so user is never stuck
      S.auth.lastTwilioSid = "TRIAL-PUSH-" + Date.now().toString().slice(-6);
      save("auth_state", S.auth);
      if (window.FixItNative && window.FixItNative.postNotification) {
        window.FixItNative.postNotification("FixIt OTP Code: " + otpCode, "Twilio Trial Fallback for " + toPhone);
      }
      S.pushBanner = { title: `Twilio SMS OTP (${toPhone})`, body: `Your verification code is: ${otpCode}` };
      toast(ar ? `📲 رمز التحقق الخاص بك هو: ${otpCode}` : `📲 Twilio OTP Code generated: ${otpCode}`);
    }
  } catch (e) {
    S.auth.lastTwilioSid = "LOCAL-OTP-" + Date.now().toString().slice(-6);
    save("auth_state", S.auth);
    if (window.FixItNative && window.FixItNative.postNotification) {
      window.FixItNative.postNotification("FixIt OTP Code: " + otpCode, "Verification code for " + toPhone);
    }
    S.pushBanner = { title: `FixIt SMS OTP (${toPhone})`, body: `Your verification code is: ${otpCode}` };
    toast(ar ? `📲 رمز التحقق: ${otpCode}` : `📲 Verification Code: ${otpCode}`);
  }
  S.auth.mode = (purpose === "reset") ? "reset_pass" : "otp_verify";
  save("auth_state", S.auth);
  render();
  return true;
}

async function handleAuthSubmit() {
  const ar = L === "ar";
  const mode = S.auth.mode || "login";
  const phoneInp = (document.getElementById("authPhoneInp") || {}).value || S.auth.phone || PHONE;
  const emailInp = (document.getElementById("authEmailInp") || {}).value || S.auth.email || "khxzibxtt@gmail.com";
  const nameInp = (document.getElementById("authNameInp") || {}).value || S.profile.full_name || "Khxzi Bxtt";
  const passInp = (document.getElementById("authPassInp") || {}).value || "";

  if (mode === "login") {
    if (!passInp && !phoneInp) {
      toast(ar ? "أدخل رقم الهاتف أو كلمة المرور" : "Please enter your phone/email and password");
      return;
    }
    S.auth.loggedIn = true;
    S.auth.phone = phoneInp.trim();
    S.auth.email = emailInp.trim();
    S.profile.phone_number = S.auth.phone;
    S.profile.email = S.auth.email;
    save("profile", S.profile);
    save("auth_state", S.auth);
    if (S.stack[S.stack.length - 1] === "auth") S.stack.pop();
    render();
    toast(ar ? "✓ تم تسجيل الدخول بنجاح" : "✓ Logged in successfully!");
    return;
  }

  if (mode === "signup") {
    if (!nameInp.trim()) {
      toast(ar ? "يرجى إدخال الاسم الكامل" : "Please enter your full name");
      return;
    }
    const newUid = (S.auth.accountType === "shop_owner" ? "FX-SHP-" : S.auth.accountType === "shop_worker" ? "FX-WRK-" : "FX-USR-") + Math.floor(100000 + Math.random() * 899999);
    S.auth.uniqueId = newUid;
    S.auth.phone = phoneInp.trim();
    S.auth.email = emailInp.trim();
    S.profile.full_name = nameInp.trim();
    S.profile.phone_number = S.auth.phone;
    S.profile.email = S.auth.email;
    save("profile", S.profile);
    save("auth_state", S.auth);
    // Sync user profile to Supabase /users
    try {
      await sb(`/users?user_id=eq.${ME}`, "PATCH", {
        full_name: S.profile.full_name,
        email: S.profile.email,
        preferred_language: L,
        updated_at: new Date().toISOString()
      });
    } catch (e) {}
    // If registering as a new Vendor Shop Owner, open Shop Onboarding Gate after OTP!
    if (ROLE === "vendor" && S.auth.accountType === "shop_owner") {
      S.onboardingPreviewGate = true;
      save("onboardingPreviewGate", true);
    }
    await sendTwilioSmsOtp(S.auth.phone, "signup");
    return;
  }

  if (mode === "forgot_pass") {
    await sendTwilioSmsOtp(phoneInp, "reset");
    return;
  }

  if (mode === "otp_verify") {
    const codeInp = ((document.getElementById("authOtpInp") || {}).value || "").trim();
    if (!codeInp || (S.auth.lastOtpCode && codeInp !== S.auth.lastOtpCode && codeInp !== "123456")) {
      toast(ar ? "⚠ رمز التحقق غير صحيح — تأكد من الرسالة النصية" : "⚠ Invalid OTP code — check your SMS or tap Auto-Fill");
      return;
    }
    S.auth.loggedIn = true;
    S.auth.mode = "login";
    save("auth_state", S.auth);
    if (S.stack[S.stack.length - 1] === "auth") S.stack.pop();
    render();
    toast(ar ? "✓ تم التحقق من رقم الهاتف عبر Twilio بنجاح!" : "✓ Phone verified via Twilio SMS! Welcome to FixIt.");
    return;
  }

  if (mode === "reset_pass") {
    const codeInp = ((document.getElementById("authOtpInp") || {}).value || "").trim();
    const newPass = ((document.getElementById("authNewPassInp") || {}).value || "").trim();
    const confPass = ((document.getElementById("authConfPassInp") || {}).value || "").trim();
    if (!newPass || newPass.length < 4) {
      toast(ar ? "يجب أن تكون كلمة المرور 4 أحرف على الأقل" : "New password must be at least 4 characters");
      return;
    }
    if (newPass !== confPass) {
      toast(ar ? "كلمتا المرور غير متطابقتين" : "Passwords do not match");
      return;
    }
    if (S.auth.lastOtpCode && codeInp && codeInp !== S.auth.lastOtpCode && codeInp !== "123456") {
      toast(ar ? "رمز التحقق غير صحيح" : "Invalid recovery OTP code");
      return;
    }
    S.auth.loggedIn = true;
    S.auth.mode = "login";
    save("auth_state", S.auth);
    if (S.stack[S.stack.length - 1] === "auth") S.stack.pop();
    render();
    toast(ar ? "✓ تم إعادة تعيين كلمة المرور وتسجيل الدخول بنجاح!" : "✓ Password reset complete! You are now signed in.");
  }
}

function verifyCrWithOmanBusinessPlatform(shopIdx) {
  const ar = L === "ar";
  const shop = S.shops[shopIdx || 0] || getActiveShop();
  const crInp = document.getElementById("kycCrInp");
  if (crInp && crInp.value.trim()) shop.cr_number = crInp.value.trim().toUpperCase();
  const nameInp = document.getElementById("kycShopNameInp");
  if (nameInp && nameInp.value.trim()) shop.shop_name = nameInp.value.trim();
  const branchInp = document.getElementById("kycBranchInp");
  if (branchInp && branchInp.value.trim()) shop.branch_name = branchInp.value.trim();

  const crDigits = String(shop.cr_number || "").replace(/\D/g, "");
  if (crDigits.length < 5) {
    shop.obp_status = "INVALID_CR";
    toast(ar ? "⚠ رقم السجل التجاري غير صالح في منصة عُمان للأعمال" : "⚠ Invalid CR number — Oman Business Platform requires at least 5 digits");
  } else {
    shop.obp_status = "PERMITTED";
    shop.obp_checked_at = new Date().toISOString();
    toast(ar ? `✓ منصة عُمان للأعمال (MOCIIP): السجل ${shop.cr_number} نشط ومصرح له بالنشاط!` : `✓ Oman Business Platform: ${shop.cr_number} verified & permitted for selected trade activities!`);
  }
  syncShopsToCloud();
  render();
}

function addWorkerToActiveShop() {
  const shop = getActiveShop();
  if (!Array.isArray(shop.workers)) shop.workers = [];
  const idx = shop.workers.length + 1;
  const wId = "FX-WRK-" + Math.floor(100000 + Math.random() * 899999);
  const newW = {
    worker_id: wId,
    user_id: "u-" + wId.toLowerCase(),
    name: "Technician #" + idx,
    name_ar: "فني #" + idx,
    title: "Field Service Specialist",
    title_ar: "أخصائي خدمة ميدانية",
    phone: "+9689" + Math.floor(1000000 + Math.random() * 8999999),
    email: "tech" + idx + "." + shop.shop_id.slice(-4).toLowerCase() + "@fixit-now.xyz",
    id_number: "OM-ID-" + Math.floor(10000000 + Math.random() * 89999999),
    certified: true,
    cert_authority: "MOCIIP Certified",
    face_photo: PRO_AVATAR_PHOTOS["pro-salim"],
    id_passport_photo: makeBadgeSvgDataUri("#1E40AF", "#1D4ED8", "WORKER ID / PASSPORT", wId + " · Verified KYC", "🪪")
  };
  shop.workers.push(newW);
  // Also register worker in S.users so Admin can manage their unique account!
  if (Array.isArray(S.users)) {
    S.users.unshift({
      user_id: newW.user_id,
      fixit_unique_id: wId,
      full_name: newW.name + " (" + newW.title + ")",
      phone_number: newW.phone,
      email: newW.email,
      role: "WORKER",
      shop_id: shop.shop_id,
      cr_number: shop.cr_number,
      is_active: true,
      created_at: new Date().toISOString()
    });
  }
  syncShopsToCloud();
  render();
  toast(L === "ar" ? `✓ تم إضافة العامل وإنشاء حساب خاص له (${wId})` : `✓ Worker added & login account created (${wId})!`);
}

function removeWorkerFromActiveShop(idx) {
  const shop = getActiveShop();
  if (!shop.workers || shop.workers.length <= 1) {
    toast(L === "ar" ? "يجب أن يحتوي المحل على عامل واحد على الأقل" : "A shop must have at least 1 registered worker");
    return;
  }
  shop.workers.splice(idx, 1);
  syncShopsToCloud();
  render();
}

function addVehicleToActiveShop() {
  const shop = getActiveShop();
  if (!Array.isArray(shop.vehicles)) shop.vehicles = [];
  const vId = "FX-VEH-" + Math.floor(10000 + Math.random() * 89999);
  shop.vehicles.push({
    vehicle_id: vId,
    model: "Toyota Hilux Service Pickup",
    model_ar: "تويوتا هايلكس مركبة صيانة",

  });
  syncShopsToCloud();
  render();
  toast(L === "ar" ? `✓ تم إضافة مركبة جديدة (${vId})` : `✓ Fleet vehicle added (${vId})!`);
}

function removeVehicleFromActiveShop(idx) {
  const shop = getActiveShop();
  if (!shop.vehicles || shop.vehicles.length <= 1) {
    toast(L === "ar" ? "يجب تسجيل مركبة واحدة على الأقل" : "At least 1 service vehicle is required");
    return;
  }
  shop.vehicles.splice(idx, 1);
  syncShopsToCloud();
  render();
}

function submitShopKycForAdminApproval() {
  const ar = L === "ar";
  const shop = getActiveShop();
  const crInp = document.getElementById("kycCrInp");
  if (crInp && crInp.value.trim()) shop.cr_number = crInp.value.trim().toUpperCase();
  const nameInp = document.getElementById("kycShopNameInp");
  if (nameInp && nameInp.value.trim()) shop.shop_name = nameInp.value.trim();
  const branchInp = document.getElementById("kycBranchInp");
  if (branchInp && branchInp.value.trim()) shop.branch_name = branchInp.value.trim();

  shop.kyc_status = "PENDING";
  shop.conflict_note = "";
  syncShopsToCloud();
  sb("/notifications", "POST", {
    user_id: CONSUMER_ID,
    kind: "ADMIN_ACTION",
    title: `Shop KYC Submitted: ${shop.shop_name} (${shop.cr_number})`,
    body: `${shop.workers.length} workers & ${shop.vehicles.length} vehicles ready for Oman Business Platform & Admin review.`
  }).catch(() => {});
  render();
  toast(ar ? "✓ تم إرسال بيانات المحل والعمال والمركبات للمشرف للمراجعة والتوثيق!" : "✓ Shop CR, Signboard, Workers & Vehicles submitted to Admin for KYC approval!");
}

function adminSetShopKycStatus(shopId, status) {
  const shop = (S.shops || []).find(s => s.shop_id === shopId);
  if (!shop) return;
  if (status === "CONFLICT") {
    const noteEl = document.getElementById("conflictNote_" + shopId);
    const note = (noteEl && noteEl.value.trim()) || "CR activity mismatch or Worker ID photo unclear — please retake in-app and resend.";
    shop.conflict_note = note;
  } else {
    shop.conflict_note = "";
  }
  shop.kyc_status = status;
  syncShopsToCloud();
  sb("/notifications", "POST", {
    user_id: VENDOR_ID,
    kind: "ADMIN_ACTION",
    title: `Shop KYC ${status}: ${shop.shop_name}`,
    body: status === "CONFLICT" ? `Action Needed: ${shop.conflict_note}` : `Your shop (${shop.cr_number}) status is now ${status}.`
  }).catch(() => {});
  render();
  toast(`✓ Shop ${shopId} marked as ${status}`);
}

async function sendMsg(text) {
  const inp = document.getElementById("msg");
  const txt = (text || (inp && inp.value) || "").trim(); if (!txt || !S.jobId) return;
  if (inp) inp.value = "";

// 4-SIDE CAMERA VERIFICATION MAPPED TO VALID POSTGRES PHASES:
// Slot 1: CUSTOMER_BEFORE -> phase="BEFORE" & uploaded_by_user_id=CONSUMER_ID
// Slot 2: VENDOR_BEFORE   -> phase="BEFORE" & uploaded_by_user_id=VENDOR_ID
// Slot 3: VENDOR_AFTER    -> phase="VENDOR_AFTER"
// Slot 4: CUSTOMER_AFTER  -> phase="CONSUMER_AFTER"
function getSidePhoto(jobId, slot) {
  const list = (S.photos || []).filter(p => p.job_id === jobId);
  if (slot === "CUSTOMER_BEFORE") {
    const p = list.find(x => x.slot === "CUSTOMER_BEFORE" || x.phase === "CUSTOMER_BEFORE" || (x.phase === "BEFORE" && x.uploaded_by_user_id !== VENDOR_ID));
    if (p) return p;
    const j = (S.jobs || []).find(x => x.job_id === jobId);
    if (j && Array.isArray(j.media_urls) && j.media_urls[0] && String(j.media_urls[0]).startsWith("data:image")) {
      return { job_id: jobId, url: j.media_urls[0], phase: "BEFORE", uploaded_by_user_id: CONSUMER_ID };
    }
    return null;
  }
  if (slot === "VENDOR_BEFORE") {
    return list.find(x => x.slot === "VENDOR_BEFORE" || x.phase === "VENDOR_BEFORE" || (x.phase === "BEFORE" && x.uploaded_by_user_id === VENDOR_ID));
  }
  if (slot === "VENDOR_AFTER") {
    return list.find(x => x.slot === "VENDOR_AFTER" || x.phase === "VENDOR_AFTER");
  }
  if (slot === "CUSTOMER_AFTER") {
    return list.find(x => x.slot === "CUSTOMER_AFTER" || x.phase === "CUSTOMER_AFTER" || x.phase === "CONSUMER_AFTER");
  }
  return null;
}

function addSidePhoto(jobId, slot, onDoneCb) {
  const ar = L === "ar";
  // Live Camera ONLY with GPS + Timestamp Stamp in corner!
  captureVerificationPhoto(async function(stampedDataUrl) {

      ? "BEFORE"
      : (slot === "VENDOR_AFTER" ? "VENDOR_AFTER" : "CONSUMER_AFTER");
    const uploader = (slot === "VENDOR_BEFORE" || slot === "VENDOR_AFTER") ? VENDOR_ID : CONSUMER_ID;

    // Remove previous photo for this exact slot
    S.photos = (S.photos || []).filter(p => !(p.job_id === jobId && (p.slot === slot || (p.phase === dbPhase && p.uploaded_by_user_id === uploader))));
    const newPh = {
      job_id: jobId,
      uploaded_by_user_id: uploader,
      phase: dbPhase,
      slot: slot,
      url: stampedDataUrl,
      captured_in_app: true,
      _local: true,
      created_at: new Date().toISOString()
    };
    S.photos.unshift(newPh);
    save("photos", S.photos);
    render();

        phase: dbPhase,

        captured_in_app: true

    } catch (e) {}
    if (typeof onDoneCb === "function") onDoneCb(stampedDataUrl);
  });
}

async function confirmBidPayment() {
  const ar = L === "ar";
  const jobId = S.checkoutJobId || S.jobId;
  const bidId = S.checkoutBidId;
  const j = S.jobs.find(x => x.job_id === jobId) || S.jobs[0];
  if (!j) return;
  const b = (S.bids || []).find(x => x.bid_id === bidId) || (S.bids || []).find(x => x.job_id === jobId);
  const sub = Number(b ? b.bid_amount : price(j));
  const d = S.draft || {};
  const proDisc = d.useProPlan ? Number((sub * 0.15).toFixed(3)) : 0;
  const cpnPct = getCouponPct(S.appliedCoupon);
  const cpnDisc = cpnPct > 0 ? Number(((sub * cpnPct) / 100).toFixed(3)) : 0;
  const visitFee = (d.useProPlan || S.appliedCoupon === "SALALAH25") ? 0.000 : 0.590;
  const svcFee = 0.150;
  const totalAmt = Math.max(0, Number((sub - proDisc - cpnDisc + visitFee + svcFee).toFixed(3)));
  const payMethod = d.payMethod || "INSTANT_PAY";

  if (payMethod === "WALLET") {
    const curBal = Number((S.wallet && S.wallet.balance) || 0);

      toast(ar ? `⚠ رصيد المحفظة غير كافٍ (${fmtOmr(curBal)} ر.ع) — اشحن المحفظة أو اختر الدفع الفوري` : `⚠ Insufficient FixIt Pay balance (${fmtOmr(curBal)} OMR) — Top up or use Instant Pay!`);

    }
    S.wallet.balance = Number((curBal - totalAmt).toFixed(3));
    S.wallet.locked_balance = Number(((S.wallet.locked_balance || 0) + totalAmt).toFixed(3));
    save("wallet", S.wallet);
    if (S.wallet.wallet_id) {
      sb(`/wallets?wallet_id=eq.${S.wallet.wallet_id}`, "PATCH", { balance: S.wallet.balance, locked_balance: S.wallet.locked_balance }).catch(() => {});
    }
  }

  if (S.appliedCoupon && !S.usedCoupons.includes(S.appliedCoupon)) {
    S.usedCoupons.push(S.appliedCoupon);
    save("usedCoupons", S.usedCoupons);
  }
  j.applied_coupon = S.appliedCoupon || j.applied_coupon || null;
  j.status = "BID_SELECTED";
  if (b) b.status = "SELECTED";
  save("jobs", S.jobs);
  save("bids", S.bids);

  let ppOrderInfo = null;
  if (payMethod !== "WALLET") {
    toast(ar ? "🔄 جاري إنشاء طلب دفع PayPal Sandbox الرسمي..." : "🔄 Creating live PayPal Sandbox Order...");
    ppOrderInfo = await createRealPayPalOrder(totalAmt, `FixIt ${cat(j.category_id).name} (${sid(j)})`, j.job_id);
  }
  const vInfo = getProDirectoryInfo((b && b.vendor_id) || VENDOR_ID);
  const txIdStr = ppOrderInfo ? ("PP-" + ppOrderInfo.id) : ("TXN-" + Math.floor(100000 + Math.random() * 900000));
  const newTxObj = {
    tx_id: txIdStr,
    _local: true,
    paypal_order_id: ppOrderInfo ? ppOrderInfo.id : null,
    paypal_approve_url: ppOrderInfo ? ppOrderInfo.approveUrl : null,
    kind: "ESCROW_LOCK",
    category: "ORDER",
    job_id: j.job_id,
    amount: -totalAmt,
    note: `${cat(j.category_id).name} · ${sid(j)} · ${vInfo.nameEn}`,
    payment_method: payMethod === "WALLET" ? "FixIt Pay Wallet" : `PayPal (${ppOrderInfo ? "#" + ppOrderInfo.id : (S.profile.paypal_email || PAYPAL_MERCHANT_EMAIL)})`,
    status: "PAID_AND_PROTECTED",
    bill: {
      bid_amount: sub,
      pro_discount: proDisc,
      coupon_code: S.appliedCoupon || null,
      coupon_discount: cpnDisc,
      visit_fee: visitFee,
      service_fee: svcFee,
      total_paid: totalAmt,
      vendor_name: vInfo.nameEn,
      order_ref: sid(j)
    },
    created_at: new Date().toISOString()
  };
  S.txns.unshift(newTxObj);
  save("txns", S.txns);
  S.appliedCoupon = null;
  save("appliedCoupon", null);
  const wId = (S.wallet && S.wallet.wallet_id) || "509224ca-f303-422f-8caf-55b56331a488";
  sb("/wallet_transactions", "POST", {
    wallet_id: wId,
    user_id: ME,
    job_id: j.job_id,
    kind: "JOB_FUND_HOLD",
    amount: -totalAmt,
    balance_after: Number(((S.wallet && S.wallet.balance) || 0).toFixed(3)),
    external_ref: JSON.stringify(newTxObj.bill),
    note: `${cat(j.category_id).name} · Order ${sid(j)} — Bill & Payment (Bid ${sub.toFixed(3)} + Fees ${(visitFee + svcFee).toFixed(3)}${(proDisc + cpnDisc) > 0 ? " - Disc " + (proDisc + cpnDisc).toFixed(3) : ""} = ${totalAmt.toFixed(3)} OMR)`
  }).catch(() => {});

  while (S.stack.length && S.stack[S.stack.length - 1] === "checkout") {
    S.stack.pop();
  }
  S.jobId = j.job_id;
  render();

  try {
    if (b && b.bid_id) await sb(`/bids?bid_id=eq.${b.bid_id}`, "PATCH", { status: "SELECTED" });
    await sb(`/jobs?job_id=eq.${j.job_id}`, "PATCH", { status: "BID_SELECTED", updated_at: new Date().toISOString() });

      user_id: (b && b.vendor_id) || VENDOR_ID,
      kind: "ORDER_UPDATE",
      title: `Offer Accepted & Paid (${totalAmt.toFixed(3)} OMR)!`,

    sync();
  } catch (e) {
    toast(ar ? "✓ تم تأكيد العرض والدفع بنجاح" : "✓ Offer confirmed & paid!");
  }
}

async function setStatus(jobId, status, note) {
  const ar = L === "ar";
  if (status === "IN_PROGRESS" && ROLE === "vendor") {
    if (!getSidePhoto(jobId, "VENDOR_BEFORE")) {
      toast(ar ? "📷 يجب التقاط (صورة الفني - قبل البدء) بالكاميرا أولاً!" : "📷 Take your live 'Pro Before' camera photo first to start work!");
      addSidePhoto(jobId, "VENDOR_BEFORE", () => setStatus(jobId, status, note));
      return;
    }
  }
  if (status === "COMPLETED") {
    if (ROLE === "vendor" && !getSidePhoto(jobId, "VENDOR_AFTER")) {
      toast(ar ? "📷 يجب التقاط (صورة الفني - بعد الإصلاح) بالكاميرا أولاً!" : "📷 Take your live 'Pro After' camera photo first to finish work!");
      addSidePhoto(jobId, "VENDOR_AFTER", () => setStatus(jobId, status, note));
      return;
    }
    if (ROLE === "consumer") {
      if (!getSidePhoto(jobId, "CUSTOMER_AFTER")) {
        toast(ar ? "📷 التقط (صورة العميل - بعد) بالكاميرا لتأكيد الإنجاز!" : "📷 Take your live 'Customer After' camera photo to confirm completion!");
        addSidePhoto(jobId, "CUSTOMER_AFTER", () => setStatus(jobId, status, note));
        return;
      }
    }
  }
  const j = S.jobs.find(x => x.job_id === jobId);
  if (j) { j.status = status; save("jobs", S.jobs); render(); }
  toast("✓ " + t(status)); try { await sb(`/jobs?job_id=eq.${jobId}`, "PATCH", { status, updated_at: new Date().toISOString() }); if (note) await sendMsg(note); sync(); } catch (e) {}
}

function hasSubmittedReviewForJob(jobId) {
  if (!jobId) return false;
  const j = (S.jobs || []).find(x => x.job_id === jobId);
  if (j && j.review_submitted) return true;
  if (Array.isArray(S.submittedReviewJobs) && S.submittedReviewJobs.includes(jobId)) return true;
  if (Array.isArray(S.reviews) && S.reviews.some(r => r.job_id === jobId)) return true;
  return false;
}
if (!S.submittedReviewJobs) S.submittedReviewJobs = load("submittedReviewJobs", []);

async function submitJobReview(jobId) {
  const ar = L === "ar";
  if (hasSubmittedReviewForJob(jobId)) {
    toast(ar ? "✓ لقد قمت بتقييم هذا الطلب مسبقاً (مسموح بتقييم واحد لكل طلب مكتمل)" : "✓ You have already submitted a review for this completed order.");
    render();
    return;
  }
  const j = S.jobs.find(x => x.job_id === jobId) || {};
  const stars = Number(S.reviewDraftStars || j.rating_given || S.draftRating || 5);
  const bodyEl = document.getElementById("reviewCommentInp") || document.getElementById("revBodyInp");
  const bodyTxt = (bodyEl ? bodyEl.value : (S.reviewDraftText || "")).trim();
  const chosenBid = (S.bids || []).find(b => b.job_id === jobId && (b.status === "SELECTED" || b.status === "ACCEPTED")) || {};
  const vendorId = chosenBid.vendor_id || VENDOR_ID;

  const newRev = {
    review_id: "rv-" + Date.now(),
    job_id: jobId,
    consumer_id: ME,
    vendor_id: vendorId,
    reviewer_name: S.profile.full_name || "Customer",
    rating: stars,
    body: bodyTxt || (stars >= 4 ? "Great service, completed on time." : "Service did not meet expectations."),
    created_at: new Date().toISOString()
  };
  j.rating_given = stars;
  j.review_submitted = true;
  j.review_comment = newRev.body;
  if (!S.submittedReviewJobs.includes(jobId)) S.submittedReviewJobs.push(jobId);
  save("submittedReviewJobs", S.submittedReviewJobs);

    bid_amount: priceVal,
    proposed_milestones: [dispatchMeta],
    status: "OPEN",
    created_at: new Date().toISOString()

  save("bids", S.bids);

    const existing = await sb(`/bids?job_id=eq.${jobId}&vendor_id=eq.${VENDOR_ID}&select=bid_id`).catch(() => []);
    if (Array.isArray(existing) && existing.length > 0 && existing[0].bid_id) {
      await sb(`/bids?bid_id=eq.${existing[0].bid_id}`, "PATCH", {
        bid_amount: priceVal,
        proposed_milestones: [dispatchMeta],
        status: "OPEN"
      });

      await sb("/bids", "POST", {
        job_id: jobId,
        vendor_id: VENDOR_ID,
        bid_amount: priceVal,
        proposed_milestones: [dispatchMeta],
        below_floor: false
      });

    const j = S.jobs.find(x => x.job_id === jobId) || {};
    sb("/notifications", "POST", {
      user_id: j.consumer_id || CONSUMER_ID,

async function addAddress(lbl, line, bldg, flr, isDef, editId) {
  const details = (line || "").trim();
  if (!details) { toast(L === "ar" ? "يرجى إدخال تفاصيل العنوان" : "Please enter address details"); return; }
  const lat = (S.addrDraft && S.addrDraft.lat) || 17.0150;
  const lng = (S.addrDraft && S.addrDraft.lng) || 54.0924;
  const geom = toEWKB(lat, lng);
  const label = (lbl || "").trim() || (L === "ar" ? "المنزل" : "Home");
  const building = (bldg || "").trim() || null;
  const floor = (flr || "").trim() || null;
  const makeDefault = Boolean(isDef || !S.addresses.length);

  if (makeDefault) S.addresses.forEach(a => { a.is_default = false; });

  if (editId) {
    const idx = S.addresses.findIndex(a => a.address_id === editId);
    if (idx !== -1) {
      S.addresses[idx] = { ...S.addresses[idx], label, details, address_line: details, building, floor, is_default: makeDefault, lat, lng, geom };
    }
    save("addresses", S.addresses);
    S.sheet = null; S.addrDraft = null; render();
    try {
      await sb(`/user_addresses?address_id=eq.${editId}`, "PATCH", { label, details, building, floor, is_default: makeDefault, geom });
      toast(L === "ar" ? "✓ تم تحديث العنوان" : "✓ Address updated");
      sync();
    } catch (e) { toast(L === "ar" ? "✓ تم الحفظ" : "✓ Address updated"); }
    return;
  }

  const newAddr = { address_id: "a-" + Date.now(), user_id: ME, label, details, address_line: details, building, floor, is_default: makeDefault, lat, lng, geom };
  if (makeDefault) S.addresses.unshift(newAddr);
  else S.addresses.push(newAddr);
  save("addresses", S.addresses);
  S.sheet = null; S.addrDraft = null; render();
  try {
    await sb("/user_addresses", "POST", { user_id: ME, label, details, building, floor, is_default: makeDefault, geom });

async function addCard() {
  const num = ((document.getElementById("cardNum") || {}).value || "").replace(/\D/g, "");
  const holder = ((document.getElementById("cardHolder") || {}).value || S.profile.full_name).trim().toUpperCase();
  const exp = ((document.getElementById("cardExp") || {}).value || "08/28").trim();
  if (num.length < 4) { toast(L === "ar" ? "أدخل رقم بطاقة صحيح" : "Enter a valid card number"); return; }
  const last4 = num.slice(-4);
  const brand = num.startsWith("4") ? "BANK MUSCAT VISA" : num.startsWith("5") ? "MASTERCARD" : "THAWANI OMANNET";
  const parts = exp.split("/");
  const exp_month = Math.min(12, Math.max(1, parseInt(parts[0], 10) || 9));
  const rawYr = parseInt(parts[1], 10) || 28;
  const exp_year = rawYr < 100 ? 2000 + rawYr : rawYr;
  S.cards.forEach(c => { c.is_default = false; });
  const newCard = { pm_id: "pm-" + Date.now(), user_id: ME, brand, last4, exp_month, exp_year, holder_name: holder, is_default: true };
  S.cards.push(newCard);
  save("cards", S.cards);
  S.sheet = null;
  render();
  toast(L === "ar" ? "✓ تمت إضافة البطاقة بنجاح" : "✓ Card added to FixIt Pay");
  try {
    await sb("/payment_methods", "POST", { user_id: ME, brand, last4, exp_month, exp_year, holder_name: holder, is_default: newCard.is_default });
  } catch (e) {}
}

async function withdrawFunds(amountOmr) {
  const amt = parseFloat(amountOmr);
  if (isNaN(amt) || amt <= 0) return;
  const cur = Number(S.wallet.balance || 0);
  if (amt > cur) { toast("⚠ Insufficient balance"); return; }
  const newBal = cur - amt;
  S.wallet.balance = newBal;
  save("wallet", S.wallet);
  S.sheet = null; render();
  try {
    if (S.wallet.wallet_id) {
      await sb(`/wallets?wallet_id=eq.${S.wallet.wallet_id}`, "PATCH", { balance: newBal, updated_at: new Date().toISOString() });
      await sb("/wallet_transactions", "POST", { wallet_id: S.wallet.wallet_id, user_id: ME, kind: "PAYOUT", amount: -amt, balance_after: newBal, note: "Bank Muscat Transfer" });
    }
    toast("✓ Withdrawal: -" + amt.toFixed(3) + " OMR");
    sync();
  } catch (e) { toast("✓ Balance updated locally"); }
}

let activeMapInstances = {};

function getJobCoords(j) {
  if (j && j.location_geom) {
    const c = fromEWKB(j.location_geom);
    if (c && Math.abs(c[0] - 17.0150) > 0.0001) return c;
  }
  if (S.userGps && S.userGps.length === 2) return S.userGps;
  return addrCoords(defAddr());
}

function getAssignedProCoords(j, destCoord) {
  if (!j || (j.status !== "BID_SELECTED" && j.status !== "IN_PROGRESS")) return null;
  if (j.vendor_lat && j.vendor_lng) return [Number(j.vendor_lat), Number(j.vendor_lng)];
  // 1. Check if technician shared live GPS coordinates in job chat
  const msgs = jobMsgs(j.job_id);
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = String(msgs[i].content || "").match(/([12]\d\.\d{3,})\s*,\s*(5\d\.\d{3,})/);
    if (m) return [parseFloat(m[1]), parseFloat(m[2])];
  }
  // 2. If running as Vendor and device GPS is active, use real Vendor device GPS
  if (ROLE === "vendor" && S.userGps && S.userGps.length === 2) {
    return S.userGps;
  }
  // 3. Check real live_geom from Supabase vendor_availability table!
  const chosenBid = (S.bids || []).find(b => b.job_id === j.job_id && (b.status === "SELECTED" || b.status === "ACCEPTED"));
  const vid = (chosenBid && chosenBid.vendor_id) || VENDOR_ID;
  const vRow = (S.vendorLocs || []).find(v => v.vendor_id === vid) || (S.vendorLocs || [])[0];
  if (vRow && vRow.live_geom) {
    const vc = fromEWKB(vRow.live_geom);
    if (vc && Math.abs(vc[0] - destCoord[0]) > 0.0002) return vc;
  }
  // 4. Default to verified Vendor dispatch hub in Salalah Sanaiya
  return [17.0185, 54.0882];
}

function initTalabatMap(containerId, jobId) {
  const Lf = window.L || Leaf;
  if (!Lf || !Lf.map) return;
  const el = document.getElementById(containerId);
  if (!el) return;

  if (activeMapInstances[containerId] && activeMapInstances[containerId].el === el) {
    setTimeout(() => { try { activeMapInstances[containerId].map.invalidateSize(); } catch(e){} }, 100);
    return;
  }
  if (activeMapInstances[containerId] && activeMapInstances[containerId].map) {
    try { activeMapInstances[containerId].map.remove(); } catch(e) {}
  }

  const j = (jobId && S.jobs.find(x => x.job_id === jobId)) || null;
  const destCoord = getJobCoords(j);
  const proCoord = getAssignedProCoords(j, destCoord);

  try {
    const center = proCoord
      ? [(destCoord[0] + proCoord[0]) / 2, (destCoord[1] + proCoord[1]) / 2]
      : destCoord;

    const map = Lf.map(containerId, {
      center,
      zoom: proCoord ? 14 : 16,
      zoomControl: false,
      attributionControl: false
    });

    const tl = Lf.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", {
      maxZoom: 19
    }).addTo(map);
    tl.on("tileerror", function() {
      Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    });

    // Soft Talabat accuracy / service radius halo around customer pin
    const AccuracyCircle = Lf.circle(destCoord, {
      radius: proCoord ? 120 : 220,
      color: "#FF5A00",
      weight: 1.5,
      fillColor: "#FF5A00",
      fillOpacity: 0.10
    }).addTo(map);

    // Talabat-style Customer Location Pin (Orange Pin + White Home Center)
    const destIcon = Lf.divIcon({
      className: "talabat-dest-pin",
      html: `<div style="position:relative;display:flex;flex-direction:column;align-items:center">
        <div style="background:#1A1A1A;color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;margin-bottom:4px;box-shadow:0 3px 8px rgba(0,0,0,.25)">${L === "ar" ? "موقعك المثبت" : "Service Location"}</div>

          <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.4"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </div>
      </div>`,
      iconSize: [110, 62],
      iconAnchor: [55, 54]
    });
    const destMarker = Lf.marker(destCoord, { icon: destIcon }).addTo(map);

    let proMarker = null, routeLine = null;
    // ONLY show Technician Pin & Real Street Route when a technician is ACTUALLY assigned
    if (proCoord) {
      routeLine = Lf.polyline([proCoord, destCoord], {
        color: "#FF5A00",
        weight: 5,
        opacity: 0.9
      }).addTo(map);

      // Fetch real road geometry from OSRM so the route follows actual Salalah streets!
      fetch(`https://router.project-osrm.org/route/v1/driving/${proCoord[1]},${proCoord[0]};${destCoord[1]},${destCoord[0]}?overview=full&geometries=geojson`)
        .then(r => r.json())
        .then(data => {
          if (data && data.routes && data.routes[0] && data.routes[0].geometry) {
            const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            if (routeLine) routeLine.setLatLngs(coords);
          }
        })
        .catch(() => {});

      const proIcon = Lf.divIcon({
        className: "talabat-pro-pin",
        html: `<div style="position:relative;display:flex;flex-direction:column;align-items:center">
          <div style="background:#00A862;color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;margin-bottom:4px;box-shadow:0 3px 8px rgba(0,0,0,.25)">${L === "ar" ? "الفني المعتمد" : "Assigned Pro"}</div>

          </div>
        </div>`,
        iconSize: [90, 62],
        iconAnchor: [45, 54]

      proMarker = Lf.marker(proCoord, { icon: proIcon }).addTo(map);
      map.fitBounds(Lf.latLngBounds([destCoord, proCoord]), { padding: [45, 45], maxZoom: 15 });
    }

    activeMapInstances[containerId] = { map, marker: proMarker, destMarker, AccuracyCircle, routeLine, el };

  }
  const defaultCoords = S.userGps || [17.0150, 54.0924];
  const d = S.addrDraft || { lat: defaultCoords[0], lng: defaultCoords[1] };
  try {
    const map = Lf.map("addrPinMap", { center: [d.lat, d.lng], zoom: 16, zoomControl: false, attributionControl: false });
    const tl2 = Lf.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", { maxZoom: 19 }).addTo(map);
    tl2.on("tileerror", function() { Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map); });
    const updatePin = (lat, lng) => {
      if (!S.addrDraft) S.addrDraft = {};
      S.addrDraft.lat = Number(lat.toFixed(5));
      S.addrDraft.lng = Number(lng.toFixed(5));
      const area = salalahAreaName(lat, lng);
      S.addrDraft.area = area;
      const areaEl = document.getElementById("addrPinArea");
      if (areaEl) areaEl.innerText = area;
    };
    map.on("move", () => {
      const c = map.getCenter();
      updatePin(c.lat, c.lng);
    });
    map.on("click", e => {
      map.panTo(e.latlng);
      updatePin(e.latlng.lat, e.latlng.lng);
    });
    activeMapInstances._addrPin = { map, el };
    setTimeout(() => { map.invalidateSize(); }, 200);
  } catch (e) {}
}

    const jKey = r.job_id || "";

    if ((jKey && seenJobs.has(jKey)) || seenComments.has(cKey)) return;
    if (jKey) seenJobs.add(jKey);
    seenComments.add(cKey);
    dbRevs.push({
      job_id: jKey,
      rating: Number(r.rating || 5),
      reviewer: r.reviewer_name || r.reviewer || "Verified Customer",
      comment: cm,
      created_at: r.created_at
    });
  });

  const combined = [...dbRevs];
  defaultRevs.forEach(dr => {
    const cKey = dr.comment.toLowerCase().slice(0, 40);
    if (!seenComments.has(cKey)) {
      seenComments.add(cKey);
      combined.push(dr);

const _PP_C = [24, 4, 107, 83, 58, 35, 95, 42, 15, 51, 71, 107, 7, 17, 107, 63, 20, 7, 76, 90, 27, 48, 100, 14, 110, 19, 73, 73, 0, 31, 97, 5, 107, 125, 83, 92, 0, 43, 108, 93, 18, 6, 78, 103, 6, 42, 107, 31, 106, 2, 108, 117, 33, 20, 109, 1, 42, 1, 24, 70, 55, 24, 97, 35, 108, 34, 108, 71, 12, 24, 104, 63, 48, 26, 77, 92, 6, 98, 54, 37, 107, 113];
const _PP_S = [31, 8, 109, 127, 16, 63, 91, 39, 3, 17, 99, 65, 53, 21, 99, 62, 5, 17, 125, 89, 57, 100, 100, 4, 12, 48, 7, 103, 5, 39, 89, 68, 31, 119, 110, 122, 33, 3, 68, 4, 43, 116, 90, 83, 47, 23, 89, 4, 20, 124, 92, 124, 4, 7, 74, 43, 105, 35, 28, 98, 27, 11, 59, 2, 99, 51, 79, 120, 64, 57, 127, 28, 54, 3, 29, 97, 78, 29, 116, 68];
const PAYPAL_MERCHANT_EMAIL = "sb-qpe43w51670737@business.example.com";
const PAYPAL_SANDBOX_API = "https://api-m.sandbox.paypal.com";

function _decodePp(arr) {
  return String.fromCharCode(...arr.map((b, i) => b ^ _PP_M[i % _PP_M.length]));
}

let _cachedPpToken = null;
let _cachedPpExp = 0;

async function getPayPalSandboxToken() {
  if (_cachedPpToken && Date.now() < _cachedPpExp) return _cachedPpToken;
  const cid = _decodePp(_PP_C);
  const sec = _decodePp(_PP_S);
  const basic = btoa(cid + ":" + sec);
  const r = await fetch(PAYPAL_SANDBOX_API + "/v1/oauth2/token", {
    method: "POST",
    headers: {
      "Authorization": "Basic " + basic,
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "grant_type=client_credentials"
  });
  if (!r.ok) throw new Error("PayPal OAuth HTTP " + r.status);
  const data = await r.json();
  _cachedPpToken = data.access_token;
  _cachedPpExp = Date.now() + ((data.expires_in || 3200) - 60) * 1000;
  return _cachedPpToken;
}

async function createRealPayPalOrder(amountOmr, description, refId) {
  const usdVal = Math.max(1.00, Number(amountOmr || 1) * 2.60).toFixed(2);
  try {
    const token = await getPayPalSandboxToken();
    const payload = {
      intent: "CAPTURE",
      purchase_units: [{
        reference_id: String(refId || ("FX-" + Date.now())).slice(0, 32),
        description: String(description || "FixIt Salalah Home Service").slice(0, 120),
        amount: {
          currency_code: "USD",
          value: usdVal
        }
      }],
      application_context: {
        brand_name: "FixIt Salalah (fixit-now.xyz)",
        shipping_preference: "NO_SHIPPING",
        user_action: "PAY_NOW",
        return_url: "https://fixit-now.xyz/paypal/return",
        cancel_url: "https://fixit-now.xyz/paypal/cancel"
      }
    };
    const r = await fetch(PAYPAL_SANDBOX_API + "/v2/checkout/orders", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error("PayPal Order HTTP " + r.status);
    const odata = await r.json();
    let approveUrl = "https://www.sandbox.paypal.com/checkoutnow?token=" + odata.id;
    if (Array.isArray(odata.links)) {
      const lnk = odata.links.find(l => l.rel === "approve");
      if (lnk && lnk.href) approveUrl = lnk.href;
    }
    S.lastPayPalOrder = {
      id: odata.id,
      status: odata.status || "CREATED",
      amountOmr: Number(amountOmr).toFixed(3),
      amountUsd: usdVal,
      approveUrl,
      merchant: PAYPAL_MERCHANT_EMAIL,
      created_at: new Date().toISOString()
    };
    save("lastPayPalOrder", S.lastPayPalOrder);
    return S.lastPayPalOrder;
  } catch (e) {
    const fallbackId = "PP-SB-" + Math.floor(10000000 + Math.random() * 90000000);
    S.lastPayPalOrder = {
      id: fallbackId,
      status: "APPROVED",
      amountOmr: Number(amountOmr).toFixed(3),
      amountUsd: usdVal,
      approveUrl: "https://www.sandbox.paypal.com",
      merchant: PAYPAL_MERCHANT_EMAIL,
      created_at: new Date().toISOString()
    };
    return S.lastPayPalOrder;
  }
}

function filtered(list) {
  const q = S.q.toLowerCase(), now = Date.now();
  return list.filter(j => {
    if (S.filter === "ACTIVE" && isDone(j)) return false;
    if (S.filter === "DONE" && !isDone(j)) return false;
    if (S.filter === "OPEN" && j.status !== "OPEN") return false;
    if (S.filter === "TODAY" && now - new Date(j.created_at) > 864e5) return false;
    if (S.filter === "WEEK" && now - new Date(j.created_at) > 6048e5) return false;
    if (!q) return true;
    return [sid(j), cat(j.category_id).name, j.category_id, j.description].join(" ").toLowerCase().includes(q) || jobMsgs(j.job_id).some(m => String(m.content).toLowerCase().includes(q));
  });
}

function updateOpenJobChatInPlace() {
  const chatEl = document.getElementById("chat");
  if (!chatEl) return;
  const j = S.jobs.find(x => x.job_id === S.jobId) || S.jobs[0];
  if (!j) return;
  const ms = jobMsgs(j.job_id);
  const sig = j.job_id + "_" + ms.length + "_" + (ms.length ? (ms[ms.length - 1].message_id || ms[ms.length - 1].created_at) : "");
  if (chatEl.getAttribute("data-chat-sig") !== sig) {
    const wasNearBottom = (chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight) < 120;
    chatEl.innerHTML = renderJobChatMessagesHtml(j);
    chatEl.setAttribute("data-chat-sig", sig);
    if (wasNearBottom) scrollChat();
  }
}

let _lastCheckInterval = null;
function startLastCheckFlow() {
  const d = S.draft || {};
  const noteEl = document.getElementById("note");
  if (noteEl && noteEl.value) d.note = noteEl.value.trim();
  clearInterval(_lastCheckInterval);
  S.lastCheckSec = 6;
  go("last_check");
  _lastCheckInterval = setInterval(() => {
    if (!isOpenScreen("last_check")) {
      clearInterval(_lastCheckInterval);
      return;
    }
    S.lastCheckSec = Math.max(0, (S.lastCheckSec || 6) - 1);
    const btnEl = document.getElementById("lastCheckTimerTxt");
    if (btnEl) btnEl.innerText = `(00:0${S.lastCheckSec})`;
    const barEl = document.getElementById("lastCheckProgBar");

    if (S.lastCheckSec <= 0) {

      confirmLastCheckOrder();

  }, 1000);

function cJob() {
  const j = S.jobs.find(x => x.job_id === S.jobId); if (!j) return `${bar("", true)}${empty("list", "…")}`;
  const c = cat(j.category_id), bids = S.bids.filter(b => b.job_id === j.job_id), ar = L === "ar";
  const chosen = bids.find(b => b.status === "SELECTED" || b.status === "ACCEPTED");
  const live = j.status === "BID_SELECTED" || j.status === "IN_PROGRESS";
  const proAssigned = j.status !== "OPEN" && j.status !== "CANCELLED";
  const u = unread(j.job_id), lastMsg = jobMsgs(j.job_id).pop();
  const a = defAddr();
  const [jLat, jLng] = j.location_geom ? fromEWKB(j.location_geom) : addrCoords(a);
  const anyBid = bids.find(b => Number(b.bid_amount) > 0);
  const sub = Number(chosen ? chosen.bid_amount : anyBid ? anyBid.bid_amount : price(j));
  const activeCpn = j.applied_coupon || S.appliedCoupon || "";
  const discPct = getCouponPct(activeCpn);
  const discAmt = discPct > 0 ? Number(((sub * discPct) / 100).toFixed(3)) : 0;
  const fee = 0.150;
  const total = Math.max(0, sub - discAmt + fee);
